асайды.»* — Сахих әл-Бухари 33, Сахих Муслим 59 (**Сахих**)"],"scholars":["**Имам әл-Ғазали** — *«Аманат — қоғамның негізі. Ол жоғалған кезде ешқандай қарым-қатынас — іскерлік, жеке немесе саяси — дұрыс қала алмайды.»* — *Ихья Улюм ад-Дин*","**Омар ибн әл-Хаттаб** — *«Аманатты ұстаныңдар, өйткені ол адамдар арасындағы барлық қарым-қатынастың тірегі.»* — Кеңінен айтылады."],"lessons":["Аманат (сенімділік) — шын мүміннің анықтаушы қасиеті; оның болмауы екіжүзділіктің белгісі.","Әрбір аманатты қайтарыңыз: сеніп айтылған сыр, ақша, берілген лауазым — толығымен орындаңыз.","Аманатты заңды иелеріне қайтарыңыз, олар сізге жамандық жасаса да — бұл Алланың бұйрығы (4:58).","Сенімділік беделін қалыптастырыңыз — ол кез келген дүниелік мүліктен де қымбат.\n---"]}}},{"id":"responsibility","categoryId":"personal-development","order":15,"translations":{"en":{"name":"Responsibility","quran":[{"reference":"2:286","text":"\"Allah does not burden a soul beyond that it can bear.\""},{"reference":"74:38","text":"\"Every soul, for what it has earned, will be retained.\""},{"reference":"33:72","text":"\"Indeed, We offered the trust to the heavens and the earth and the mountains, and they declined to bear it... but man [undertook to] bear it. Indeed, he was unjust and ignorant.\""}],"hadith":["*\"Every one of you is a shepherd and every one of you is responsible for his flock.\"* — Sahih al-Bukhari 893, Sahih Muslim 1829 (**Sahih**)","*\"On the Day of Judgement, the feet of a servant will not move until he is asked about his life and how he spent it, his knowledge and how he acted on it, his wealth and how he earned and spent it, and his body and how he used it.\"* — Jami' at-Tirmidhi 2417 (**Hasan**)"],"scholars":["**Umar ibn Al-Khattab** — *\"Hold yourself accountable before you are held accountable, and weigh your deeds before they are weighed for you.\"* — Widely attributed; Ibn al-Qayyim references this in *Madarij as-Salikin*.","**Ibn al-Qayyim** — *\"You will be asked about every moment of your life. Prepare an answer now.\"* — *Al-Fawa'id*"],"lessons":["You are a shepherd — of your family, your role, your community. No position is exempt from accountability.","On the Day of Judgement, you will be asked specifically about your time, knowledge, wealth, and body.","Self-accountability (*muhasabah*) daily is the believer's tool to live responsibly.","Accept responsibility for your choices — blaming others is incompatible with Islamic maturity.\n---"]},"ru":{"name":"Ответственность","quran":[{"reference":"2:286","text":"«Аллах не возлагает на душу сверх её возможностей.»"},{"reference":"74:38","text":"«Каждая душа будет удержана за то, что она приобрела.»"},{"reference":"33:72","text":"«Мы предложили вверить доверие небесам, земле и горам, но они отказались нести его и испугались его. Однако человек взял на себя это бремя.»"}],"hadith":["*«Каждый из вас является пастырем и каждый несёт ответственность за свою паству.»* — Сахих аль-Бухари 893, Сахих Муслим 1829 (**Достоверный**)","*«В Судный день раб не сдвинется с места, пока не будет спрошен о своей жизни и о том, как он её провёл; о своих знаниях и что он с ними делал; о своём богатстве — откуда взял и куда потратил; и о своём теле — как использовал его.»* — Джами ат-Тирмизи 2417 (**Хороший**)"],"scholars":["**Умар ибн аль-Хаттаб** — *«Призывайте себя к ответу прежде, чем вас призовут, и взвешивайте свои дела прежде, чем они будут взвешены.»* — Широко приписывается; Ибн аль-Каййим упоминает это в *Мадаридж ас-Саликин*.","**Ибн аль-Каййим** — *«Тебя спросят о каждом мгновении твоей жизни. Приготовь ответ сейчас.»* — *аль-Фаваид*"],"lessons":["Вы — пастырь: своей семьи, своей роли, своей общины. Никакое положение не освобождает от ответственности.","В Судный день вас спросят конкретно о вашем времени, знаниях, богатстве и теле.","Ежедневное самоотчёт (*мухасаба*) — инструмент верующего для ответственной жизни.","Принимайте ответственность за свои решения — обвинение других несовместимо с исламской зрелостью.\n---"]},"kk":{"name":"Жауапкершілік","quran":[{"reference":"2:286","text":"«Алла жанды шамасынан артық ауыртпайды.»"},{"reference":"74:38","text":"«Әрбір жан өзі тапқанымен кепілдікте.»"},{"reference":"33:72","text":"«Біз аманатты аспандарға, жерге және таулардан ұсындық, олар оны көтеруден бас тартты... Бірақ адам оны өз мойнына алды.»"}],"hadith":["*«Әрқайсыларыңыз бақташысыз және әрқайсыларыңыз өз қарамағындағылар үшін жауаптысыз.»* — Сахих әл-Бухари 893, Сахих Муслим 1829 (**Сахих**)","*«Қияметте бандалар аяқ астынан қозғалмайды, тіпті өмірі туралы және оны қалай өткізгені туралы сұралмаса.»* — Жами ат-Тирмизи 2417 (**Хасан**)"],"scholars":["**Омар ибн әл-Хаттаб** — *«Есепке тартылмай тұрып өзіңді есепке тарт, және амалдарың өлшенбей тұрып өзің өлше.»* — Кеңінен айтылады.","**Ибн әл-Қаййим** — *«Өміріңнің әрбір сәті туралы сұрайды. Қазір жауап дайында.»* — *Әл-Фауаид*"],"lessons":["Сіз бақташысыз — отбасыңыздың, рөліңіздің, қауымыңыздың. Ешқандай лауазым жауапкершіліктен босатпайды.","Қияметте уақытыңыз, біліміңіз, байлығыңыз және денеңіз туралы нақты сұрайды.","Күнделікті өзін-өзі есепке тарту (*мухасаба*) — жауапты өмір сүруге арналған мүміннің құралы.","Шешімдеріңізге жауапкершілік алыңыз — басқаларды кінәлау Исламдық жетілуімен сыйыспайды.\n---"]}}},{"id":"discipline","categoryId":"personal-development","order":16,"translations":{"en":{"name":"Discipline","quran":[{"reference":"103:1–3","text":"\"By time, indeed mankind is in loss — except for those who have believed and done righteous deeds and advised each other to truth and advised each other to patience.\""},{"reference":"51:17–18","text":"\"They used to sleep but little of the night, and in the hours before dawn they would ask forgiveness.\""},{"reference":"2:45","text":"\"And seek help through patience and prayer; indeed, it is difficult except for the humbly submissive.\""}],"hadith":["*\"Take on deeds that you are able to maintain consistently, for Allah does not tire of giving reward until you tire of doing deeds.\"* — Sahih al-Bukhari 43, Sahih Muslim 783 (**Sahih**)","*\"The most beloved deeds to Allah are the most consistent ones, even if small.\"* — Sahih al-Bukhari 6464 (**Sahih**)"],"scholars":["**Ibn al-Qayyim** — *\"Disciplining the soul is harder than disciplining the body. But without it, a person achieves nothing of value in religion or worldly life.\"* — *Madarij as-Salikin*","**Imam Al-Ghazali** — *\"Small consistent acts of worship build the character more than large irregular bursts of devotion.\"* — *Ihya' Ulum ad-Din*"],"lessons":["Consistency over intensity — the Prophet ﷺ confirmed that Allah loves what is maintained regularly, even if small.","The companions used to sleep little at night and rise before dawn — discipline in worship creates discipline in life.","Build habits anchored to prayer times; the five daily prayers are themselves a discipline training system.","Review your daily schedule: does it reflect your stated priorities?\n---"]},"ru":{"name":"Дисциплина","quran":[{"reference":"103:1–3","text":"«Клянусь временем, поистине, человек в убытке — кроме тех, кто уверовал, совершал праведные дела, заповедовал истину и заповедовал терпение.»"},{"reference":"51:17–18","text":"«Они спали лишь малую часть ночи, а на заре просили прощения.»"},{"reference":"2:45","text":"«Прибегайте к терпению и молитве — воистину, это тяжело, кроме как для смиренных.»"}],"hadith":["*«Берите на себя столько дел, сколько вы в состоянии совершать постоянно, ибо Аллах не устаёт давать награду, пока вы не устанете совершать деяния.»* — Сахих аль-Бухари 43, Сахих Муслим 783 (**Достоверный**)","*«Наиболее любимые деяния пред Аллахом — наиболее постоянные из них, пусть даже незначительные.»* — Сахих аль-Бухари 6464 (**Достоверный**)"],"scholars":["**Ибн аль-Каййим** — *«Дисциплина в отношении души труднее, чем дисциплина в отношении тела. Но без неё человек не достигнет ничего ценного ни в религии, ни в мирской жизни.»* — *Мадаридж ас-Саликин*","**Имам аль-Газали** — *«Небольшие постоянные дела поклонения формируют характер лучше, чем большие нерегулярные всплески усердия.»* — *Ихья Улюм ад-Дин*"],"lessons":["Постоянство важнее интенсивности — Пророк ﷺ подтвердил, что Аллах любит то, что поддерживается регулярно, пусть даже это небольшое.","Сподвижники мало спали ночью и вставали до рассвета — дисциплина в поклонении создаёт дисциплину в жизни.","Стройте привычки, привязанные ко времени молитв; пять ежедневных молитв сами по себе — система обучения дисциплине.","Пересмотрите своё ежедневное расписание: отражает ли оно ваши заявленные приоритеты?\n---"]},"kk":{"name":"Тәртіп","quran":[{"reference":"103:1–3","text":"«Уақытқа ант етемін, расында адам зиянда — иман келтіріп, жақсы амал жасап, бір-біріне шындықты өсиет етіп, бір-біріне сабырды өсиет еткендерден басқа.»"},{"reference":"51:17–18","text":"«Олар түннің аздаған бөлігінде ғана ұйықтайтын; таң алдында кешірім сұрайтын еді.»"},{"reference":"2:45","text":"«Сабырмен және намазбен көмек сұраңдар; бұл тек бойұсынушыларға ғана оңай.»"}],"hadith":["*«Үздіксіз орындай алатын амалдарды қолданыңыз, өйткені Алла сендер амал жасаудан жалыққанша сыйақы беруден жалықпайды.»* — Сахих әл-Бухари 43, Сахих Муслим 783 (**Сахих**)","*«Алланың алдындағы ең сүйікті амалдар — аз болса да үздіксіздері.»* — Сахих әл-Бухари 6464 (**Сахих**)"],"scholars":["**Ибн әл-Қаййим** — *«Жанды тәртіпке салу денені тәртіпке салудан қиын. Бірақ онсыз адам дінде де, дүниелік өмірде де ештеңеге қол жеткізе алмайды.»* — *Мадаридж әс-Саликин*","**Имам әл-Ғазали** — *«Ғибадаттың кішкентай үздіксіз амалдары мінез-құлықты ірі бірақ үзік-үзік ынтамен жасалған амалдардан артық қалыптастырады.»* — *Ихья Улюм ад-Дин*"],"lessons":["Қарқындылықтан гөрі үзіліссіздік маңызды — Пайғамбар ﷺ аз болса да үнемі орындалатынды Алла сүйетінін растады.","Сахабалар түннің аздаған бөлігінде ұйықтап, таң алдында тұрды — ғибадаттағы тәртіп өмірдегі тәртіпті қалыптастырады.","Намаз уақытына байланысты әдеттерді дамытыңыз; бес уақыт намаз — өзіндік тәртіп тренингі жүйесі.","Күнделікті кестеңізді қарастырыңыз: ол жарияланған басымдықтарыңызды бейнелей ме?\n---"]}}},{"id":"patience","categoryId":"personal-development","order":17,"translations":{"en":{"name":"Patience","quran":[{"reference":"2:153","text":"\"O you who have believed, seek help through patience and prayer. Indeed, Allah is with the patient.\""},{"reference":"39:10","text":"\"Indeed, the patient will be given their reward without account.\""},{"reference":"3:200","text":"\"O you who have believed, persevere and endure and remain stationed and fear Allah that you may be successful.\""}],"hadith":["*\"How wonderful is the affair of the believer! If something good happens to him, he is grateful — and that is good for him. If something bad happens to him, he is patient — and that is good for him. And this applies only to the believer.\"* — Sahih Muslim 2999 (**Sahih**)","*\"Whoever tries to be patient, Allah will give him patience.\"* — Sahih al-Bukhari 1469, Sahih Muslim 1053 (**Sahih**)"],"scholars":["**Ali ibn Abi Talib** — *\"Patience to faith is like the head to the body. A body without a head is dead; faith without patience is dead.\"* — Widely attributed.","**Ibn al-Qayyim** — *\"Patience is of three kinds: patience in obeying Allah, patience in abstaining from sin, and patience in accepting Allah's decree. Together they are the whole of religion.\"* — *Uddat as-Sabirin*"],"lessons":["Patience is rewarded without limit or account (39:10) — no other deed is given this distinction.","The believer wins in every situation: gratitude in ease, patience in hardship — both lead to reward.","Patience has three forms — in worship, in avoiding sin, and in trials. Strengthen all three.","Patience is not passive — it requires active choice, repeated every moment of difficulty.\n---"]},"ru":{"name":"Терпение","quran":[{"reference":"2:153","text":"«О те, кто уверовал! Прибегайте за помощью к терпению и молитве. Воистину, Аллах — с терпеливыми.»"},{"reference":"39:10","text":"«Воистину, терпеливым их награда будет выдана сполна без счёта.»"},{"reference":"3:200","text":"«О те, кто уверовал! Терпите, укрепляйтесь в терпении, несите стражу и бойтесь Аллаха — быть может, вы преуспеете.»"}],"hadith":["*«Как удивительно положение верующего! Поистине, всё его дело — благо: если его постигает радость, он благодарит — и это для него благо; если его постигает горе, он терпит — и это для него благо. И это только для верующего.»* — Сахих Муслим 2999 (**Достоверный**)","*«Кто стремится быть терпеливым, Аллах наделит его терпением.»* — Сахих аль-Бухари 1469, Сахих Муслим 1053 (**Достоверный**)"],"scholars":["**Али ибн Аби Талиб** — *«Терпение к вере — как голова к телу. Тело без головы мертво; вера без терпения мертва.»* — Широко приписывается.","**Ибн аль-Каййим** — *«Терпение бывает трёх видов: терпение в повиновении Аллаху, терпение в воздержании от греха и терпение в принятии решений Аллаха. Вместе они составляют всю религию.»* — *Уддат ас-Сабирин*"],"lessons":["Терпение вознаграждается без счёта (39:10) — ни одному другому деянию не дано такого различия.","Верующий побеждает в любой ситуации: благодарность в радости, терпение в трудностях — оба ведут к награде.","Терпение имеет три формы — в поклонении, в избегании греха и в испытаниях. Укрепляйте все три.","Терпение — не пассивность: это активный выбор, повторяемый в каждый момент трудности.\n---"]},"kk":{"name":"Сабыр","quran":[{"reference":"2:153","text":"«Ей, иман келтіргендер! Сабырмен және намазбен көмек сұраңдар. Расында, Алла сабырлылармен бірге.»"},{"reference":"39:10","text":"«Расында, сабырлыларға сыйақылары есепсіз толық беріледі.»"},{"reference":"3:200","text":"«Ей, иман келтіргендер! Сабыр етіңдер, сабырда бекіңдер, нобайда тұрыңдар және Алладан қорқыңдар — мүмкін сәтті боларсыңдар.»"}],"hadith":["*«Мүміннің ісі таң қалдырады! Егер оған жақсылық тисе, шүкір етеді — бұл оған жақсы; егер оған жамандық тисе, сабыр етеді — бұл да оған жақсы. Бұл тек мүмінге ғана тән.»* — Сахих Муслим 2999 (**Сахих**)","*«Сабырлы болуға тырысқан адамға Алла сабыр береді.»* — Сахих әл-Бухари 1469, Сахих Муслим 1053 (**Сахих**)"],"scholars":["**Али ибн Әби Талиб** — *«Сабыр иманға денеге бастың қатынасы сияқты. Бассыз дене өлі; сабырсыз иман өлі.»* — Кеңінен айтылады.","**Ибн әл-Қаййим** — *«Сабыр үш түрлі болады: Аллаға бағынудағы сабыр, күнәдан сақтанудағы сабыр және Алланың үкімін қабылдаудағы сабыр. Бірге олар діннің бәрін құрайды.»* — *Уддат әс-Сабирин*"],"lessons":["Сабыр есепсіз сыйақы береді (39:10) — басқа ешбір амалға мұндай ерекшелік берілмеген.","Мүмін кез келген жағдайда ұтады: жақсылықта шүкір, қиындықта сабыр — екеуі де сыйақыға апарады.","Сабырдың үш формасы бар — ғибадатта, күнәдан сақтануда және сынақтарда. Үшеуін де нығайтыңыз.","Сабыр — пассивтілік емес: бұл қиындықтың әрбір сәтінде қайталанатын белсенді таңдау.\n---"]}}},{"id":"gratitude","categoryId":"personal-development","order":18,"translations":{"en":{"name":"Gratitude","quran":[{"reference":"14:7","text":"\"If you are grateful, I will surely increase you [in favour]; but if you deny, indeed My punishment is severe.\""},{"reference":"2:152","text":"\"So remember Me; I will remember you. And be grateful to Me and do not deny Me.\""},{"reference":"31:12","text":"\"Whoever is grateful is only grateful for [the benefit of] himself. And whoever denies [His favour] — then indeed, Allah is Free of need and Praiseworthy.\""}],"hadith":["*\"He who does not thank people does not thank Allah.\"* — Sunan Abu Dawood 4811, Jami' at-Tirmidhi 1954 (**Sahih**)","*\"Allah is pleased with His servant who, when he eats food, praises Him, or when he drinks, praises Him.\"* — Sahih Muslim 2734 (**Sahih**)"],"scholars":["**Ibn al-Qayyim** — *\"Gratitude is one of the highest stations of the worshipper. It requires three things: acknowledgment in the heart, praise with the tongue, and using the blessing in obedience to Allah.\"* — *Madarij as-Salikin*","**Imam Al-Ghazali** — *\"The grateful person sees every blessing as a gift that must be acknowledged and protected. The ungrateful sees it as a right and is never satisfied.\"* — *Ihya' Ulum ad-Din*"],"lessons":["Gratitude is guaranteed to increase your blessings — this is Allah's direct promise (14:7).","True gratitude has three parts: recognition in the heart, praise on the tongue, and using the blessing correctly.","Thanking people is inseparable from thanking Allah — they are linked in the same hadith.","Begin and end each day by naming specific blessings. This is the practical foundation of shukr.\n---"]},"ru":{"name":"Благодарность","quran":[{"reference":"14:7","text":"«Если вы будете благодарны, Я непременно увеличу вам [блага]. Если же вы будете неблагодарны, то ведь Моё наказание сурово.»"},{"reference":"2:152","text":"«Поминайте Меня, и Я буду помнить вас. Благодарите Меня и не будьте неблагодарны.»"},{"reference":"31:12","text":"«Тот, кто благодарен, благодарен лишь для самого себя, а тот, кто неблагодарен — ведь Аллах богат и достохвален.»"}],"hadith":["*«Тот, кто не благодарит людей, не благодарит Аллаха.»* — Сунан Абу Дауд 4811, Джами ат-Тирмизи 1954 (**Достоверный**)","*«Аллах доволен Своим рабом, который, поев, восхваляет Его, или, попив, восхваляет Его.»* — Сахих Муслим 2734 (**Достоверный**)"],"scholars":["**Ибн аль-Каййим** — *«Благодарность — одна из высочайших ступеней поклоняющегося. Она требует трёх вещей: признания в сердце, восхваления языком и использования блага в повиновении Аллаху.»* — *Мадаридж ас-Саликин*","**Имам аль-Газали** — *«Благодарный видит каждое благо как дар, который нужно признать и сохранить. Неблагодарный считает его своим правом и никогда не бывает доволен.»* — *Ихья Улюм ад-Дин*"],"lessons":["Благодарность гарантированно увеличивает ваши блага — это прямое обещание Аллаха (14:7).","Истинная благодарность состоит из трёх частей: признание в сердце, восхваление языком и правильное использование блага.","Благодарность людям неотделима от благодарности Аллаху — они связаны в одном хадисе.","Начинайте и заканчивайте каждый день, называя конкретные блага. Это практическая основа шукра.\n---"]},"kk":{"name":"Шүкіршілік","quran":[{"reference":"14:7","text":"«Егер шүкір ететін болсаңдар, сендерге [игілікті] арттырамын; егер кәпір болсаңдар, расында Менің азабым қатты.»"},{"reference":"2:152","text":"«Мені еске алыңдар, Мен де сендерді еске аламын. Маған шүкір етіңдер, Маған кәпір болмаңдар.»"},{"reference":"31:12","text":"«Кім шүкір етсе, тек өзі үшін шүкір етеді; кім кәпір болса — расында Алла Бай және Мақтаулы.»"}],"hadith":["*«Адамдарға шүкір етпейтін адам Аллаға шүкір етпейді.»* — Сунан Әбу Дауд 4811, Жами ат-Тирмизи 1954 (**Сахих**)","*«Алла тамақ ішіп болғанда Оны мадақтайтын немесе су ішіп болғанда Оны мадақтайтын бандасынан риза болады.»* — Сахих Муслим 2734 (**Сахих**)"],"scholars":["**Ибн әл-Қаййим** — *«Шүкіршілік — ғибадат жасаушының ең жоғары деңгейлерінің бірі. Ол үш нәрсені талап етеді: жүректегі мойындау, тілмен мадақтау және игілікті Аллаға бағынуда пайдалану.»* — *Мадаридж әс-Саликин*","**Имам әл-Ғазали** — *«Шүкіршілік адам әрбір игілікті мойындап, сақтауы тиіс сыйлық ретінде көреді. Шүкірсіз адам оны құқық деп санайды және ешқашан қанағаттанбайды.»* — *Ихья Улюм ад-Дин*"],"lessons":["Шүкіршілік игіліктеріңізді арттырады — бұл Алланың тікелей уәдесі (14:7).","Шын шүкіршіліктің үш бөлігі бар: жүректегі мойындау, тілмен мадақтау және игілікті дұрыс пайдалану.","Адамдарға шүкір ету Аллаға шүкір етуден ажырамайды — олар бір хадисте байланысты.","Әрбір күнді нақты игіліктерді атап өтіп бастаңыз және аяқтаңыз. Бұл шүкрдің практикалық негізі.\n---"]}}},{"id":"humility","categoryId":"personal-development","order":19,"translations":{"en":{"name":"Humility","quran":[{"reference":"25:63","text":"\"And the servants of the Most Merciful are those who walk upon the earth in humility, and when the ignorant address them, they say [words of] peace.\""},{"reference":"31:18","text":"\"And do not turn your cheek [in contempt] toward people and do not walk through the earth exultantly. Indeed, Allah does not like everyone self-deluded and boastful.\""},{"reference":"7:146","text":"\"I will turn away from My signs those who are arrogant upon the earth without right.\""}],"hadith":["*\"Charity does not decrease wealth, Allah does not increase a servant in pardoning others except in honour, and no one humbles himself for the sake of Allah except that Allah raises him.\"* — Sahih Muslim 2588 (**Sahih**)","*\"Allah has revealed to me that you should be humble, so that no one boasts over another and no one oppresses another.\"* — Sahih Muslim 2865 (**Sahih**)"],"scholars":["**Imam Al-Ghazali** — *\"Humility is to see yourself as less than others — and to see any good in you as from Allah alone, not from yourself.\"* — *Ihya' Ulum ad-Din*","**Hasan al-Basri** — *\"The sign of a humble person is that he does not see himself as better than anyone he looks at.\"* — Widely attributed in classical adab literature."],"lessons":["Humility raises you in Allah's sight — arrogance lowers you (Sahih Muslim 2588).","The mark of a truly humble person is calm, peaceful responses to the ignorant (25:63).","Never walk arrogantly — even your body language is an act of worship or of pride.","When praised, return the praise to Allah. Every good in you is from Him.\n---"]},"ru":{"name":"Смирение","quran":[{"reference":"25:63","text":"«Рабы Милостивого — те, которые ступают по земле смиренно, а когда невежды обращаются к ним с речью, они говорят: \"Мир!\"»"},{"reference":"31:18","text":"«Не отворачивай своего лица от людей из высокомерия и не шествуй по земле кичливо. Поистине, Аллах не любит всяких гордецов и хвастунов.»"},{"reference":"7:146","text":"«Я отвращу от Своих знамений тех, которые возносятся на земле без права.»"}],"hadith":["*«Садака не уменьшает богатства, Аллах увеличивает раба только в почёте за прощение, и никто не смиряется ради Аллаха, кроме как Аллах возвышает его.»* — Сахих Муслим 2588 (**Достоверный**)","*«Аллах открыл мне, что вы должны быть смиренными, чтобы никто не превозносился над другим и не притеснял другого.»* — Сахих Муслим 2865 (**Достоверный**)"],"scholars":["**Имам аль-Газали** — *«Смирение — это видеть себя меньше других и видеть всё благое в себе как исходящее только от Аллаха, а не от самого себя.»* — *Ихья Улюм ад-Дин*","**Хасан аль-Басри** — *«Признак смиренного человека — то, что он не считает себя лучше кого-либо из тех, на кого смотрит.»* — Широко приписывается."],"lessons":["Смирение возвышает тебя пред Аллахом — гордыня унижает (Сахих Муслим 2588).","Признак истинно смиренного человека — спокойные и мирные ответы невежественным (25:63).","Никогда не ходите высокомерно — даже язык тела является актом поклонения или гордыни.","Когда тебя хвалят, верни хвалу Аллаху. Всё благое в тебе — от Него.\n---"]},"kk":{"name":"Кішіпейілділік","quran":[{"reference":"25:63","text":"«Рахманның бандалары — жер бетінде кішіпейілмен жүретіндер; надандар оларға сөз айтса, \"Сәлем\" деп жауап береді.»"},{"reference":"31:18","text":"«Адамдардан менсінбей бет бұрма және жер бетінде тәкаппарлықпен жүрме. Расында, Алла әрбір тәкаппар мақтаншақты сүймейді.»"},{"reference":"7:146","text":"«Жерде негізсіз тәкаппарланатындарды Менің аяттарымнан бұрамын.»"}],"hadith":["*«Садақа байлықты кемітпейді, Алла кешіру үшін бандасының тек құрметін арттырады, ал Алла үшін кішіпейіл болған адамды тек Алла жоғарылатады.»* — Сахих Муслим 2588 (**Сахих**)","*«Алла маған сендердің кішіпейіл болуларыңызды уахи етті, бір-бірлеріңнен асып кетпеуіңіз және бір-бірлеріңізді езбеуіңіз үшін.»* — Сахих Муслим 2865 (**Сахих**)"],"scholars":["**Имам әл-Ғазали** — *«Кішіпейілділік — өзіңді басқалардан кем деп санау және өзіңдегі барлық жақсылықты өзіңнен емес, тек Алладан деп санау.»* — *Ихья Улюм ад-Дин*","**Хасан әл-Басри** — *«Кішіпейіл адамның белгісі — ол қараған адамдардың ешқайсысынан өзін жақсы деп санамайды.»* — Кеңінен айтылады."],"lessons":["Кішіпейілділік сізді Алланың алдында биіктетеді — тәкаппарлық төмендетеді (Сахих Муслим 2588).","Шынымен кішіпейіл адамның белгісі — надандарға тыныш және бейбіт жауаптар (25:63).","Ешқашан тәкаппарлықпен жүрмеңіз — тіпті дене тілі де ғибадат немесе мақтану актісі.","Мақтауға ие болғанда, мақтауды Аллаға қайтарыңыз. Өзіңдегі барлық жақсылық — Одан.\n---"]}}},{"id":"self-control","categoryId":"personal-development","order":20,"translations":{"en":{"name":"Self-control","quran":[{"reference":"3:134","text":"\"Those who... restrain anger and who pardon the people — and Allah loves the doers of good.\""},{"reference":"53:32","text":"\"Those who avoid the major sins and immoralities, only [committing] slight ones. Indeed, your Lord is vast in forgiveness.\""},{"reference":"79:40–41","text":"\"But as for he who feared the position of his Lord and prevented the soul from [unlawful] inclination — then indeed, Paradise will be [his] refuge.\""}],"hadith":["*\"The strong man is not the one who can wrestle others down. The strong man is the one who controls himself in anger.\"* — Sahih al-Bukhari 6114, Sahih Muslim 2609 (**Sahih**)","*\"Do not become angry.\" He repeated it three times.*— Sahih al-Bukhari 6116 (**Sahih**)"],"scholars":["**Ali ibn Abi Talib** — *\"The greatest victory is a man's victory over himself.\"* — Widely attributed.","**Ibn al-Qayyim** — *\"The nafs (self) is either your mount to Allah or your mount to destruction. It must be controlled, or it will control you.\"* — *Madarij as-Salikin*"],"lessons":["The Islamic definition of strength is self-mastery, not physical dominance.","Controlling anger is one of the most repeated practical commands in the Sunnah.","Paradise is promised to those who restrain their souls from unlawful desire (79:40–41).","Build self-control through fasting — the Prophet ﷺ called it a shield.\n---"]},"ru":{"name":"Самоконтроль","quran":[{"reference":"3:134","text":"«Тех, кто... сдерживает гнев и прощает людям — ведь Аллах любит творящих добро.»"},{"reference":"53:32","text":"«Тем, кто избегает больших грехов и мерзостей, кроме мелких проступков.»"},{"reference":"79:40–41","text":"«А тому, кто боялся предстояния пред своим Господом и удерживал душу от страстей, — поистине, Рай станет его жилищем.»"}],"hadith":["*«Сильный — не тот, кто побеждает в борьбе. Сильный — тот, кто владеет собой во время гнева.»* — Сахих аль-Бухари 6114, Сахих Муслим 2609 (**Достоверный**)","*«Не гневайся.\" Он повторил это три раза.»* — Сахих аль-Бухари 6116 (**Достоверный**)"],"scholars":["**Али ибн Аби Талиб** — *«Величайшая победа — победа человека над самим собой.»* — Широко приписывается.","**Ибн аль-Каййим** — *«Нафс (душа) — либо твой скакун к Аллаху, либо твой скакун к погибели. Ею нужно управлять, иначе она будет управлять тобой.»* — *Мадаридж ас-Саликин*"],"lessons":["Исламское определение силы — владение собой, а не физическое превосходство.","Контроль над гневом — одна из наиболее повторяемых практических заповедей Сунны.","Рай обещан тем, кто удерживает душу от запретных желаний (79:40–41).","Укрепляйте самоконтроль через пост — Пророк ﷺ называл его щитом.\n---"]},"kk":{"name":"Өзін-өзі меңгеру","quran":[{"reference":"3:134","text":"«Ашуын тежейтіндер және адамдарды кешіретіндер — Алла ізгілік жасаушыларды сүйеді.»"},{"reference":"53:32","text":"«Ұсақ кемшіліктерден басқа үлкен күнәлар мен ұятсыздықтардан аулақ жүретіндер.»"},{"reference":"79:40–41","text":"«Раббының алдында тұруынан қорқып, нәпсіні пасық ниеттен тыйған адамға — расында жұмақ болады паналайтын жері.»"}],"hadith":["*«Күшті — күрес жеңетін адам емес. Күшті — ашу кезінде өзін меңгеретін адам.»* — Сахих әл-Бухари 6114, Сахих Муслим 2609 (**Сахих**)","*«Ашуланба.\" Ол үш рет қайталады.»* — Сахих әл-Бухари 6116 (**Сахих**)"],"scholars":["**Али ибн Әби Талиб** — *«Ең үлкен жеңіс — адамның өз-өзін жеңуі.»* — Кеңінен айтылады.","**Ибн әл-Қаййим** — *«Нәпсі — не Аллаға апаратын мініс аты, не қирауға апаратын мініс аты. Оны меңгеру керек, болмаса ол сені меңгереді.»* — *Мадаридж әс-Саликин*"],"lessons":["Исламдық күш анықтамасы — өзін-өзі меңгеру, физикалық үстемдік емес.","Ашуды бақылау — Сүннеттегі ең жиі қайталанатын практикалық өсиеттердің бірі.","Жұмақ нәпсіні тыйғандарға уәде етілген (79:40–41).","Өзін-өзі меңгеруді ораза арқылы нығайтыңыз — Пайғамбар ﷺ оны қалқан деп атады.\n---"]}}},{"id":"time-management","categoryId":"personal-development","order":21,"translations":{"en":{"name":"Time Management","quran":[{"reference":"103:1–2","text":"\"By time, indeed mankind is in loss.\""},{"reference":"23:61","text":"\"It is those who hasten to good deeds, and they outstrip [others] therein.\""},{"reference":"63:11","text":"\"Allah will never delay a soul when its time has come. And Allah is acquainted with what you do.\""}],"hadith":["*\"Take advantage of five before five: your youth before your old age, your health before your illness, your wealth before your poverty, your free time before your preoccupation, and your life before your death.\"* — Mustadrak al-Hakim, Al-Bayhaqi (**Sahih** per Al-Albani in *Silsilat al-Ahadith as-Sahihah* 1077)","*\"Two blessings which many people squander: health and free time.\"* — Sahih al-Bukhari 6412 (**Sahih**)"],"scholars":["**Ibn al-Qayyim** — *\"Your time is your life. Wasting it is wasting your life. Most people deceive themselves about their time.\"* — *Al-Fawa'id*","**Imam Al-Ghazali** — *\"The hour that passes without benefit is a loss that cannot be recovered. Begin with what matters most.\"* — *Ihya' Ulum ad-Din*"],"lessons":["Allah swore by time (103) — this alone signals its supreme importance.","Free time and health are blessings that most people squander — protect both deliberately.","Start with what matters most: prayer, then obligations, then what is beneficial.","Ask yourself at the end of each day: *What did this day add to my account before Allah?*\n-e \n---"]},"ru":{"name":"Управление временем","quran":[{"reference":"103:1–2","text":"«Клянусь временем, поистине, человек в убытке.»"},{"reference":"23:61","text":"«Именно они спешат к добрым делам и опережают в них других.»"},{"reference":"63:11","text":"«Аллах не откладывает [смерть] души, когда приходит её срок. Аллах ведает о том, что вы делаете.»"}],"hadith":["*«Воспользуйся пятью вещами до пяти: молодостью до старости, здоровьем до болезни, богатством до бедности, свободным временем до занятости и жизнью до смерти.»* — аль-Байхаки, аль-Мустадрак (**Достоверный** по аль-Альбани, *Силсилат аль-Ахадис ас-Сахиха* 1077)","*«Два блага, которыми многие люди пренебрегают: здоровье и свободное время.»* — Сахих аль-Бухари 6412 (**Достоверный**)"],"scholars":["**Ибн аль-Каййим** — *«Твоё время — твоя жизнь. Тратить его впустую — значит тратить свою жизнь. Большинство людей обманывают самих себя относительно своего времени.»* — *аль-Фаваид*","**Имам аль-Газали** — *«Час, прошедший без пользы, — потеря, которую нельзя возместить. Начинайте с самого важного.»* — *Ихья Улюм ад-Дин*"],"lessons":["Аллах поклялся временем (103) — это само по себе указывает на его высочайшую значимость.","Свободное время и здоровье — блага, которыми большинство людей пренебрегает; сознательно берегите их.","Начинайте с самого важного: молитва, затем обязательства, затем полезное.","Спрашивайте себя в конце каждого дня: *«Что этот день добавил в мою книгу деяний пред Аллахом?»*\n---"]},"kk":{"name":"Уақытты басқару","quran":[{"reference":"103:1–2","text":"«Уақытқа ант етемін, расында адам зиянда.»"},{"reference":"23:61","text":"«Олар жақсы амалдарға асығады және оларда алда жүреді.»"},{"reference":"63:11","text":"«Алла мерзімі жеткен жанды ешқашан кешіктірмейді. Алла сендердің амалдарыңнан хабардар.»"}],"hadith":["*«Бесеуін бесеуінен бұрын пайдалан: жастықты кәрілікке дейін, денсаулықты ауруға дейін, байлықты кедейлікке дейін, бос уақытты бәзбіреу болғанға дейін және өмірді өлімге дейін.»* — Байхаки (**Сахих**, әл-Албани бойынша, *Силсилат әл-Ахадис ас-Сахиха* 1077)","*«Көп адамдар немқұрайды болатын екі игілік: денсаулық және бос уақыт.»* — Сахих әл-Бухари 6412 (**Сахих**)"],"scholars":["**Ибн әл-Қаййим** — *«Уақытың — өміріңіз. Оны босқа өткізу — өмірді босқа өткізу. Көп адамдар өз уақыттары туралы өздерін алдайды.»* — *Әл-Фауаид*","**Имам әл-Ғазали** — *«Пайдасыз өткен сағат — орнын толтыруға болмайтын шығын. Ең маңыздысынан бастаңыз.»* — *Ихья Улюм ад-Дин*"],"lessons":["Алла уақытқа ант етті (103) — бұлай болады, оның ең жоғары маңыздылығын білдіреді.","Бос уақыт пен денсаулық — көп адамдар немқұрайды болатын игіліктер; екеуін де саналы түрде сақтаңыз.","Ең маңыздысынан бастаңыз: намаз, содан кейін міндеттер, содан кейін пайдалы нәрсе.","Әрбір күннің соңында өзіңізден сұраңыз: *«Бұл күн Алланың алдындағы кітапшама не қосты?»*\n---"]}}},{"id":"hard-work","categoryId":"work-success","order":22,"translations":{"en":{"name":"Hard Work","quran":[{"reference":"53:39","text":"\"And that there is not for man except that [good] for which he strives.\""},{"reference":"9:105","text":"\"And say: Do [as you will], for Allah will see your deeds, and [so will] His Messenger and the believers.\""},{"reference":"11:6","text":"\"And there is no creature on earth but that upon Allah is its provision.\""}],"hadith":["*\"No one has ever eaten food better than what he earns from the work of his own hands. The Prophet of Allah, Dawud, used to eat from the work of his own hands.\"* — Sahih al-Bukhari 2072 (**Sahih**)","*\"Allah loves that when any of you does something, he does it with excellence (itqan).\"* — Al-Bayhaqi, Shu'ab al-Iman (**Sahih** per Al-Albani)"],"scholars":["**Umar ibn Al-Khattab** — *\"No one should sit back from seeking livelihood and say 'O Allah, provide for me' — for you know that the sky does not rain gold or silver.\"* — Widely attributed in classical works.","**Imam Ash-Shafi'i** — *\"Work and rely on Allah — for the one who works and relies on Allah is greater than the one who merely waits.\"* — Widely attributed."],"lessons":["Earning through your own hands is praised in Islam — the Prophet Dawud (عليه السلام) is cited as the example.","Whatever you do, do it with excellence (itqan) — Allah loves mastery in any work.","Work is an act of worship when done with the right intention and by halal means.","Do not let tawakkul become passivity — Allah's provision comes through effort, not idleness.\n---"]},"ru":{"name":"Усердный труд","quran":[{"reference":"53:39","text":"«Что человек пожнёт лишь то, к чему стремился.»"},{"reference":"9:105","text":"«Скажи: \"Действуйте! Аллах увидит ваши дела, как и Его Посланник, и верующие\".»"},{"reference":"11:6","text":"«Нет ни единого существа на земле, которое Аллах не обеспечивал бы пропитанием.»"}],"hadith":["*«Никто не ел пищи лучше той, что он заработал своим собственным трудом. Пророк Аллаха Дауд питался от труда своих рук.»* — Сахих аль-Бухари 2072 (**Достоверный**)","*«Аллах любит, когда кто-либо из вас делает что-то, он делает это с совершенством (*иткан*).»* — аль-Байхаки, Шуаб аль-Иман (**Достоверный** по аль-Альбани)"],"scholars":["**Умар ибн аль-Хаттаб** — *«Никто не должен сидеть сложа руки в поисках пропитания и говорить: \"О Аллах, даруй мне удел\" — ведь вы знаете, что небо не дождит золотом и серебром\".»* — Широко приписывается.","**Имам аш-Шафии** — *«Трудитесь и уповайте на Аллаха — ибо тот, кто трудится и уповает на Аллаха, выше того, кто просто ждёт.»* — Широко приписывается."],"lessons":["Зарабатывать своими руками — похвально в Исламе: Пророк Дауд (عليه السلام) приводится как пример.","Всё, что вы делаете, делайте с совершенством (*иткан*) — Аллах любит мастерство в любом труде.","Труд является поклонением при правильном намерении и дозволенными средствами.","Не позволяйте таваккулю стать бездеятельностью — удел Аллаха приходит через усилие, а не через праздность.\n---"]},"kk":{"name":"Қажырлы еңбек","quran":[{"reference":"53:39","text":"«Адамға тек өзі жасаған нәрсе ғана тиесілі.»"},{"reference":"9:105","text":"«Айт: \"Амал жасаңдар! Алла, Оның Елшісі және мүміндер амалдарыңды көреді\".»"},{"reference":"11:6","text":"«Жер бетінде ризығын Алла қамтамасыз етпейтін бірде-бір тіршілік иесі жоқ.»"}],"hadith":["*«Ешкім өз қолының еңбегімен тапқан тамақтан жақсырақ тамақ жеген емес. Алланың Пайғамбары Дауыт өз қолының еңбегімен тамақтанды.»* — Сахих әл-Бухари 2072 (**Сахих**)","*«Алла сендердің бірі бір іс жасағанда, оны жақсылап жасауын сүйеді (*итқан*).»* — Байхаки, Шуаб әл-Иман (**Сахих**, әл-Албани бойынша)"],"scholars":["**Омар ибн әл-Хаттаб** — *«Ешкім ризық іздеуді тоқтатып \"О, Алла, маған ризық бер\" деп отырмасын — аспан алтын-күміс жауырмасынан білесіздер.»* — Кеңінен айтылады.","**Имам әш-Шафии** — *«Еңбек ет және Аллаға тавакккул ет — өйткені еңбек ету және Аллаға сүйену тек күтетін адамнан жоғары.»* — Кеңінен айтылады."],"lessons":["Өз қолымен табу Исламда мақталады — Пайғамбар Дауыт (عليه السلام) үлгі ретінде келтіріледі.","Не жасасаңыз да, жақсылықпен жасаңыз (*итқан*) — Алла кез келген жұмыстағы шеберлікті сүйеді.","Еңбек — дұрыс ниет пен халал жолмен жасалса, ғибадат болады.","Тавакккулды бәсеңдікке айналдырмаңыз — Алланың ризығы күш-жігермен келеді, жалқаулықпен емес.\n---"]}}},{"id":"earning-halal-income","categoryId":"work-success","order":23,"translations":{"en":{"name":"Earning Halal Income","quran":[{"reference":"2:168","text":"\"O mankind, eat from whatever is on earth [that is] lawful and good and do not follow the footsteps of Satan.\""},{"reference":"62:10","text":"\"And when the prayer has been concluded, disperse within the land and seek from the bounty of Allah.\""},{"reference":"2:188","text":"\"And do not consume one another's wealth unjustly or send it [in bribery] to the rulers in order that [they might aid] you [to] consume a portion of the wealth of the people in sin, while you know [it is unlawful].\""}],"hadith":["*\"The halal is clear and the haram is clear, and between them are doubtful matters. Whoever avoids the doubtful protects his religion and honour.\"* — Sahih al-Bukhari 52, Sahih Muslim 1599 (**Sahih**)","*\"A time will come upon people when a man will not care whether his wealth comes from halal or haram.\"* — Sahih al-Bukhari 2059 (**Sahih**)"],"scholars":["**Imam Ahmad ibn Hanbal** — *\"Seeking halal income is an obligation upon every Muslim.\"* — Widely attributed in Hanbali fiqh literature.","**Ibn al-Qayyim** — *\"Haram in wealth corrupts worship — a du'a made with haram money is veiled from acceptance.\"* — *Zad al-Ma'ad*"],"lessons":["Halal income is a religious obligation, not merely a preference.","When in doubt, avoid — protecting your deen and honour is worth more than any gain.","Haram wealth corrupts your worship and blocks the acceptance of du'a.","Regularly audit your income sources for any element of haram or serious doubt.\n---"]},"ru":{"name":"Халяльный заработок","quran":[{"reference":"2:168","text":"«О люди! Вкушайте то, что есть на земле, дозволенное и благое, и не следуйте по стопам шайтана.»"},{"reference":"62:10","text":"«А когда завершится молитва, разойдитесь по земле и ищите милость Аллаха.»"},{"reference":"2:188","text":"«Не пожирайте незаконно имущества друг друга и не подкупайте судей, чтобы намеренно присвоить часть собственности людей незаконным образом.»"}],"hadith":["*«Дозволенное ясно и запретное ясно, а между ними — сомнительное. Тот, кто избегает сомнительного, оберегает свою религию и честь.»* — Сахих аль-Бухари 52, Сахих Муслим 1599 (**Достоверный**)","*«Наступит время, когда человек не будет заботиться о том, получил ли он богатство дозволенным или запретным путём.»* — Сахих аль-Бухари 2059 (**Достоверный**)"],"scholars":["**Имам Ахмад ибн Ханбаль** — *«Поиск халяльного заработка — обязанность каждого мусульманина.»* — Широко приписывается в литературе ханбалитского фикха.","**Ибн аль-Каййим** — *«Харам в достатке разрушает поклонение — ду'а, совершённое на деньги от харама, закрыто от принятия.»* — *Зад аль-Маад*"],"lessons":["Халяльный заработок — религиозная обязанность, а не просто предпочтение.","При сомнении — воздерживайтесь: оберегание вашей религии и чести дороже любой выгоды.","Харамное имущество разрушает поклонение и закрывает принятие ду'а.","Регулярно проверяйте источники своего дохода на наличие харама или серьёзных сомнений.\n---"]},"kk":{"name":"Халал табыс","quran":[{"reference":"2:168","text":"«Ей, адамдар! Жердегі халал және дәмді нәрседен жеңдер.»"},{"reference":"62:10","text":"«Намаз бітсе, жер бетіне таралыңдар және Алланың рахметін іздеңдер.»"},{"reference":"2:188","text":"«Арандарыңда малды заңсыз жемеңдер және адамдардың мүлкінің бір бөлігін күнәмен алу үшін билеушілерге пара бермеңдер.»"}],"hadith":["*«Халал анық, харам да анық, ал арада күмәнді нәрселер бар. Күмәндіден аулақ болған адам өзінің дінін және намысын сақтаған.»* — Сахих әл-Бухари 52, Сахих Муслим 1599 (**Сахих**)","*«Адамдардың байлығын халал жолмен алдымен немесе харамымен алдымен деп ойланбайтын уақыт келеді.»* — Сахих әл-Бухари 2059 (**Сахих**)"],"scholars":["**Имам Ахмад ибн Ханбал** — *«Халал табыс іздеу — әрбір мұсылманға парыз.»* — Ханбали фиқх әдебиетінде кеңінен айтылады.","**Ибн әл-Қаййим** — *«Байлықтағы харам ғибадатты бұзады — харам ақшамен жасалған дұға қабылданудан жабылған.»* — *Зад әл-Маад*"],"lessons":["Халал табыс — діни міндет, жай таңдау ғана емес.","Күмәнданғанда аулақ болыңыз — дінің мен намысыңды сақтау кез келген пайдадан да қымбат.","Харам байлық ғибадатты бұзып, дұғаның қабылдануын жауып тастайды.","Табыс көздеріңізді харам немесе елеулі күмән элементтеріне үнемі тексеріп тұрыңыз.\n---"]}}},{"id":"excellence-ihsan","categoryId":"work-success","order":24,"translations":{"en":{"name":"Excellence (Ihsan)","quran":[{"reference":"16:90","text":"\"Indeed, Allah orders justice and *ihsan* (excellence/good conduct) and giving to relatives.\""},{"reference":"55:60","text":"\"Is the reward for good anything but good?\""},{"reference":"2:195","text":"\"And do good; indeed, Allah loves the doers of good.\""}],"hadith":["*\"Allah has ordained excellence (ihsan) in all things. So when you kill, do it well; and when you slaughter, do it well. Each of you should sharpen his blade and spare the animal pain.\"* — Sahih Muslim 1955 (**Sahih**)","*\"Allah loves that when any of you does something, he does it with excellence (itqan).\"* — Al-Bayhaqi, Shu'ab al-Iman (**Sahih** per Al-Albani)"],"scholars":["**Imam Al-Ghazali** — *\"Ihsan is to worship Allah as if you see Him, knowing that even if you do not see Him, He sees you. This awareness transforms every act.\"* — *Ihya' Ulum ad-Din* (based on the hadith of Jibril)","**Ibn al-Qayyim** — *\"Ihsan has two levels: the ihsan of worship — to worship Allah as if you see Him — and the ihsan of service to creation — to give others more than their due.\"* — *Madarij as-Salikin*"],"lessons":["Ihsan is commanded by Allah Himself (16:90) alongside justice — it is not optional for a Muslim.","Allah loves mastery in work. Doing anything poorly when you can do it well is a failure of Islamic character.","Ihsan in worship means feeling Allah's presence — transform your prayer by imagining you stand before Him.","Ihsan to people means giving more than you are asked — going beyond the minimum in every relationship.\n---"]},"ru":{"name":"Совершенство (Ихсан)","quran":[{"reference":"16:90","text":"«Воистину, Аллах повелевает справедливостью, добродеянием (*ихсан*) и щедростью к родственникам.»"},{"reference":"55:60","text":"«Разве воздаянием за добро может быть что-либо иное, кроме добра?»"},{"reference":"2:195","text":"«Творите добро, ведь Аллах любит творящих добро.»"}],"hadith":["*«Аллах предписал ихсан во всём. Когда убиваете — делайте это наилучшим образом; когда режете скот — делайте это наилучшим образом. Пусть каждый из вас наточит своё лезвие и избавит животное от страданий.»* — Сахих Муслим 1955 (**Достоверный**)","*«Аллах любит, когда кто-либо из вас делает что-то, он делает это с совершенством (*иткан*).»* — аль-Байхаки, Шуаб аль-Иман (**Достоверный** по аль-Альбани)"],"scholars":["**Имам аль-Газали** — *«Ихсан — поклоняться Аллаху так, словно ты видишь Его, зная, что если ты не видишь Его, то Он тебя видит. Это осознание преобразует каждое действие.»* — *Ихья Улюм ад-Дин*","**Ибн аль-Каййим** — *«Ихсан имеет два уровня: ихсан в поклонении — поклоняться Аллаху словно ты видишь Его — и ихсан в служении творению — давать другим больше, чем им причитается.»* — *Мадаридж ас-Саликин*"],"lessons":["Ихсан предписан Самим Аллахом (16:90) наряду со справедливостью — для мусульманина он не является необязательным.","Аллах любит мастерство в труде. Делать что-то плохо, когда можешь сделать хорошо, — изъян исламского характера.","Ихсан в поклонении означает чувствование присутствия Аллаха: преобразите свою молитву, представив, что стоите пред Ним.","Ихсан к людям означает давать больше, чем от вас требуют: выходить за рамки минимума в каждом отношении.\n---"]},"kk":{"name":"Жетілдіру (Ихсан)","quran":[{"reference":"16:90","text":"«Расында, Алла әділдікті, жақсылық жасауды (*ихсан*) және туыстарға беруді бұйырады.»"},{"reference":"55:60","text":"«Жақсылыққа жақсылықтан басқа қайтарым бар ма?»"},{"reference":"2:195","text":"«Жақсылық жасаңдар, расында Алла жақсылық жасаушыларды сүйеді.»"}],"hadith":["*«Алла ихсанды барлық нәрседе парыз етті. Өлтіргенде де жақсылап өлтіріңдер; мал сойғанда да жақсылап сойыңдар. Пышақтарыңызды шайыңдар және малды азаптан ада қылыңдар.»* — Сахих Муслим 1955 (**Сахих**)","*«Алла сендердің бірі бір іс жасағанда, оны жақсылап (*итқан*) жасауын сүйеді.»* — Байхаки, Шуаб әл-Иман (**Сахих**, әл-Албани бойынша)"],"scholars":["**Имам әл-Ғазали** — *«Ихсан — Аллаға сені көріп тұрғандай ғибадат ету, ал сен Оны көрмесең де, Ол сені көреді деп білу. Бұл хабардарлық кез келген іс-әрекетті өзгертеді.»* — *Ихья Улюм ад-Дин*","**Ибн әл-Қаййим** — *«Ихсанның екі деңгейі бар: ғибадаттағы ихсан — Аллаға Оны көргендей ғибадат ету — және халыққа қызмет етудегі ихсан — адамдарға тиесілісінен артық беру.»* — *Мадаридж әс-Саликин*"],"lessons":["Ихсан Алланың Өзі (16:90) бұйырған — мұсылман үшін ол міндетті.","Алла жұмыстағы шеберлікті сүйеді. Жақсылап жасай алатынды нашар жасау — Исламдық мінез-құлықтың кемшілігі.","Ғибадаттағы ихсан Алланың присутствиесін сезіну дегенді білдіреді: намазыңызды Оның алдында тұрғандай сезініп оқыңыз.","Адамдарға ихсан — сізден сұралғаннан артық беру: кез келген қарым-қатынаста ең азынан шығу.\n---"]}}},{"id":"leadership","categoryId":"work-success","order":25,"translations":{"en":{"name":"Leadership","quran":[{"reference":"2:30","text":"\"And [mention, O Muhammad], when your Lord said to the angels: 'Indeed, I will make upon the earth a successive authority [khalifah].'\""},{"reference":"4:58","text":"\"Indeed, Allah commands you to render trusts to whom they are due and when you judge between people to judge with justice.\""},{"reference":"32:24","text":"\"And We made from among them leaders guiding by Our command when they were patient and [when] they were certain of Our signs.\""}],"hadith":["*\"Each of you is a shepherd and each of you is responsible for his flock.\"* — Sahih al-Bukhari 893, Sahih Muslim 1829 (**Sahih**)","*\"The most beloved of leaders to Allah is the one who makes [things] easy for people. And the most hated is the one who makes things difficult.\"* — Sahih Muslim 1828 (**Sahih**)"],"scholars":["**Ali ibn Abi Talib** — *\"Leadership is a trust, not a privilege. Whoever treats it as privilege has betrayed it.\"* — Widely attributed.","**Ibn Taymiyyah** — *\"Just leadership is among the greatest acts of worship and the most beneficial to the Muslim community.\"* — *Al-Siyasah al-Shar'iyyah*"],"lessons":["Every person is a leader — of their family, team, or community. The Prophet ﷺ made no exceptions.","The best leaders facilitate, not obstruct. Allah loves the leader who makes things easy.","Leadership is a trust (*amanah*) — it will be asked about before Allah.","Patience and certainty of faith are the qualities that produce true leadership (32:24).\n---"]},"ru":{"name":"Лидерство","quran":[{"reference":"2:30","text":"«Вот сказал твой Господь ангелам: \"Я установлю на земле наместника\".»"},{"reference":"4:58","text":"«Воистину, Аллах повелевает вам возвращать вверенное на хранение его владельцам и судить по справедливости.»"},{"reference":"32:24","text":"«Мы сделали из них предводителей, которые вели [других] по Нашему велению, когда они проявляли терпение и твёрдо веровали в Наши знамения.»"}],"hadith":["*«Каждый из вас является пастырем и каждый несёт ответственность за свою паству.»* — Сахих аль-Бухари 893, Сахих Муслим 1829 (**Достоверный**)","*«Самый любимый из правителей пред Аллахом — тот, кто облегчает [жизнь] людям. А самый ненавистный — тот, кто создаёт трудности.»* — Сахих Муслим 1828 (**Достоверный**)"],"scholars":["**Али ибн Аби Талиб** — *«Лидерство — это доверие, а не привилегия. Кто относится к нему как к привилегии, тот предал его.»* — Широко приписывается.","**Ибн Таймийя** — *«Справедливое руководство — среди величайших актов поклонения и наиболее полезных для мусульманской общины.»* — *ас-Сияса аш-Шариийя*"],"lessons":["Каждый человек — лидер: своей семьи, команды или общины. Пророк ﷺ не делал исключений.","Лучшие руководители — те, кто облегчает жизнь, а не создаёт препятствия. Аллах любит такого руководителя.","Лидерство — это аманат, о котором спросят пред Аллахом.","Терпение и твёрдость веры — качества, порождающие истинное лидерство (32:24).\n---"]},"kk":{"name":"Басшылық","quran":[{"reference":"2:30","text":"«Раббың періштелерге: \"Мен жер бетінде орынбасар орнатамын\" деді.»"},{"reference":"4:58","text":"«Расында, Алла сендерге аманатты иелеріне қайтаруды бұйырады және адамдардың арасында сот еткенде әділетпен сот ету.»"},{"reference":"32:24","text":"«Олар сабырлы болған және Нашар аяттарымызға нық иман келтірген кезде, Біз олардың ішінен Өз бұйрығымызбен жол сілтейтін жетекшілер жасадық.»"}],"hadith":["*«Әрқайсыларыңыз бақташысыз және әрқайсыларыңыз өз қарамағындағылар үшін жауаптысыз.»* — Сахих әл-Бухари 893, Сахих Муслим 1829 (**Сахих**)","*«Алланың алдындағы ең сүйікті басшылар — адамдарға жеңілдік жасайтындар. Ал ең жек көрушілері — қиындық жасайтындар.»* — Сахих Муслим 1828 (**Сахих**)"],"scholars":["**Али ибн Әби Талиб** — *«Басшылық — артықшылық емес, аманат. Оны артықшылық ретінде қарайтын адам оны сатты.»* — Кеңінен айтылады.","**Ибн Таймийя** — *«Әділ басшылық — ең ұлы ғибадат амалдарының бірі және мұсылман қауымына ең пайдалысы.»* — *Әс-Сияса аш-Шариийя*"],"lessons":["Әрбір адам — жетекші: отбасының, командасының немесе қауымының. Пайғамбар ﷺ ешқандай ерекшелік жасамады.","Ең жақсы жетекшілер — жеңілдетіп, кедергі жасамайтындар. Алла мұндай жетекшіні сүйеді.","Басшылық — аманат, Алла алдында есеп беріледі.","Сабыр және иманның нықтығы — шынайы басшылықты тудыратын қасиеттер (32:24).\n---"]}}},{"id":"justice","categoryId":"work-success","order":26,"translations":{"en":{"name":"Justice","quran":[{"reference":"4:135","text":"\"O you who have believed, be persistently standing firm in justice, witnesses for Allah, even if it be against yourselves or parents and relatives.\""},{"reference":"5:8","text":"\"O you who have believed, be persistently standing firm for Allah, witnesses in justice, and do not let the hatred of a people prevent you from being just. Be just; that is nearer to righteousness.\""},{"reference":"16:90","text":"\"Indeed, Allah orders justice and good conduct.\""}],"hadith":["*\"Those who are just will be at minbars of light on the Day of Resurrection, to the right of the Most Merciful — those who are just in their judgements, their families, and what they are in charge of.\"* — Sahih Muslim 1827 (**Sahih**)","*\"Beware of oppression, for oppression will be darkness on the Day of Resurrection.\"* — Sahih Muslim 2578 (**Sahih**)"],"scholars":["**Umar ibn Al-Khattab** — *\"The strongest among you in my sight is the weak person until I have given him his right. And the weakest among you is the strong person until I have taken what is due from him.\"* — Widely reported; classical sources attribute it to his public address.","**Ibn Taymiyyah** — *\"Allah upholds a just state even if it is disbelieving, and does not uphold an unjust state even if it is Muslim.\"* — *Al-Siyasah al-Shar'iyyah*"],"lessons":["Be just even against yourself or your family — the Quran commands it explicitly (4:135).","Do not let personal dislike or history prevent you from being fair (5:8).","The just will be honoured beside Allah on the Day of Resurrection — this includes parents, managers, judges.","Oppression is darkness in the next world — even small injustices carry weight.\n---"]},"ru":{"name":"Справедливость","quran":[{"reference":"4:135","text":"«О те, кто уверовал! Будьте твёрдо стоять за справедливость, свидетельствуя пред Аллахом, даже если это [будет] против вас самих или против родителей и родственников.»"},{"reference":"5:8","text":"«О те, кто уверовал! Будьте стойкими свидетелями пред Аллахом в справедливости. И пусть ненависть людей не подтолкнёт вас к несправедливости. Будьте справедливыми — это ближе к богобоязненности.»"},{"reference":"16:90","text":"«Воистину, Аллах повелевает справедливостью и добродеянием.»"}],"hadith":["*«Справедливые окажутся на минбарах из света в Судный день — те, кто справедлив в своих суждениях, в своих семьях и в том, чем они управляют.»* — Сахих Муслим 1827 (**Достоверный**)","*«Бойтесь угнетения, ибо угнетение станет мраком в Судный день.»* — Сахих Муслим 2578 (**Достоверный**)"],"scholars":["**Умар ибн аль-Хаттаб** — *«Самый сильный среди вас для меня — слабый, пока я не верну ему его право. И самый слабый среди вас — сильный, пока я не заберу у него то, что ему не принадлежит.»* — Широко приводится; классические источники приписывают это его публичному обращению.","**Ибн Таймийя** — *«Аллах поддерживает справедливое государство, даже если оно неверующее, и не поддерживает несправедливое, даже если оно мусульманское.»* — *ас-Сияса аш-Шариийя*"],"lessons":["Будьте справедливы, даже если это направлено против вас или ваших близких — Коран повелевает это прямо (4:135).","Не позволяйте личной неприязни или прошлому мешать вам быть справедливыми (5:8).","Справедливые будут почтены рядом с Аллахом в Судный день — это включает родителей, руководителей, судей.","Угнетение — мрак в следующем мире; даже мелкие несправедливости имеют вес.\n---"]},"kk":{"name":"Әділдік","quran":[{"reference":"4:135","text":"«Ей, иман келтіргендер! Өздеріңізге, ата-аналарыңызға немесе туыстарыңызға қарсы болса да, Аллаға куәгер болып, әділдікті нық ұстаңдар.»"},{"reference":"5:8","text":"«Ей, иман келтіргендер! Алланың куәгерлері болып, әділдікке нық тұрыңдар; халықтың өшпенділігі сендерді әділеттен шығармасын.»"},{"reference":"16:90","text":"«Расында, Алла әділдікті және ізгілікті бұйырады.»"}],"hadith":["*«Әділ адамдар Қияметте Нұрдан жасалған минбарларда болады — үкімдерінде, отбасыларында және қарамағындағыларда әділ болғандар.»* — Сахих Муслим 1827 (**Сахих**)","*«Зұлымдықтан сақтаныңдар, өйткені зұлымдық Қияметте қараңғылыққа айналады.»* — Сахих Муслим 2578 (**Сахих**)"],"scholars":["**Омар ибн әл-Хаттаб** — *«Арандарыңдағы ең күшті — әлсіз, оған құқығын бергенше. Арандарыңдағы ең әлсіз — күшті, одан тиесіліні алғанша.»* — Классикалық деректемелер оны оның жария сөзінде айтты деп береді.","**Ибн Таймийя** — *«Алла әділ мемлекетті, тіпті кәпір болса да қолдайды; ал залым мемлекетті, тіпті мұсылман болса да қолдамайды.»* — *Әс-Сияса аш-Шариийя*"],"lessons":["Өзіңізге немесе отбасыңызға қарсы болса да әділ болыңыз — Құран мұны тікелей бұйырады (4:135).","Жеке антипатия немесе тарих сізді әділетті болудан тоқтатпасын (5:8).","Әділдер Қияметте Алла жанында құрметтеледі — бұл ата-аналарды, менеджерлерді, судьяларды қамтиды.","Зұлымдық — ақырет өмірінде қараңғылық; ұсақ дерексіздіктердің де салмағы бар.\n---"]}}},{"id":"fairness","categoryId":"work-success","order":27,"translations":{"en":{"name":"Fairness","quran":[{"reference":"4:58","text":"\"When you judge between people to judge with justice.\""},{"reference":"6:152","text":"\"And whenever you speak, be just, even if [it concerns] a near relative.\""},{"reference":"49:9","text":"\"And if two factions among the believers should fight, then make settlement between the two. But if one of them oppresses the other, then fight against the one that oppresses until it returns to the ordinance of Allah.\""}],"hadith":["*\"A man came to the Prophet ﷺ and asked for advice. He said: 'Do not be angry.' He repeated it three times.\"* — Sahih al-Bukhari 6116 (**Sahih**) *(Anger is cited here as the chief cause of unfairness in human dealings.)*","*\"Whoever has wronged his brother regarding his honour or anything else, let him seek his pardon today before there are no dinars or dirhams.\"* — Sahih al-Bukhari 2449 (**Sahih**)"],"scholars":["**Imam Malik** — *\"The foundation of all dealings is that a person gives others what he would wish to receive himself.\"* — Widely attributed in Maliki fiqh tradition.","**Ibn al-Qayyim** — *\"Fairness begins in the heart — the one whose heart is inclined to favour himself over others will never be truly just with people.\"* — *Madarij as-Salikin*"],"lessons":["Fairness is commanded even when it goes against a family member (6:152) — truth has no favourites.","Settle disputes with justice now, before the Day of Judgement, when no currency will help.","Ask yourself in any conflict: *Am I judging the situation or judging the person?*","Anger is the greatest enemy of fairness — manage it before making any judgement.\n---"]},"ru":{"name":"Беспристрастность","quran":[{"reference":"4:58","text":"«Когда вы судите среди людей, судите по справедливости.»"},{"reference":"6:152","text":"«Когда говорите, то будьте справедливы, даже если речь идёт о ближайшем родственнике.»"},{"reference":"49:9","text":"«Если же одна из них несправедливо нападает на другую, сражайтесь против той, которая несправедлива, пока она не вернётся к повелению Аллаха.»"}],"hadith":["*«Не гневайся.\" Он повторил это три раза.»* — Сахих аль-Бухари 6116 (**Достоверный**) *(Гнев упоминается здесь как главная причина несправедливости в человеческих делах.)*","*«Тот, кто обидел своего брата, задев его честь или другим образом, пусть попросит у него прощения сегодня, прежде чем наступит [день], когда не будет ни динара, ни дирхама.»* — Сахих аль-Бухари 2449 (**Достоверный**)"],"scholars":["**Имам Малик** — *«Основа всех отношений в том, что человек отдаёт другим то, что сам хотел бы получить.»* — Широко приписывается в маликитской традиции фикха.","**Ибн аль-Каййим** — *«Беспристрастность начинается в сердце: тот, чьё сердце склонно ставить себя выше других, никогда не будет по-настоящему справедлив с людьми.»* — *Мадаридж ас-Саликин*"],"lessons":["Беспристрастность предписана, даже когда она направлена против родственника (6:152) — истина не имеет фаворитов.","Улаживайте споры справедливо сейчас, до Судного дня, когда никакая валюта не поможет.","Спрашивайте себя в любом конфликте: *«Я сужу о ситуации или о человеке?»*","Гнев — главный враг беспристрастности: справляйтесь с ним прежде, чем выносить любое суждение.\n---"]},"kk":{"name":"Әділеттілік","quran":[{"reference":"4:58","text":"«Адамдардың арасында сот еткенде әділдікпен сот етіңдер.»"},{"reference":"6:152","text":"«Сөйлегенде, жақын туыс болса да, әділ болыңдар.»"},{"reference":"49:9","text":"«Егер мүміндердің екі тобы соғысса, олардың арасын бітістіріңдер. Бірақ біреуі екіншісіне зұлымдық жасаса, зұлымдық жасағанмен ол Алланың бұйрығына қайтқанша шайқасыңдар.»"}],"hadith":["*«Бір адам Пайғамбарға ﷺ келіп кеңес сұрады. Ол айтты: \"Ашуланба\". Үш рет қайталады.»* — Сахих әл-Бухари 6116 (**Сахих**) *(Мұнда ашу адами қарым-қатынастағы әділетсіздіктің басты себебі ретінде келтіріледі.)*","*«Кім бауырына оның намысы немесе басқа нәрсе жөнінде зұлымдық жасаса, динар мен дирхам болмайтын күн келмей тұрып, бүгін одан кешірім сұрасын.»* — Сахих әл-Бухари 2449 (**Сахих**)"],"scholars":["**Имам Малик** — *«Барлық қарым-қатынастың негізі — адамның басқаларға өзі алғысы келетін нәрсені беруі.»* — Малики фиқх дәстүрінде кеңінен айтылады.","**Ибн әл-Қаййим** — *«Әділеттілік жүректен басталады — жүрегі өзін басқалардан артық көруге бейім адам ешқашан адамдармен шынайы әділ болмайды.»* — *Мадаридж әс-Саликин*"],"lessons":["Әділеттілік туыс адамға қарсы болса да бұйырылған (6:152) — шындықтың таңдаулылары жоқ.","Дауларды қазір әділдікпен шешіңіз, ешбір валюта көмектеспейтін Қиямет күнінен бұрын.","Кез келген қақтығыста өзіңізден сұраңыз: *«Мен жағдайды соттаймын ба, әлде адамды соттаймын ба?»*","Ашу — әділеттіліктің ең үлкен жауы: кез келген үкім шығармас бұрын оны меңгеріңіз.\n---"]}}},{"id":"knowledge","categoryId":"work-success","order":28,"translations":{"en":{"name":"Knowledge","quran":[{"reference":"96:1","text":"\"Read in the name of your Lord who created.\"* (The first revealed verse)"},{"reference":"20:114","text":"\"And say: My Lord, increase me in knowledge.\""},{"reference":"58:11","text":"\"Allah will raise those who have believed among you and those who were given knowledge, by degrees.\""}],"hadith":["*\"Seeking knowledge is an obligation upon every Muslim.\"* — Sunan Ibn Majah 224 (**Sahih** per Al-Albani)","*\"Whoever follows a path in pursuit of knowledge, Allah will make easy for him a path to Paradise.\"* — Sahih Muslim 2699 (**Sahih**)"],"scholars":["**Ali ibn Abi Talib** — *\"Knowledge is better than wealth: knowledge guards you, while you must guard wealth. Knowledge increases with spending; wealth decreases.\"* — Widely attributed; reported in classical wisdom literature.","**Imam Ash-Shafi'i** — *\"Whoever does not love knowledge does not deserve to be honoured.\"* — Widely attributed."],"lessons":["The first word revealed in the Quran was *Iqra* (Read) — knowledge is the starting point of all Islamic life.","Seeking knowledge is an individual obligation (*fard 'ayn*) — it cannot be outsourced.","The path of knowledge is the path to Paradise — every step toward learning is a step toward Allah.","Teach what you know; knowledge shared does not diminish — it grows.\n-e \n---"]},"ru":{"name":"Знание","quran":[{"reference":"96:1","text":"«Читай во имя твоего Господа, Который сотворил.»* (Первый ниспосланный аят)"},{"reference":"20:114","text":"«Говори: \"Господи! Увеличь мои знания\".»"},{"reference":"58:11","text":"«Аллах возвысит тех из вас, кто уверовал, и тех, кому даровано знание, на высокие степени.»"}],"hadith":["*«Поиск знания — обязанность каждого мусульманина.»* — Сунан Ибн Маджа 224 (**Достоверный** по аль-Альбани)","*«Кто следует путём в поисках знания, Аллах облегчит ему путь в Рай.»* — Сахих Муслим 2699 (**Достоверный**)"],"scholars":["**Али ибн Аби Талиб** — *«Знание лучше богатства: знание охраняет тебя, а богатство тебе приходится охранять самому. Знание возрастает от расходования; богатство убывает.»* — Широко приписывается.","**Имам аш-Шафии** — *«Тот, кто не любит знание, не заслуживает почёта.»* — Широко приписывается."],"lessons":["Первое слово, ниспосланное в Коране, — *Икра* (Читай) — знание является отправной точкой всей исламской жизни.","Поиск знания — индивидуальная обязанность (*фард айн*) — её нельзя передать другому.","Путь знания — путь в Рай: каждый шаг к учёбе — шаг к Аллаху.","Учи тому, что знаешь; переданное знание не убывает — оно растёт.\n---"]},"kk":{"name":"Парасаттылық (Білім)","quran":[{"reference":"96:1","text":"«Жаратқан Раббыңның атымен оқы.»* (Бірінші ниспосланған аят)"},{"reference":"20:114","text":"«Айт: \"Раббым! Білімімді арттыра гөр\".»"},{"reference":"58:11","text":"«Алла арандарыңнан иман келтіргендерді және ілім берілгендерді дәрежелерде биіктетеді.»"}],"hadith":["*«Ілім іздеу — әрбір мұсылманға парыз.»* — Сунан Ибн Мажа 224 (**Сахих**, әл-Албани бойынша)","*«Ілім іздеу жолын ұстанғанға Алла жұмаққа баратын жолды жеңілдетеді.»* — Сахих Муслим 2699 (**Сахих**)"],"scholars":["**Али ибн Әби Талиб** — *«Ілім байлықтан жақсы: ілім сені сақтайды, ал байлықты өзің сақтауың керек. Ілім жұмсалса артады; байлық кемиді.»* — Кеңінен айтылады.","**Имам әш-Шафии** — *«Білімді сүймейтін адам құрметке лайық емес.»* — Кеңінен айтылады."],"lessons":["Құранда ниспосланған бірінші сөз — *Иқра* (Оқы) — ілім барлық Исламдық өмірдің бастауы.","Ілім іздеу — жеке парыз (*фард айн*): оны ауыстыруға болмайды.","Ілім жолы — жұмаққа жол: оқуға жасалған әрбір қадам — Аллаға жасалған қадам.","Білгеніңізді үйретіңіз; бөліскен ілім кемімейді — ол өседі.\n---"]}}},{"id":"stress","categoryId":"mental-wellbeing","order":29,"translations":{"en":{"name":"Stress","quran":[{"reference":"94:5–6","text":"\"For indeed, with hardship will be ease. Indeed, with hardship will be ease.\""},{"reference":"2:286","text":"\"Allah does not burden a soul beyond that it can bear.\""},{"reference":"13:28","text":"\"Verily, in the remembrance of Allah do hearts find rest.\""}],"hadith":["*\"How wonderful is the affair of the believer! If good befalls him, he is grateful — and that is good for him. If harm befalls him, he is patient — and that is good for him.\"* — Sahih Muslim 2999 (**Sahih**)","*\"No fatigue, nor disease, nor sorrow, nor sadness, nor hurt, nor distress befalls a Muslim — even the prick of a thorn — but that Allah expiates some of his sins.\"* — Sahih al-Bukhari 5641, Sahih Muslim 2573 (**Sahih**)"],"scholars":["**Ibn al-Qayyim** — *\"The heart has no peace except through its Lord. Seeking peace through anything else only increases the pain.\"* — *Al-Fawa'id*","**Imam Al-Ghazali** — *\"Most stress comes from fear of what has not yet happened. Return to the present moment and to trust in Allah — that is where relief is found.\"* — *Ihya' Ulum ad-Din* (paraphrase)"],"lessons":["Ease follows every hardship — Allah repeats this twice in Surah 94 for emphasis.","No burden is placed on you that you cannot bear (2:286) — this is a divine guarantee.","Dhikr (remembrance of Allah) is the Quranic prescription for a restless heart (13:28).","Reframe stress: even the prick of a thorn expiates sins. Nothing is wasted before Allah.\n---"]},"ru":{"name":"Стресс","quran":[{"reference":"94:5–6","text":"«Воистину, после трудности — облегчение. Воистину, после трудности — облегчение.»"},{"reference":"2:286","text":"«Аллах не возлагает на душу сверх её возможностей.»"},{"reference":"13:28","text":"«Воистину, поминанием Аллаха успокаиваются сердца.»"}],"hadith":["*«Как удивительно положение верующего! Если его постигает радость, он благодарит — и это для него благо; если его постигает горе, он терпит — и это для него благо.»* — Сахих Муслим 2999 (**Достоверный**)","*«Никакая усталость, болезнь, печаль, горе, вред или беда не постигнет мусульманина — даже укол колючки — не искупив этим часть его грехов.»* — Сахих аль-Бухари 5641, Сахих Муслим 2573 (**Достоверный**)"],"scholars":["**Ибн аль-Каййим** — *«У сердца нет покоя, кроме как в его Господе. Поиск покоя в чём-либо другом лишь увеличивает боль.»* — *аль-Фаваид*","**Имам аль-Газали** — *«Большинство стрессов происходит из страха перед тем, что ещё не случилось. Вернитесь к настоящему моменту и к доверию Аллаху — там и кроется облегчение.»* — *Ихья Улюм ад-Дин* (перефразировано)"],"lessons":["За каждой трудностью следует облегчение — Аллах повторил это дважды в суре 94 для акцента.","На вас не возложено бремени, которое вы не в состоянии нести (2:286) — это божественная гарантия.","Зикр (поминание Аллаха) — коранское предписание для беспокойного сердца (13:28).","Переосмыслите стресс: даже укол колючки искупает грехи. Ничто не пропадает пред Аллахом.\n---"]},"kk":{"name":"Стресс","quran":[{"reference":"94:5–6","text":"«Расында, қиыншылықпен бірге жеңілдік бар. Расында, қиыншылықпен бірге жеңілдік бар.»"},{"reference":"2:286","text":"«Алла жанды шамасынан артық ауыртпайды.»"},{"reference":"13:28","text":"«Расында, жүректер Алланы еске алғанда тыныштық табады.»"}],"hadith":["*«Мүміннің ісі таң қалдырады! Жақсылық тисе шүкір етеді — бұл оған жақсы; жамандық тисе сабыр етеді — бұл да оған жақсы.»* — Сахих Муслим 2999 (**Сахих**)","*«Мұсылманға тиетін ешбір шаршаушылық, ауру, қайғы, мұң, зиян немесе азап жоқ — тіпті тікенектің тіліп кетуі де — күнәлерінің бір бөлігі өтелмей.»* — Сахих әл-Бухари 5641, Сахих Муслим 2573 (**Сахих**)"],"scholars":["**Ибн әл-Қаййим** — *«Жүректің тыныштығы тек Раббынан табылады. Тыныштықты басқа нәрседен іздеу — ауырсынуды тек арттырады.»* — *Әл-Фауаид*","**Имам әл-Ғазали** — *«Стресстердің көпшілігі болмаған нәрседен қорқудан туындайды. Осы сәтке оралыңыз және Аллаға тавакккулға — облегчение сонда.»* — *Ихья Улюм ад-Дин* (перефразировано)"],"lessons":["Әрбір қиыншылықтан кейін жеңілдік келеді — Алла мұны 94-сүреде екі рет қайталады.","Шамасынан артық жүк жүктелмейді (2:286) — бұл Құдайлық кепілдік.","Зікір (Алланы еске алу) — мазасыз жүрекке Құраннан тағайындалған дәрі (13:28).","Стрессті қайта бағалаңыз: тіпті тікенек тілісі де күнәны өтейді. Алланың алдында ештеңе бекер кетпейді.\n---"]}}},{"id":"anxiety","categoryId":"mental-wellbeing","order":30,"translations":{"en":{"name":"Anxiety","quran":[{"reference":"10:62","text":"\"Verily, the friends of Allah — no fear will there be concerning them, nor will they grieve.\""},{"reference":"2:38","text":"\"Whoever follows My guidance — no fear will there be concerning them, nor will they grieve.\""},{"reference":"3:173","text":"\"And they said: 'Sufficient for us is Allah, and [He is] the best Disposer of affairs.' So they returned with favour from Allah and bounty, no harm having touched them.\""}],"hadith":["*\"Ask Allah for wellbeing (*al-'afiyah*), for no one is given anything better than wellbeing.\"* — Jami' at-Tirmidhi 3512 (**Sahih** per Al-Albani)","*\"O Allah, I seek refuge in You from worry and grief, from incapacity and laziness, from cowardice and miserliness, and from the burden of debt and from being overpowered by men.\"* — Sahih al-Bukhari 6363 (**Sahih**)"],"scholars":["**Ibn al-Qayyim** — *\"Anxiety about the future is one of the greatest weapons of Shaytan against the believer. Most of what people fear never comes to pass.\"* — *Al-Fawa'id*","**Imam Al-Ghazali** — *\"Trust in Allah's wisdom transforms anxiety into anticipation. When you know He is managing your affairs, you can rest.\"* — *Ihya' Ulum ad-Din* (paraphrase)"],"lessons":["The friends of Allah are free from fear and grief (10:62) — taqwa is the path to inner peace.","Say *hasbunallah wa ni'mal wakil* (3:173) in moments of anxiety — it is a prophetically proven formula.","Make the du'a for relief from worry a daily supplication; the Prophet ﷺ taught it explicitly (Bukhari 6363).","Anxiety about the future is often a failure of tawakkul — practice surrendering the outcome to Allah.\n---"]},"ru":{"name":"Тревога","quran":[{"reference":"10:62","text":"«Воистину, над приближёнными Аллаха не властен страх, и не познают они печали.»"},{"reference":"2:38","text":"«Тот, кто последует за Моим руководством, — над ними не властен страх, и не познают они печали.»"},{"reference":"3:173","text":"«Они сказали: \"Нам достаточно Аллаха, и как прекрасен этот Попечитель!\" И они вернулись с милостью Аллаха и Его щедростью, не постигло их никакое зло.»"}],"hadith":["*«Просите Аллаха об избавлении (*аль-афия*), ибо ничего лучшего, чем избавление, никому не было даровано.»* — Джами ат-Тирмизи 3512 (**Достоверный** по аль-Альбани)","*«О Аллах, я прибегаю к Тебе от тревоги и печали, от немощи и лени, от трусости и скупости, и от бремени долгов, и от того, чтобы люди одержали надо мной верх.»* — Сахих аль-Бухари 6363 (**Достоверный**)"],"scholars":["**Ибн аль-Каййим** — *«Тревога о будущем — одно из величайших оружий шайтана против верующего. Большинство того, чего боятся люди, так и не происходит.»* — *аль-Фаваид*","**Имам аль-Газали** — *«Доверие к мудрости Аллаха превращает тревогу в ожидание. Когда вы знаете, что Он управляет вашими делами, вы можете успокоиться.»* — *Ихья Улюм ад-Дин* (перефразировано)"],"lessons":["Приближённые Аллаха свободны от страха и печали (10:62) — такуа — это путь к внутреннему миру.","Произносите *\"хасбуналлаху ва ниъмаль-вакил\"* (3:173) в моменты тревоги — это пророчески проверенная формула.","Читайте ду'а от тревоги как ежедневное обращение; Пророк ﷺ учил этому прямо (Бухари 6363).","Тревога о будущем зачастую является сбоем таваккула — практикуйте вверение результата Аллаху.\n---"]},"kk":{"name":"Мазасыздық","quran":[{"reference":"10:62","text":"«Расында, Алланың достарына не қорқыныш бар, не олар қайғырады.»"},{"reference":"2:38","text":"«Менің жол көрсетуіме ерген адамдарға не қорқыныш бар, не олар қайғырады.»"},{"reference":"3:173","text":"«Олар: \"Аллах бізге жетеді, Ол — қандай жақсы Уәкіл!\" деді. Сонда олар Алланың нығметімен және рахметімен оралды, ешбір жамандық тимеді.»"}],"hadith":["*«Аллаха қорғаныш (*аль-афия*) іздеңдер, өйткені аль-афиядан жақсы нәрсе ешкімге берілген емес.»* — Жами ат-Тирмизи 3512 (**Сахих**, әл-Албани бойынша)","*«О, Алла, мазасыздықтан және қайғыдан, дәрменсіздіктен және жалқаулықтан, қорқақтықтан және сараңдықтан, борыштың ауырлығынан және адамдардың билігінен Саған сиынамын.»* — Сахих әл-Бухари 6363 (**Сахих**)"],"scholars":["**Ибн әл-Қаййим** — *«Болашаққа мазасыздық — шайтанның мүміндерге қарсы ең үлкен қаруларының бірі. Адамдардың қорқатынының көпшілігі ешқашан болмайды.»* — *Әл-Фауаид*","**Имам әл-Ғазали** — *«Алланың даналығына сену мазасыздықты күтуге айналдырады. Ол сіздің ісіңізді басқарып отырғанын білгенде, тыныштық таба аласыз.»* — *Ихья Улюм ад-Дин* (жинақталған)"],"lessons":["Алланың достары қорқыныш пен қайғыдан азат (10:62) — тақуа — ішкі тыныштыққа апаратын жол.","Мазасыздық сәттерінде *\"хасбуналлаhу уа ниъмаль-уәкил\"* (3:173) деңіз.","Мазасыздықтан дұғаны күнделікті оқыңыз; Пайғамбар ﷺ мұны тікелей үйретті (Бухари 6363).","Болашаққа мазасыздық — көбінесе тавакккулдың жетіспеушілігі; нәтижені Аллаға тапсыру тәжірибесін жасаңыз.\n---"]}}},{"id":"hope","categoryId":"mental-wellbeing","order":31,"translations":{"en":{"name":"Hope","quran":[{"reference":"39:53","text":"\"Say: O My servants who have transgressed against themselves [by sinning], do not despair of the mercy of Allah. Indeed, Allah forgives all sins. Indeed, it is He who is the Forgiving, the Merciful.\""},{"reference":"15:56","text":"\"[Ibrahim] said: 'And who despairs of the mercy of his Lord except for those astray?'\""},{"reference":"12:87","text":"\"Do not despair of relief from Allah. Indeed, no one despairs of relief from Allah except the disbelieving people.\""}],"hadith":["*\"Allah said: 'I am as My servant expects Me to be. I am with him when he mentions Me.'\"* — Sahih al-Bukhari 7405, Sahih Muslim 2675 (**Sahih**)","*\"None of you should die except while he has good expectations of Allah.\"* — Sahih Muslim 2877 (**Sahih**)"],"scholars":["**Ibn al-Qayyim** — *\"Hope is the fuel of the heart's journey to Allah. Without it, the traveller stops walking.\"* — *Madarij as-Salikin*","**Imam Al-Ghazali** — *\"Hope is not mere wishing. It is the state of a heart that knows Allah's mercy is real and acts accordingly.\"* — *Ihya' Ulum ad-Din*"],"lessons":["Despair of Allah's mercy is explicitly condemned — even the greatest sinner should never lose hope (39:53).","Allah treats you according to your expectations of Him — think well of Allah always.","Maintain good expectations of Allah especially at the time of death (Sahih Muslim 2877).","Hope paired with action is the Islamic balance — not passive wishful thinking, but expectant striving.\n---"]},"ru":{"name":"Надежда","quran":[{"reference":"39:53","text":"«Скажи: \"О рабы Мои, которые преступили меры против самих себя! Не отчаивайтесь в милости Аллаха. Воистину, Аллах прощает грехи полностью, ведь Он — Прощающий, Милосердный\".»"},{"reference":"15:56","text":"«[Ибрахим] сказал: \"Кто же отчаивается в милости своего Господа, кроме заблудших?\"»"},{"reference":"12:87","text":"«Не отчаивайтесь в утешении от Аллаха. Воистину, в утешении от Аллаха отчаиваются только неверующие.»"}],"hadith":["*«Аллах говорит: \"Я таков, каким Меня ожидает Мой раб. Я с ним, когда он поминает Меня\".»* — Сахих аль-Бухари 7405, Сахих Муслим 2675 (**Достоверный**)","*«Никто из вас не должен умирать иначе, как ожидая от Аллаха только хорошего.»* — Сахих Муслим 2877 (**Достоверный**)"],"scholars":["**Ибн аль-Каййим** — *«Надежда — топливо путешествия сердца к Аллаху. Без неё путник останавливается.»* — *Мадаридж ас-Саликин*","**Имам аль-Газали** — *«Надежда — не просто желание. Это состояние сердца, которое знает, что милость Аллаха реальна, и действует соответственно.»* — *Ихья Улюм ад-Дин*"],"lessons":["Отчаяние в милости Аллаха прямо осуждается — даже величайший грешник никогда не должен терять надежду (39:53).","Аллах относится к вам согласно вашим ожиданиям от Него — всегда думайте об Аллахе хорошо.","Сохраняйте добрые ожидания от Аллаха особенно в момент смерти (Сахих Муслим 2877).","Надежда в сочетании с действием — исламский баланс: не пассивное желание, а ожидающее стремление.\n---"]},"kk":{"name":"Үміт","quran":[{"reference":"39:53","text":"«Айт: \"Ей, Менің өзіне қарсы шектен шыққан бандаларым! Алланың рахметінен үмітсіз болмаңдар. Расында, Алла күнәлардың барлығын кешіреді\".»"},{"reference":"15:56","text":"«[Ибраhим] айтты: \"Адасушылардан басқа Раббысының рахметінен кім үмітін үзеді?\"»"},{"reference":"12:87","text":"«Алланың тыныштандыруынан үміт үзбеңдер. Расында, Алланың тыныштандыруынан кәпірлерден басқа ешкім үміт үзбейді.»"}],"hadith":["*«Алла айтты: \"Мен бандам туралы ойлайтынындаймын. Ол Мені еске алғанда Мен онымен бірге боламын\".»* — Сахих әл-Бухари 7405, Сахих Муслим 2675 (**Сахих**)","*«Сендердің ешқайсысың Алладан тек жақсы нәрсе күтпей тұрып өлмесін.»* — Сахих Муслим 2877 (**Сахих**)"],"scholars":["**Ибн әл-Қаййим** — *«Үміт — жүректің Аллаға сапарындағы отын. Онсыз жолаушы аялдайды.»* — *Мадаридж әс-Саликин*","**Имам әл-Ғазали** — *«Үміт — жай тілек емес. Бұл Алланың рахметі шынайы екенін білетін және сол бойынша қимылдайтын жүректің күйі.»* — *Ихья Улюм ад-Дин*"],"lessons":["Алланың рахметінен үмітсіздік тікелей айыпталады — тіпті ең үлкен күнәкар да үмітін жоғалтпауы тиіс (39:53).","Алла сіздің Оның туралы ойыңызға сәйкес қарайды — Алла туралы әрдайым жақсы ойлаңыз.","Аллаға деген жақсы үмітті, әсіресе өлім алдында, сақтаңыз (Сахих Муслим 2877).","Амалмен қосарланған үміт — Исламдық тепе-теңдік: пассивті тілек емес, іздеп күту.\n---"]}}},{"id":"sadness","categoryId":"mental-wellbeing","order":32,"translations":{"en":{"name":"Sadness","quran":[{"reference":"2:155–157","text":"\"And We will surely test you with something of fear and hunger... but give good tidings to the patient — who, when disaster strikes them, say: 'Indeed we belong to Allah, and indeed to Him we will return.' Those are the ones upon whom are blessings from their Lord and mercy.\""},{"reference":"12:86","text":"\"[Yaqub] said: 'I only complain of my suffering and my grief to Allah.'\""},{"reference":"94:5","text":"\"For indeed, with hardship will be ease.\""}],"hadith":["*\"No fatigue, nor disease, nor sorrow, nor sadness, nor hurt, nor distress befalls a Muslim — even the prick of a thorn — but that Allah expiates some of his sins.\"* — Sahih al-Bukhari 5641 (**Sahih**)","*\"Recite the du'a: Allahumma inni 'abduka... [O Allah, I am Your servant...] — whoever says it with certainty in his heart, Allah will drive away his sorrow and replace his grief with joy.\"* — Sunan Abu Dawood 1555 (**Sahih** per Al-Albani)"],"scholars":["**Ibn al-Qayyim** — *\"Sadness, when accepted with patience and directed toward Allah, purifies the heart as fire purifies gold.\"* — *Madarij as-Salikin*","**Hasan al-Basri** — *\"The believer wakes up sad and goes to sleep sad — and this is fitting, for he is between two great matters: what has passed of his sins, and what remains of his life.\"* — Widely attributed."],"lessons":["Take your grief to Allah directly, as Prophet Yaqub did — not to social media or mere venting.","Sadness is not a sign of weak faith — the prophets experienced dee
