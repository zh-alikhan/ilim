<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ilim — Preview</title>
<style>
:root{--gold:#C9A227;--gold-light:#D4AF37;--gold-deep:#B8860B;--gold-wash:#FBF7EC;--gold-faint:#FDFBF5;
--ink:#1A1A1A;--ink-soft:#4A4E57;--ink-muted:#8A8F9A;--line:#E8EAED;--line-soft:#F0F1F4;--mist:#F5F6F8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',system-ui,sans-serif;background:#020308;color:#e8eaf0;-webkit-font-smoothing:antialiased;}
.font-display{font-family:'Manrope','Inter',sans-serif;}
::selection{background:rgba(201,162,39,.18);}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
:focus-visible{outline:none;box-shadow:0 0 0 2px var(--gold),0 0 0 4px #fff;border-radius:4px;}
header{position:sticky;top:0;z-index:30;height:64px;border-bottom:1px solid rgba(255,255,255,.1);background:rgba(6,10,28,.7);backdrop-filter:blur(12px);}
.header-inner{max-width:72rem;margin:0 auto;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;}

.burger{display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);border-radius:999px;padding:8px;color:rgba(255,255,255,.8);cursor:pointer;margin-right:10px;transition:.2s;}
.burger:hover{border-color:rgba(201,162,39,.5);color:#fff;}
.burger svg{width:16px;height:16px;display:block;}
.drawer-backdrop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s;}
.drawer-backdrop.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;inset:0 auto 0 0;z-index:50;width:86%;max-width:22rem;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.1);background:rgba(8,13,32,.97);backdrop-filter:blur(20px);transform:translateX(-100%);transition:transform .4s cubic-bezier(.22,1,.36,1);}
.drawer.open{transform:translateX(0);}
.drawer-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.1);padding:16px 20px;}
.drawer-close{border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);border-radius:999px;padding:6px;color:rgba(255,255,255,.7);cursor:pointer;line-height:0;transition:.2s;}
.drawer-close:hover{border-color:rgba(201,162,39,.5);color:#fff;}
.drawer-nav{flex:1;overflow-y:auto;padding:16px 12px;}
.drawer-cat{margin-bottom:20px;}
.drawer-cat h2{display:flex;align-items:center;gap:8px;padding:0 8px;margin-bottom:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--gold-deep);}
.drawer-cat ul{list-style:none;margin:0;padding:0;}
.drawer-item{width:100%;text-align:left;border:none;background:none;border-radius:8px;padding:8px 12px;font-size:14px;color:rgba(255,255,255,.75);cursor:pointer;transition:.15s;font-family:inherit;}
.drawer-item:hover{background:rgba(255,255,255,.05);color:#fff;}
.drawer-item.active{background:rgba(201,162,39,.15);color:var(--gold-light);font-weight:600;}
.brand{display:flex;align-items:baseline;gap:.5rem;}
.brand-name{font-family:'Manrope';font-size:1.25rem;font-weight:800;letter-spacing:-.02em;color:#fff;}
.brand-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);transform:translateY(-1px);}
.lang{display:inline-flex;gap:2px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);border-radius:999px;padding:2px;}
.lang button{border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;color:rgba(255,255,255,.6);transition:.3s;}
.lang button.active{background:var(--gold);color:#fff;box-shadow:0 1px 2px rgba(16,24,40,.2);}
.back-btn{display:none;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;color:rgba(255,255,255,.8);margin-right:12px;transition:.2s;}
.back-btn:hover{border-color:rgba(201,162,39,.4);color:var(--ink);}
.back-btn.show{display:inline-flex;}
.header-left{display:flex;align-items:center;}
.home{position:relative;display:flex;flex-direction:column;align-items:center;transition:padding .6s cubic-bezier(.22,1,.36,1);background:transparent;}
.home.full{min-height:calc(100vh - 64px);padding:1.25rem 1.5rem 2rem;justify-content:flex-start;position:relative;}
.home.compact{padding:2rem 1.5rem;}
.home.full .hero-top{position:relative;z-index:10;margin-bottom:.5rem;} .home.compact .hero-top{position:static;} .eyebrow{font-size:.85rem;font-weight:600;text-transform:uppercase;letter-spacing:.2em;color:var(--gold-light);text-align:center;margin-bottom:1rem;position:relative;z-index:10;transition:font-size .4s;}
.home.compact .home.full .hero-top{position:relative;z-index:10;margin-bottom:.5rem;} .home.compact .hero-top{position:static;} .eyebrow{font-size:.7rem;margin-bottom:0;}
.hero-title{font-family:'Manrope';font-size:clamp(2rem,4vw,3.25rem);font-weight:800;letter-spacing:-.025em;line-height:1.06;text-align:center;max-width:42rem;margin:0 auto;text-wrap:balance;color:#fff;position:relative;z-index:10;}
.hint{display:flex;align-items:center;gap:8px;font-size:14px;color:rgba(255,255,255,.6);z-index:10;} .home.full .hint{position:absolute;bottom:2rem;left:0;right:0;justify-content:center;} .home.compact .hint{margin-top:1.5rem;justify-content:center;}
.sphere-holder{position:relative;z-index:10;display:flex;align-items:center;justify-content:center;flex:1;min-height:0;transition:width .6s,height .6s;}
.sphere-stage{position:relative;transition:width .6s cubic-bezier(.22,1,.36,1),height .6s cubic-bezier(.22,1,.36,1);}
.fade-white{display:none;}
.content{max-width:52rem;margin:3rem auto 0;padding:2.5rem 2rem 4rem;scroll-margin-top:96px;background:transparent;color:#e8eaf0;}
.cat-label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:#e3c05a;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;}
.topic-title{font-family:'Manrope';font-size:clamp(1.5rem,2.5vw,2.25rem);font-weight:800;letter-spacing:-.02em;text-wrap:balance;color:#f4f6fb;}
.rule-gold{height:1px;margin-top:1.5rem;background:linear-gradient(90deg,transparent,rgba(201,162,39,.5) 15%,rgba(201,162,39,.5) 85%,transparent);}
.section{margin-top:3.5rem;}
.sec-head{display:flex;align-items:flex-start;gap:1rem;margin-bottom:1.5rem;}
.sec-icon{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:12px;border:1px solid rgba(201,162,39,.3);background:rgba(201,162,39,.14);font-size:20px;}
.sec-num{font-family:'Manrope';font-size:12px;font-weight:700;color:var(--gold);}
.sec-title{font-family:'Manrope';font-size:1.5rem;font-weight:800;letter-spacing:-.02em;color:#f4f6fb;}
.sec-sub{font-size:14px;color:#8b93a7;margin-top:2px;}
.verse{position:relative;overflow:hidden;border-radius:16px;border:1px solid rgba(201,162,39,.25);background:rgba(201,162,39,.08);padding:1.75rem;margin-bottom:1rem;backdrop-filter:blur(8px);}
.verse-bar{position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(180deg,var(--gold-light),var(--gold-deep));}
.verse-ref{display:inline-block;border-radius:999px;background:var(--gold);color:#fff;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:12px;}
.verse-text{font-family:'Manrope';font-size:1.25rem;line-height:1.6;text-wrap:pretty;color:#f4f6fb;}
.card{border-radius:16px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);padding:1.75rem;margin-bottom:1rem;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:.3s;backdrop-filter:blur(8px);}
.card:hover{border-color:rgba(255,255,255,.18);}
.card-quote{font-size:1.125rem;line-height:1.6;text-wrap:pretty;color:#e8eaf0;}
.card-foot{margin-top:1rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-wrap:wrap;align-items:center;gap:12px;}
.cite{font-size:14px;font-weight:500;color:#c3c8d4;font-style:normal;}
.badge{display:inline-flex;align-items:center;border-radius:999px;background:rgba(201,162,39,.16);color:#e3c05a;border:1px solid rgba(201,162,39,.35);padding:2px 10px;font-size:12px;font-weight:500;}
.note{font-size:12px;color:#8b93a7;}
.grid2{display:grid;gap:1rem;}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr;}}
.scholar{display:flex;flex-direction:column;height:100%;border-radius:16px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);padding:1.5rem;box-shadow:0 1px 2px rgba(0,0,0,.3);backdrop-filter:blur(8px);}
.scholar-quote-mark{color:rgba(201,162,39,.5);font-size:24px;margin-bottom:8px;}
.scholar-name{font-family:'Manrope';font-size:14px;font-weight:700;color:#e3c05a;}
.scholar-src{font-size:12px;color:#8b93a7;font-style:normal;margin-top:2px;}
.editorial{display:flex;align-items:flex-start;gap:10px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);padding:12px 16px;margin-bottom:1.25rem;}
.editorial p{font-size:12px;line-height:1.5;color:#8b93a7;}
.lesson{display:flex;align-items:flex-start;gap:1rem;border-radius:16px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);padding:1.25rem;margin-bottom:.75rem;box-shadow:0 1px 2px rgba(0,0,0,.3);backdrop-filter:blur(8px);}
.lesson-num{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(201,162,39,.16);font-family:'Manrope';font-size:14px;font-weight:700;color:#e3c05a;}
.lesson p{padding-top:2px;font-size:1rem;line-height:1.6;color:#c3c8d4;text-wrap:pretty;}
em{font-style:normal;color:#fff;}strong{font-weight:600;color:#fff;}
footer{margin-top:2rem;border-top:1px solid rgba(255,255,255,.1);background:transparent;}
.footer-inner{max-width:52rem;margin:0 auto;padding:3rem 2rem;}
.footer-dis{max-width:68ch;font-size:14px;line-height:1.6;color:rgba(255,255,255,.5);margin-top:12px;}
.fade-in{animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
#pageStars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}

.lang{display:inline-flex;gap:2px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);border-radius:999px;padding:2px;}
.lang button{border-radius:999px;padding:4px 14px;font-size:12px;font-weight:600;color:rgba(255,255,255,.6);transition:.3s;cursor:pointer;background:none;border:none;}
.lang button.active{background:var(--gold);color:#fff;box-shadow:0 1px 2px rgba(16,24,40,.2);}
.lang button:hover:not(.active){color:rgba(255,255,255,.9);}
/* Google Translate — kept for KZ only, visually hidden */
#google_translate_element{position:absolute!important;left:-9999px!important;top:-9999px!important;width:1px!important;height:1px!important;overflow:hidden!important;}
.goog-te-banner-frame,.skiptranslate iframe{display:none!important;}
body{top:0!important;position:static!important;}
.goog-tooltip,.goog-tooltip:hover{display:none!important;}
.goog-text-highlight{background:none!important;box-shadow:none!important;}
.preview-banner{background:var(--gold-wash);border-bottom:1px solid rgba(201,162,39,.2);text-align:center;padding:6px;font-size:12px;color:var(--gold-deep);}
.tlabel{position:absolute;left:0;top:0;font-weight:700;font-family:'Manrope',sans-serif;letter-spacing:-.01em;white-space:nowrap;border:none;background:transparent;cursor:pointer;padding:2px 6px;border-radius:999px;will-change:transform,opacity;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.5);}
@media(max-width:640px){.header-inner,.content,.footer-inner{padding-left:1.25rem;padding-right:1.25rem;}}
</style>
</head>

const DATA = {"meta":{"topicCount":57,"categoryCount":8,"locales":["en","ru","kk"],"generatedFrom":"ilim_knowledge_base_TRILINGUAL.md"},"categories":[{"id":"family","order":0,"name":{"en":"Family","ru":"Семья","kk":"Отбасы"}},{"id":"relationships","order":1,"name":{"en":"Relationships","ru":"Отношения","kk":"Қарым-қатынас"}},{"id":"personal-development","order":2,"name":{"en":"Personal Development","ru":"Личностный рост","kk":"Жеке даму"}},{"id":"work-success","order":3,"name":{"en":"Work & Success","ru":"Труд и успех","kk":"Еңбек және табыс"}},{"id":"mental-wellbeing","order":4,"name":{"en":"Mental & Emotional Well-being","ru":"Психическое и эмоциональное благополучие","kk":"Психикалық және эмоциялық саулық"}},{"id":"society","order":5,"name":{"en":"Society","ru":"Общество","kk":"Қоғам"}},{"id":"health","order":6,"name":{"en":"Health","ru":"Здоровье","kk":"Денсаулық"}},{"id":"spirituality","order":7,"name":{"en":"Spirituality","ru":"Духовность","kk":"Рухани өмір"}}],"topics":[{"id":"mother","categoryId":"family","order":0,"translations":{"en":{"name":"Mother","quran":[{"reference":"17:23","text":"\"Your Lord has decreed that you worship none but Him, and that you be kind to parents. Whether one or both of them attain old age in your life, say not to them a word of contempt, nor repel them, but address them in terms of honour.\""},{"reference":"31:14","text":"\"His mother carried him in weakness upon weakness, and his weaning is in two years. Be grateful to Me and to your parents.\""},{"reference":"17:24","text":"\"And lower to them the wing of humility out of mercy and say: My Lord, have mercy upon them as they raised me when I was small.\""}],"hadith":["*\"A man asked the Prophet ﷺ: 'Who is most deserving of my good company?' He said: 'Your mother.' Three times. Then: 'Your father.'\"* — Sahih al-Bukhari 5971, Sahih Muslim 2548 (**Sahih**)","*\"Paradise lies at the feet of your mothers.\"* — Sunan An-Nasa'i 3104, Musnad Ahmad 15820 (**Sahih** per Al-Albani)"],"scholars":["**Ibn al-Qayyim** — *\"Among the greatest causes of sins are heedlessness toward parents and ingratitude for their blessings.\"* — *Madarij as-Salikin*","**Imam Al-Ghazali** — *\"The mother bore hardship in carrying the child, hardship in giving birth, and hardship in raising him. Her right is therefore immense.\"* — *Ihya' Ulum ad-Din*"],"lessons":["Seek her contentment daily — it is directly linked to Allah's pleasure.","Never speak to her with contempt, even a single word.","Serve her especially in old age; neglecting an elderly mother is a cause of exclusion from Paradise.","Make the Quranic du'a for her after every prayer: *\"My Lord, have mercy upon them as they raised me when I was small.\"*\n---"]},"ru":{"name":"Мать","quran":[{"reference":"17:23","text":"«Твой Господь предписал вам не поклоняться никому, кроме Него, и делать добро родителям. Если один из них или оба достигнут у тебя старости, не говори им \"уф\" и не кричи на них, а обращайся к ним с уважением.»"},{"reference":"31:14","text":"«Его мать носила его, испытывая слабость за слабостью, а отлучение от груди происходит в два года. Будь благодарен Мне и своим родителям.»"},{"reference":"17:24","text":"«Преклоняй пред ними крыло смирения из милосердия и говори: \"Господи, помилуй их, как они растили меня маленьким\".»"}],"hadith":["*«Один мужчина спросил Пророка ﷺ: \"Кто более всего заслуживает моего доброго отношения?\" Он сказал: \"Твоя мать\". Трижды. Затем: \"Твой отец\".»* — Сахих аль-Бухари 5971, Сахих Муслим 2548 (**Достоверный**)","*«Рай находится под ногами матерей.»* — Сунан ан-Насаи 3104, Муснад Ахмад 15820 (**Достоверный** по аль-Альбани)"],"scholars":["**Ибн аль-Каййим** — *«Среди величайших причин грехов — небрежность по отношению к родителям и неблагодарность за их благодеяния.»* — *Мадаридж ас-Саликин*","**Имам аль-Газали** — *«Мать претерпела тяготы, вынашивая ребёнка, тяготы при его рождении и тяготы при его воспитании. Поэтому её право огромно.»* — *Ихья Улюм ад-Дин*"],"lessons":["Ежедневно стремитесь к её довольству — оно напрямую связано с довольством Аллаха.","Никогда не говорите ей ни единого слова с презрением.","Служите ей особенно в старости; небрежение пожилой матерью ведёт к лишению Рая.","Читайте за неё коранические ду'а после каждой молитвы: *«Господи, помилуй их, как они растили меня маленьким».*\n---"]},"kk":{"name":"Ана","quran":[{"reference":"17:23","text":"«Раббың тек Оған ғана ғибадат етуді және ата-анаға жақсылық жасауды бұйырды. Олардың бірі немесе екеуі де сенің қасыңда кәрілікке жетсе, оларға \"уф\" деме, оларды ұрыспа, оларға ізеттілікпен сөйле.»"},{"reference":"31:14","text":"«Оның анасы оны бірінен соң бірі азайып баратын күш-қуатымен көтерді; оның емізуден шығарылуы екі жылда болды. Маған және ата-аналарыңа шүкіршілік ет.»"},{"reference":"17:24","text":"«Оларға мейірімділіктен рақымсыну қанатыңды кер де: \"Раббым! Олар мені кішкентайымда тәрбиелегені үшін оларға рақым жаса\" де.»"}],"hadith":["*«Бір еркек Пайғамбардан ﷺ сұрады: \"Жақсы қарым-қатынасыма кім ең лайықты?\" Ол айтты: \"Анаң\". Үш рет. Сонан соң: \"Әкең\".»* — Сахих әл-Бухари 5971, Сахих Муслим 2548 (**Сахих**)","*«Жұмақ аналардың аяғының астында.»* — Сунан ан-Несаи 3104, Муснад Ахмад 15820 (**Сахих**, әл-Албани бойынша)"],"scholars":["**Ибн әл-Қаййим** — *«Күнәлардың ең үлкен себептерінің бірі — ата-анаға немқұрайлылық және олардың игіліктеріне ризашылықсыздық.»* — *Мадаридж әс-Саликин*","**Имам әл-Ғазали** — *«Ана баланы көтеруде де, туғызуда да, тәрбиелеуде де қиындыққа ұшырады. Сол себепті оның құқығы орасан зор.»* — *Ихья Улюм ад-Дин*"],"lessons":["Оның ризашылығын күн сайын іздеңіз — ол тікелей Алланың ризашылығымен байланысты.","Оған ешқашан менсінбеушілікпен тіпті бір сөз де айтпаңыз.","Оған әсіресе кәрілікте қызмет етіңіз; қарт анаға немқұрайды болу жұмақтан айырылудың себебі болады.","Әр намаздан кейін ол үшін Құраннан дұға оқыңыз: *«Раббым! Олар мені кішкентайымда тәрбиелегені үшін оларға рақым жаса.»*\n---"]}}},{"id":"father","categoryId":"family","order":1,"translations":{"en":{"name":"Father","quran":[{"reference":"17:23","text":"\"Your Lord has decreed that you worship none but Him, and that you be kind to parents... address them in terms of honour.\""},{"reference":"14:41","text":"\"Our Lord, forgive me and my parents and the believers the Day the account is established.\"* (Du'a of Prophet Ibrahim)"},{"reference":"12:100","text":"\"[Yusuf] raised his parents upon the throne... and said: O my father, this is the interpretation of my vision of before.\""}],"hadith":["*\"The satisfaction of the Lord is in the satisfaction of the father, and the displeasure of the Lord is in the displeasure of the father.\"* — Jami' at-Tirmidhi 1899 (**Hasan**)","*\"Are your parents alive?\" He said: \"Yes.\" He said: \"Then strive in their service, for that is your jihad.\"* — Sahih al-Bukhari 3004 (**Sahih**)"],"scholars":["**Ibn al-Qayyim** — *\"The father is the root of the child. Whoever honours his root flourishes.\"* — *Tuhfat al-Mawdud*","**Imam Al-Ghazali** — *\"The rights of the father are immense, for he was the cause of the child's existence and the means of his upbringing.\"* — *Ihya' Ulum ad-Din*"],"lessons":["Treat his satisfaction as a religious obligation — it mirrors Allah's pleasure.","Serve him as an act of worship, not mere duty.","Provide for him materially if he is in need — this is a legal obligation in Islam.","Make du'a for him as the prophets did, following the example of Ibrahim (عليه السلام).\n---"]},"ru":{"name":"Отец","quran":[{"reference":"17:23","text":"«Твой Господь предписал вам не поклоняться никому, кроме Него, и делать добро родителям... обращайся к ним с уважением.»"},{"reference":"14:41","text":"«Господи, прости меня, моих родителей и верующих в День, когда настанет расчёт.»* (Ду'а Пророка Ибрахима)"},{"reference":"12:100","text":"«[Юсуф] возвёл своих родителей на трон... и сказал: \"О отец мой! Вот толкование моего прежнего сна\".»"}],"hadith":["*«Довольство Господа — в довольстве отца, и гнев Господа — в гневе отца.»* — Джами ат-Тирмизи 1899 (**Хороший**)","*«Живы ли твои родители?\" Он ответил: \"Да\". Тогда он сказал: \"Тогда служи им — это и есть твой джихад\".»* — Сахих аль-Бухари 3004 (**Достоверный**)"],"scholars":["**Ибн аль-Каййим** — *«Отец — это корень ребёнка. Тот, кто чтит свой корень, процветает.»* — *Тухфат аль-Мауляд*","**Имам аль-Газали** — *«Права отца огромны, ибо он стал причиной существования ребёнка и средством его воспитания.»* — *Ихья Улюм ад-Дин*"],"lessons":["Относитесь к его довольству как к религиозной обязанности — оно отражает довольство Аллаха.","Служите ему как поклонению, а не просто как долгу.","Обеспечивайте его материально при необходимости — это исламское обязательство.","Делайте ду'а за него, как это делали пророки, следуя примеру Ибрахима (عليه السلام).\n---"]},"kk":{"name":"Әке","quran":[{"reference":"17:23","text":"«Раббың... ата-анаға жақсылық жасауды бұйырды... оларға ізеттілікпен сөйле.»"},{"reference":"14:41","text":"«Раббымыз! Есеп берілетін күні маған, ата-анама және барлық мүміндерге кешіре гөр.»* (Пайғамбар Ибраhимнің дұғасы)"},{"reference":"12:100","text":"«[Жүсіп] ата-анасын тақта отырғызды... және айтты: \"Ата, мынау менің ерте заманнан бергі түсімнің жорамалы\".»"}],"hadith":["*«Раббының ризашылығы — әкенің ризашылығында, Раббының ашуы — әкенің ашуында.»* — Жами ат-Тирмизи 1899 (**Хасан**)","*«\"Ата-анаң тіріме?\" — деп сұрады. \"Иә\" деді. Ол айтты: \"Онда оларға қызмет ет — бұл сенің жиhадың\".»* — Сахих әл-Бухари 3004 (**Сахих**)"],"scholars":["**Ибн әл-Қаййим** — *«Әке — баланың тамыры. Тамырын сыйлаған гүлденеді.»* — *Тухфат әл-Маулюд*","**Имам әл-Ғазали** — *«Әкенің құқықтары орасан зор, өйткені ол баланың өмірге келуінің себебі және тәрбиелеушісі болды.»* — *Ихья Улюм ад-Дин*"],"lessons":["Оның ризашылығын діни міндет ретінде қараңыз — ол Алланың ризашылығын бейнелейді.","Оған қызмет етуді жай міндет емес, ғибадат ретінде қараңыз.","Қажет болса, оны материалдық жағынан қамтамасыз етіңіз — бұл Исламдағы заңды міндет.","Ибраhим (عليه السلام) үлгісі бойынша, пайғамбарлар жасаған сияқты оны үшін дұға жасаңыз.\n---"]}}},{"id":"parents","categoryId":"family","order":2,"translations":{"en":{"name":"Parents","quran":[{"reference":"17:23","text":"\"Your Lord has decreed that you worship none but Him, and that you be kind to parents.\""},{"reference":"46:15","text":"\"We have enjoined upon man, to his parents, good treatment. His mother carried him with hardship and gave birth to him with hardship.\""},{"reference":"4:36","text":"\"Worship Allah and associate nothing with Him, and to parents do good.\""}],"hadith":["*\"Which deed is most beloved to Allah?\" He said: \"Prayer on time.\" Then: \"Kindness to parents.\" Then: \"Jihad in the way of Allah.\"* — Sahih al-Bukhari 527, Sahih Muslim 85 (**Sahih**)","*\"He is doomed, he is doomed, he is doomed — the one whose parents reach old age and he does not enter Paradise [by failing to serve them].\"* — Sahih Muslim 2551 (**Sahih**)"],"scholars":["**Ibn Taymiyyah** — *\"Honouring one's parents is among the greatest of deeds, and dishonouring them is among the gravest of sins.\"* — *Majmu' al-Fatawa*","**Hasan al-Basri** — *\"Show kindness to your parents; if you make them weep, you have disobeyed Allah.\"* — Widely attributed in classical adab literature."],"lessons":["Birr al-walidayn (kindness to parents) ranks second only to prayer among all deeds.","Their old age is the greatest test — serve them then without complaint.","Even if they are non-Muslim, maintain kindness; only obedience in sin is withheld.","Provide for them financially if needed — it is an Islamic obligation, not optional charity.\n---"]},"ru":{"name":"Родители","quran":[{"reference":"17:23","text":"«Твой Господь предписал вам... делать добро родителям.»"},{"reference":"46:15","text":"«Мы заповедали человеку делать добро своим родителям. Его мать носила его с трудом и родила с трудом.»"},{"reference":"4:36","text":"«Поклоняйтесь Аллаху и не приобщайте к Нему ничего в сотоварищи, и делайте добро родителям.»"}],"hadith":["*«Какое дело наиболее любимо Аллахом?\" Он сказал: \"Молитва в её время\". Затем: \"Доброе отношение к родителям\". Затем: \"Джихад на пути Аллаха\".»* — Сахих аль-Бухари 527, Сахих Муслим 85 (**Достоверный**)","*«Горе ему, горе ему, горе ему — тому, чьи родители дожили до старости, а он не вошёл в Рай [не служив им].»* — Сахих Муслим 2551 (**Достоверный**)"],"scholars":["**Ибн Таймийя** — *«Почитание родителей — среди величайших деяний, а пренебрежение ими — среди тягчайших грехов.»* — *Маджму аль-Фатава*","**Хасан аль-Басри** — *«Будь добр к своим родителям; если ты заставишь их плакать, ты ослушался Аллаха.»* — Широко приписывается в классической литературе по адабу."],"lessons":["Бирр аль-валидайн (доброе отношение к родителям) занимает второе место после молитвы среди всех деяний.","Их старость — величайшее испытание: служите им без жалоб.","Даже если они не являются мусульманами, сохраняйте доброту; нельзя лишь повиноваться им в грехе.","Обеспечивайте их материально при необходимости — это исламское обязательство, а не добровольная милостыня.\n---"]},"kk":{"name":"Ата-ана","quran":[{"reference":"17:23","text":"«Раббың ата-анаға жақсылық жасауды бұйырды.»"},{"reference":"46:15","text":"«Біз адамға ата-анасына жақсылық жасауды өсиет еттік. Оның анасы оны қиналып көтерді және қиналып туғызды.»"},{"reference":"4:36","text":"«Аллаға ғибадат етіңдер және Оған ешнәрсені серік қоспаңдар, ата-анаға жақсылық жасаңдар.»"}],"hadith":["*«Алланың алдында ең сүйікті амал қайсы?\" — деп сұрады. Ол айтты: \"Уақытында оқылған намаз\". Сонан соң: \"Ата-анаға жақсылық жасау\". Сонан соң: \"Алла жолындағы жиhад\".»* — Сахих әл-Бухари 527, Сахих Муслим 85 (**Сахих**)","*«Ол жойылды, ол жойылды, ол жойылды — ата-анасы кәрілікке жеткенде, оларға қызмет етпей жұмаққа кіре алмаған адам.»* — Сахих Муслим 2551 (**Сахих**)"],"scholars":["**Ибн Таймийя** — *«Ата-анаға ізет көрсету — амалдардың ең ұлысы, ал оларды кемсіту — күнәлардың ең ауыры.»* — *Мажму әл-Фатауа*","**Хасан әл-Басри** — *«Ата-анаңа жақсылық жаса; егер сен оларды жылататын болсаң, Аллаға бағынбадың деген сөз.»* — Классикалық адаб әдебиетінде кеңінен айтылады."],"lessons":["Бирр әл-уалидайн (ата-анаға жақсылық жасау) барлық амалдар арасында намаздан кейін екінші орында тұрады.","Олардың кәрілігі — ең үлкен сынақ: оларға шағымсыз қызмет етіңіз.","Олар мұсылман болмаса да, мейірімділікті сақтаңыз; тек күнәдағы бағынышқа тыйым салынады.","Қажет болса, оларды материалдық жағынан қамтамасыз етіңіз — бұл Исламдағы міндет, ерікті садақа емес.\n---"]}}},{"id":"children","categoryId":"family","order":3,"translations":{"en":{"name":"Children","quran":[{"reference":"66:6","text":"\"O you who have believed, protect yourselves and your families from a Fire whose fuel is people and stones.\""},{"reference":"2:233","text":"\"Mothers may breastfeed their children two complete years for whoever wishes to complete the nursing period.\""},{"reference":"18:46","text":"\"Wealth and children are [but] adornment of the worldly life. But the enduring good deeds are better to your Lord for reward and better for [one's] hope.\""}],"hadith":["*\"Every one of you is a shepherd and is responsible for his flock... the man is a shepherd in his family and is responsible for his subjects.\"* — Sahih al-Bukhari 893, Sahih Muslim 1829 (**Sahih**)","*\"A man's teaching his child good manners is better for him than giving a bushel of grain in charity.\"* — Jami' at-Tirmidhi 1951 (**Hasan** per At-Tirmidhi)"],"scholars":["**Ibn al-Qayyim** — *\"The child is a trust in the parent's hands. His pure heart is a precious gem; if taught good, he grows upon it. If neglected, he is ruined.\"* — *Tuhfat al-Mawdud*","**Imam Al-Ghazali** — *\"The most important thing a parent can give a child is a good upbringing, for the child's character begins with the parent's example.\"* — *Ihya' Ulum ad-Din*"],"lessons":["Your primary responsibility is to protect your children from spiritual harm — not just physical danger.","Teaching a child good manners and deen is counted as ongoing charity (sadaqah jariyah).","Give your children time and presence, not just provision — the Prophet ﷺ played with children and showed affection.","Make du'a for your children regularly; the du'a of a parent for their child is among the most accepted.\n---"]},"ru":{"name":"Дети","quran":[{"reference":"66:6","text":"«О те, кто уверовал! Спасайте себя и своих близких от Огня, топливом для которого служат люди и камни.»"},{"reference":"2:233","text":"«Матери кормят своих детей грудью два полных года — для тех, кто хочет завершить кормление.»"},{"reference":"18:46","text":"«Богатство и дети — украшение земной жизни. Однако праведные вечные деяния лучше вознаграждением пред твоим Господом.»"}],"hadith":["*«Каждый из вас является пастырем и каждый несёт ответственность за свою паству... муж является пастырем в своей семье и несёт ответственность за своих подопечных.»* — Сахих аль-Бухари 893, Сахих Муслим 1829 (**Достоверный**)","*«То, что мужчина обучает своего ребёнка хорошим манерам, лучше для него, чем раздача меры зерна в качестве садака.»* — Джами ат-Тирмизи 1951 (**Хороший** по ат-Тирмизи)"],"scholars":["**Ибн аль-Каййим** — *«Ребёнок — это аманат в руках родителей. Его чистое сердце — драгоценный камень: если его учат добру, он растёт на этом; если им пренебрегают — он погибает.»* — *Тухфат аль-Мауляд*","**Имам аль-Газали** — *«Самое важное, что родители могут дать ребёнку, — это хорошее воспитание, ибо характер ребёнка начинается с примера родителей.»* — *Ихья Улюм ад-Дин*"],"lessons":["Ваша главная ответственность — защитить детей от духовного вреда, а не только от физической опасности.","Обучение ребёнка хорошим манерам и религии засчитывается как непрерывная милостыня (садака джария).","Уделяйте детям время и присутствие, а не только обеспечение — Пророк ﷺ играл с детьми и открыто проявлял привязанность.","Регулярно делайте ду'а за своих детей; ду'а родителя за ребёнка — среди наиболее принимаемых.\n---"]},"kk":{"name":"Балалар","quran":[{"reference":"66:6","text":"«Ей, иман келтіргендер! Өздеріңізді және отбасыларыңызды от жалынынан қорғаңдар.»"},{"reference":"2:233","text":"«Аналар балаларын толық екі жыл емізеді — емізуді аяқтағысы келген адам үшін.»"},{"reference":"18:46","text":"«Мал мен ұрпақ — дүниелік өмірдің сәні. Ал мәңгілік жақсы амалдар — Раббыңның алдындағы сыйақысы жағынан да, үміт тұтынарлық жағынан да жақсы.»"}],"hadith":["*«Әрқайсыларыңыз бақташысыз және әрқайсыларыңыз өз қарамағындағылар үшін жауаптысыз... еркек — отбасындағы бақташы және өз қарамағындағылар үшін жауапты.»* — Сахих әл-Бухари 893, Сахих Муслим 1829 (**Сахих**)","*«Еркектің баласына жақсы мінез-құлықты үйретуі оның бір арба астық садақа беруінен жақсы.»* — Жами ат-Тирмизи 1951 (**Хасан**, ат-Тирмизи бойынша)"],"scholars":["**Ибн әл-Қаййим** — *«Бала — ата-ананың қолындағы аманат. Оның таза жүрегі — бағалы тас: жақсылыққа үйретілсе, соның үстінде өседі; қараусыз қалса — жойылады.»* — *Тухфат әл-Маулюд*","**Имам әл-Ғазали** — *«Ата-ана баласына бере алатын ең маңызды нәрсе — жақсы тәрбие, өйткені баланың мінез-құлқы ата-ананың үлгісінен басталады.»* — *Ихья Улюм ад-Дин*"],"lessons":["Сіздің негізгі жауапкершілігіңіз — балаларыңызды рухани зияннан қорғау, тек физикалық қауіптен емес.","Балаға жақсы мінез-құлық пен дінді үйрету жалғасымды садақа (садақа жария) ретінде есептеледі.","Балаларыңызға тек қамсыздандыру ғана емес, уақыт пен қатысуды беріңіз — Пайғамбар ﷺ балалармен ойнап, мейірімін ашық көрсетті.","Балаларыңыз үшін үнемі дұға жасаңыз; ата-ананың бала үшін дұғасы — ең қабылданатын дұғалардың бірі.\n---"]}}},{"id":"marriage","categoryId":"family","order":4,"translations":{"en":{"name":"Marriage","quran":[{"reference":"30:21","text":"\"And of His signs is that He created for you from yourselves mates that you may find tranquillity in them; and He placed between you affection and mercy.\""},{"reference":"2:187","text":"\"They are a garment for you and you are a garment for them.\""},{"reference":"4:19","text":"\"And live with them in kindness. For if you dislike them — perhaps you dislike a thing and Allah makes therein much good.\""}],"hadith":["*\"The best of you are those who are best to their wives, and I am the best of you to my wives.\"* — Jami' at-Tirmidhi 3895 (**Sahih**)","*\"When a man marries, he has fulfilled half of his religion. So let him fear Allah regarding the remaining half.\"* — Al-Bayhaqi, Shu'ab al-Iman (**Hasan** per Al-Albani)"],"scholars":["**Ibn al-Qayyim** — *\"Marriage is among the greatest blessings Allah bestows upon His servant, for through it he achieves comfort of heart, peace of soul, and cooperation in worship.\"* — *Zad al-Ma'ad*","**Imam Al-Ghazali** — *\"The purpose of marriage is not merely to satisfy desire but to build a household and raise children who will worship Allah.\"* — *Ihya' Ulum ad-Din*"],"lessons":["Build the marriage on the three pillars of Ar-Rum 30:21 — tranquillity (*sakinah*), affection (*mawaddah*), and mercy (*rahmah*).","Treat your spouse with the best of your character — the Prophet ﷺ made this the measure of a person's goodness.","In difficulty, persist with kindness (4:19) — hidden good may lie in what you dislike.","Guard your spouse's honour publicly and privately, as a garment covers and protects.\n---"]},"ru":{"name":"Никях (Брак)","quran":[{"reference":"30:21","text":"«Среди Его знамений — то, что Он создал для вас из вас самих супругов, чтобы вы находили покой у них, и установил между вами любовь и милосердие.»"},{"reference":"2:187","text":"«Они — одеяние для вас, а вы — одеяние для них.»"},{"reference":"4:19","text":"«Живите с ними достойно. Если же они вам неприятны, то ведь вам может быть неприятно то, в чём Аллах заложил много добра.»"}],"hadith":["*«Лучший из вас тот, кто лучше всего относится к своей жене, и я лучший из вас в отношении к своим жёнам.»* — Джами ат-Тирмизи 3895 (**Достоверный**)","*«Когда мужчина женится, он завершает половину своей религии. Пусть же он боится Аллаха в отношении другой половины.»* — аль-Байхаки, Шуаб аль-Иман (**Хороший** по аль-Альбани)"],"scholars":["**Ибн аль-Каййим** — *«Брак — среди величайших благ, которыми Аллах одаривает Своего раба, ибо через него он обретает покой сердца, умиротворение души и поддержку в поклонении.»* — *Зад аль-Маад*","**Имам аль-Газали** — *«Цель брака — не только удовлетворение желания, но и создание семьи и воспитание детей, которые будут поклоняться Аллаху.»* — *Ихья Улюм ад-Дин*"],"lessons":["Стройте брак на трёх основах из суры ар-Рум 30:21 — покое (*сакина*), любви (*мавадда*) и милосердии (*рахма*).","Обращайтесь с супругом с наилучшим характером — Пророк ﷺ сделал это мерилом добродетели человека.","В трудностях сохраняйте доброту (4:19) — в том, что вам не нравится, может быть скрытое благо.","Оберегайте честь супруга открыто и в тайне, как одежда покрывает и защищает.\n---"]},"kk":{"name":"Некелесу (Неке)","quran":[{"reference":"30:21","text":"«Оның аяттарының бірі — Ол сендер үшін өздеріңізден жұптар жаратты, солардың қасында тыныштық тапсын деп; арандарыңа сүйіспеншілік пен мейірімділік салды.»"},{"reference":"2:187","text":"«Олар сендер үшін киім, сендер олар үшін киімсіңдер.»"},{"reference":"4:19","text":"«Олармен жақсылықпен өмір сүріңдер. Егер олар сендерге жаман болып көрінсе — мүмкін Алла ол нәрседе мол игілік жасырып қойған шығар.»"}],"hadith":["*«Ең жақсыларыңыз — өз жұбайларына ең жақсы қарайтындарыңыз, ал мен жұбайларыма ең жақсы қараймын.»* — Жами ат-Тирмизи 3895 (**Сахих**)","*«Еркек үйленгенде, өзінің дінінің жартысын орындаған болады. Сонда Аллахтан қалған жартысы жөнінде сақтансын.»* — Байхаки, Шуаб әл-Иман (**Хасан**, әл-Албани бойынша)"],"scholars":["**Ибн әл-Қаййим** — *«Неке — Алланың Өз бандасына берген ең ұлы игіліктерінің бірі, өйткені арқылы ол жүрек тыныштығына, жан бейбітшілігіне және ғибадаттағы өзара қолдауға қол жеткізеді.»* — *Зад әл-Маад*","**Имам әл-Ғазали** — *«Некенің мақсаты тек шәуетті қанағаттандыру ғана емес, отбасы құру және Аллаға ғибадат ететін балаларды тәрбиелеу.»* — *Ихья Улюм ад-Дин*"],"lessons":["Некені ар-Рум 30:21 аятының үш ұстынына сүйіндіріңіз — тыныштық (*сакина*), сүйіспеншілік (*мауадда*) және мейірімділік (*рахма*).","Жұбайыңызға ең жақсы мінез-құлықпен қараңыз — Пайғамбар ﷺ мұны адамгершіліктің өлшемі деп атады.","Қиындықта жақсылықты сақтаңыз (4:19) — жаман көрінген нәрседе жасырын игілік болуы мүмкін.","Жұбайыңыздың намысын ашық та, жеке де сақтаңыз, киім жабып-қорғайтындай.\n---"]}}},{"id":"husband","categoryId":"family","order":5,"translations":{"en":{"name":"Husband","quran":[{"reference":"4:34","text":"\"Men are the caretakers of women, as men have been provisioned by Allah over women and tasked with supporting them financially.\""},{"reference":"2:228","text":"\"And due to the wives is similar to what is expected of them, according to what is reasonable. And men have a degree over them [in responsibility].\""},{"reference":"4:19","text":"\"And live with them in kindness.\""}],"hadith":["*\"The best of you are those who are best to their wives.\"* — Jami' at-Tirmidhi 3895, Sunan Ibn Majah 1977 (**Sahih**)","*\"Fear Allah concerning women, for you have taken them as a trust from Allah.\"* — Sahih Muslim 1218 (**Sahih**, from the Farewell Sermon)"],"scholars":["**Ibn al-Qayyim** — *\"The husband's right upon his wife is great, but so is his duty — he must provide for her, protect her, and lead the household toward Allah.\"* — *Zad al-Ma'ad*","**Umar ibn Al-Khattab** — *\"A man should be like a child with his family — but when they need him to be a man, he is a man.\"* — Widely attributed; original chain not confirmed."],"lessons":["Your obligation is to provide, protect, and lead with justice — not to dominate.","The Prophet ﷺ helped in the home and showed affection openly — this is the Sunnah.","Never belittle your wife; the Prophet ﷺ warned strongly against it in his final sermon.","Consult your wife in family matters; the Prophet ﷺ took counsel from his wives.\n---"]},"ru":{"name":"Муж","quran":[{"reference":"4:34","text":"«Мужчины являются попечителями женщин, потому что Аллах дал одним из них преимущество перед другими и потому что они расходуют из своего имущества.»"},{"reference":"2:228","text":"«Женщинам принадлежат права, аналогичные их обязанностям, согласно принятым нормам, хотя мужчины имеют над ними превосходство [в ответственности].»"},{"reference":"4:19","text":"«Живите с ними достойно.»"}],"hadith":["*«Лучший из вас тот, кто лучше всего относится к своей жене.»* — Джами ат-Тирмизи 3895, Сунан Ибн Маджа 1977 (**Достоверный**)","*«Бойтесь Аллаха в отношении женщин, ибо вы взяли их как доверие от Аллаха.»* — Сахих Муслим 1218 (**Достоверный**, из Прощальной проповеди)"],"scholars":["**Ибн аль-Каййим** — *«Право мужа над женой велико, но велик и его долг — он обязан обеспечивать её, защищать и вести семью к Аллаху.»* — *Зад аль-Маад*","**Умар ибн аль-Хаттаб** — *«Мужчина должен быть как ребёнок в кругу семьи, но когда они нуждаются в нём как в мужчине — он мужчина.»* — Широко приписывается; первоначальный источник не подтверждён."],"lessons":["Ваша обязанность — обеспечивать, защищать и справедливо руководить, а не доминировать.","Пророк ﷺ помогал по дому и открыто проявлял любовь — это Сунна.","Никогда не унижайте жену; Пророк ﷺ предостерёг от этого в своей последней проповеди.","Советуйтесь с женой в семейных делах; Пророк ﷺ советовался со своими жёнами.\n---"]},"kk":{"name":"Күйеу","quran":[{"reference":"4:34","text":"«Ерлер — әйелдердің қамқоршылары, өйткені Алла оларды бір-бірінен артық жаратты және олар мүліктерін жұмсайды.»"},{"reference":"2:228","text":"«Әйелдердің де дұрыс жолмен жасалуы тиісті міндеттері бар. Ал ерлердің олардан бір дәрежесі бар [жауапкершілікте].»"},{"reference":"4:19","text":"«Олармен жақсылықпен өмір сүріңдер.»"}],"hadith":["*«Ең жақсыларыңыз — өз жұбайларына ең жақсы қарайтындарыңыз.»* — Жами ат-Тирмизи 3895, Сунан Ибн Мажа 1977 (**Сахих**)","*«Алладан әйелдер жөнінде сақтаныңдар, өйткені сендер оларды Алладан аманат ретінде алдыңдар.»* — Сахих Муслим 1218 (**Сахих**, Қоштасу сөзінен)"],"scholars":["**Ибн әл-Қаййим** — *«Күйеудің жұбайы алдындағы міндеті де зор, оның дәрежесі де зор — ол оны қамтамасыз етіп, қорғап, отбасын Аллаға қарай бастауы тиіс.»* — *Зад әл-Маад*","**Омар ибн әл-Хаттаб** — *«Еркек отбасымен отырғанда бала сияқты болсын, ал олар оны еркек ретінде қажет еткенде — еркек болсын.»* — Кеңінен айтылады; бастапқы деректемесі расталмаған."],"lessons":["Сіздің міндетіңіз — қамтамасыз ету, қорғау және әділдікпен басшылық ету, билік жүргізу емес.","Пайғамбар ﷺ үйде жұмыс жасап, мейірімін ашық білдірді — бұл Сүннет.","Жұбайыңызды ешқашан кемсітпеңіз; Пайғамбар ﷺ мұны өзінің соңғы сөзінде қатаң ескертті.","Отбасылық мәселелерде жұбайыңызбен кеңесіңіз; Пайғамбар ﷺ өз жұбайларымен кеңесті.\n---"]}}},{"id":"wife","categoryId":"family","order":6,"translations":{"en":{"name":"Wife","quran":[{"reference":"30:21","text":"\"He created for you from yourselves mates that you may find tranquillity in them.\""},{"reference":"2:187","text":"\"They are a garment for you and you are a garment for them.\""},{"reference":"33:35","text":"\"Indeed, the Muslim men and Muslim women, the believing men and believing women... Allah has prepared for them forgiveness and a great reward.\""}],"hadith":["*\"The world is a provision, and the best provision of the world is a righteous wife.\"* — Sahih Muslim 1467 (**Sahih**)","*\"A believing man should not hate a believing woman. If he dislikes one of her traits, he will be pleased with another.\"* — Sahih Muslim 1469 (**Sahih**)"],"scholars":["**Imam Ash-Shafi'i** — *\"I have not seen anything that reforms a man's religion and worldly life together more than a righteous wife.\"* — Widely attributed in classical literature.","**Ibn Taymiyyah** — *\"Among the greatest means of attaining a good life is a righteous spouse who helps you in your religion and your worldly affairs.\"* — *Majmu' al-Fatawa*"],"lessons":["A righteous wife is the greatest worldly blessing — recognise and express gratitude for it.","Fulfil her rights actively: financial provision, emotional care, respect.","Protect her honour in her absence — never expose her faults to others.","As a wife, your greatest strength is your character and your taqwa — not status or appearance.\n---"]},"ru":{"name":"Жена","quran":[{"reference":"30:21","text":"«Он создал для вас из вас самих супругов, чтобы вы находили покой у них.»"},{"reference":"2:187","text":"«Они — одеяние для вас, а вы — одеяние для них.»"},{"reference":"33:35","text":"«Поистине, мусульманам и мусульманкам, верующим мужчинам и верующим женщинам... Аллах приготовил прощение и великую награду.»"}],"hadith":["*«Мир — это временное пользование, и лучшее из его благ — праведная жена.»* — Сахих Муслим 1467 (**Достоверный**)","*«Верующий мужчина не должен ненавидеть верующую женщину: если одна её черта ему не нравится, другая доставит ему удовольствие.»* — Сахих Муслим 1469 (**Достоверный**)"],"scholars":["**Имам аш-Шафии** — *«Я не видел ничего, что одновременно исправляет и религию, и мирские дела мужчины лучше, чем праведная жена.»* — Широко приписывается в классической литературе.","**Ибн Таймийя** — *«Среди величайших средств обретения хорошей жизни — праведная супруга, которая помогает тебе в твоей религии и мирских делах.»* — *Маджму аль-Фатава*"],"lessons":["Праведная жена — величайшее мирское благо: признавайте это и выражайте благодарность.","Активно исполняйте её права: материальное обеспечение, эмоциональная забота, уважение.","Оберегайте её честь в её отсутствие — никогда не раскрывайте её недостатки другим.","Как жена, ваша наибольшая сила — в вашем характере и такуа, а не в статусе или внешности.\n---"]},"kk":{"name":"Зайып","quran":[{"reference":"30:21","text":"«Ол сендер үшін өздеріңізден жұптар жаратты, солардың қасында тыныштық тапсын деп.»"},{"reference":"2:187","text":"«Олар сендер үшін киім, сендер олар үшін киімсіңдер.»"},{"reference":"33:35","text":"«Расында, мұсылман ерлер мен мұсылман әйелдер, мүмін ерлер мен мүмін әйелдер... Алла олар үшін кешірім мен ұлы сыйақы дайындады.»"}],"hadith":["*«Дүние — пайдалану мүмкіндігі, ал дүниедегі ең жақсы пайдалану мүмкіндігі — ізгі жұбай.»* — Сахих Муслим 1467 (**Сахих**)","*«Мүмін еркек мүмін әйелді жек көрмесін. Егер оның бір мінезі оған ұнамаса, басқасы ұнататын шығар.»* — Сахих Муслим 1469 (**Сахих**)"],"scholars":["**Имам әш-Шафии** — *«Мен ізгі жұбайдан да артық еркектің де дінін, де дүниелік істерін бірге жөнге салатын нәрсені көрген жоқпын.»* — Классикалық әдебиетте кеңінен айтылады.","**Ибн Таймийя** — *«Жақсы өмір сүрудің ең ұлы құралдарының бірі — дініңде де, дүниелік істеріңде де саған көмектесетін ізгі жұбай.»* — *Мажму әл-Фатауа*"],"lessons":["Ізгі зайып — ең ұлы дүниелік игілік: мұны мойындап, оған шүкірлік білдіріңіз.","Оның құқықтарын белсенді орындаңыз: материалдық қамтамасыз ету, эмоциялық қамқорлық, құрмет.","Оның намысын жоқта сақтаңыз — оның кемшіліктерін басқаларға ешқашан ашпаңыз.","Зайып ретінде, сіздің ең үлкен күшіңіз — сіздің мінез-құлқыңыз бен тақуалығыңыз, мәртебе немесе сыртқы келбет емес.\n---"]}}},{"id":"family-relations","categoryId":"family","order":7,"translations":{"en":{"name":"Family Relations","quran":[{"reference":"4:1","text":"\"O mankind, fear your Lord, who created you from one soul and created from it its mate and dispersed from both of them many men and women. And fear Allah, through whom you ask one another, and the wombs. Indeed Allah is ever, over you, an Observer.\""},{"reference":"13:21","text":"\"And those who join what Allah has ordered to be joined and fear their Lord and are afraid of the evil of [their] account.\""},{"reference":"47:22","text":"\"So would you perhaps, if you turned away, cause corruption on earth and sever your [ties of] relationship?\""}],"hadith":["*\"Whoever believes in Allah and the Last Day, let him maintain the ties of kinship.\"* — Sahih al-Bukhari 6138 (**Sahih**)","*\"The one who maintains family ties is not the one who reciprocates; rather, the one who maintains ties is the one who, when his relatives cut him off, he joins them.\"* — Sahih al-Bukhari 5991 (**Sahih**)"],"scholars":["**Ibn Taymiyyah** — *\"Maintaining family ties is obligatory, and severing them is among the major sins.\"* — *Majmu' al-Fatawa*","**Hasan al-Basri** — *\"Visit your relatives even if only with a greeting, for silah ar-rahim (maintaining kinship ties) extends your lifespan and increases your provision.\"* — Widely attributed."],"lessons":["Silah ar-rahim is obligatory — cutting family ties is a major sin in Islam.","The stronger form of kinship is to reconnect even when others have cut you off.","Regular visits, calls, or even messages to relatives count as acts of worship.","Expect no reciprocity — your duty is to maintain the tie, regardless of how others behave.\n-e \n---"]},"ru":{"name":"Родственные связи","quran":[{"reference":"4:1","text":"«О люди! Бойтесь вашего Господа, Который сотворил вас из одного существа, создал из него пару ему и расселил из них обоих множество мужчин и женщин. Бойтесь Аллаха, именем Которого вы просите друг друга, и бойтесь разрывать родственные связи.»"},{"reference":"13:21","text":"«Те, которые поддерживают то, что Аллах велел поддерживать, и боятся своего Господа и страшатся ужасного расчёта.»"},{"reference":"47:22","text":"«Быть может, если вы станете неверными, то распространите нечестие на земле и порвёте родственные связи?»"}],"hadith":["*«Кто верует в Аллаха и в Последний день, тот пусть поддерживает родственные связи.»* — Сахих аль-Бухари 6138 (**Достоверный**)","*«Поддерживающий родственные связи — не тот, кто отвечает взаимностью; поддерживающий — тот, кто, когда его родственники рвут с ним связь, восстанавливает её.»* — Сахих аль-Бухари 5991 (**Достоверный**)"],"scholars":["**Ибн Таймийя** — *«Поддержание родственных связей обязательно, а разрыв их — среди тяжких грехов.»* — *Маджму аль-Фатава*","**Хасан аль-Басри** — *«Навещайте своих родственников, даже если лишь с приветствием, ибо силят ар-рахим продлевает жизнь и увеличивает удел.»* — Широко приписывается."],"lessons":["Силят ар-рахим обязательна — разрыв родственных связей является тяжким грехом в Исламе.","Более высокая форма родства — восстанавливать связь, даже когда другие её разрывают.","Регулярные визиты, звонки или даже сообщения родственникам засчитываются как поклонение.","Не ожидайте взаимности — ваша обязанность поддерживать связь независимо от поведения других."]},"kk":{"name":"Туыстық байланыстар","quran":[{"reference":"4:1","text":"«Ей, адамдар! Бір жаннан жаратқан Раббыларыңнан қорқыңдар... Алладан қорқыңдар, кім арқылы бір-бірлеріңнен тілейсіңдер, және туыстық байланыстардан [сақтаныңдар].»"},{"reference":"13:21","text":"«Алланың байланыстырылуын бұйырғанын байланыстырып, Раббыларынан қорқып, есептің жаманынан шошитындар.»"},{"reference":"47:22","text":"«Егер сендер [исламнан] бет бұрсаңыздар, жерде бүлік шығарып, туыстық байланыстарыңды үзуіңіз ғажап па?»"}],"hadith":["*«Аллаға және Ақырет күніне иман келтірген адам туыстық байланысты сақтасын.»* — Сахих әл-Бухари 6138 (**Сахих**)","*«Туыстық байланысты сақтаушы — жауап қайтарушы емес; туыстық байланысты сақтаушы — туыстары одан бет бұрғанда, ол оларға барушы.»* — Сахих әл-Бухари 5991 (**Сахих**)"],"scholars":["**Ибн Таймийя** — *«Туыстық байланысты сақтау — парыз, ал оны үзу — үлкен күнәлардың бірі.»* — *Мажму әл-Фатауа*","**Хасан әл-Басри** — *«Туыстарыңызды тіпті амандасу ғана болса да барып тұрыңыз, өйткені силат ар-рахим өмірді ұзартады және ризықты молайтады.»* — Кеңінен айтылады."],"lessons":["Силат ар-рахим — парыз: туыстық байланысты үзу Исламда үлкен күнә.","Туыстықтың күшті формасы — басқалар бет бұрса да байланысты қайта орнату.","Туыстарға үнемі бару, қоңырау шалу немесе хабарласу ғибадат ретінде саналады.","Жауап алуды күтпеңіз — міндетіңіз — басқалардың мінез-құлқына қарамастан байланысты сақтау."]}}},{"id":"friendship","categoryId":"relationships","order":8,"translations":{"en":{"name":"Friendship","quran":[{"reference":"43:67","text":"\"Close friends, that Day, will be enemies to each other, except for the righteous.\""},{"reference":"18:28","text":"\"And keep yourself patient [by being] with those who call upon their Lord in the morning and the evening, seeking His countenance.\""},{"reference":"9:119","text":"\"O you who have believed, fear Allah and be with the truthful.\""}],"hadith":["*\"A man follows the religion of his close friend; so each one of you should consider whom he makes his friend.\"* — Sunan Abu Dawood 4833, Jami' at-Tirmidhi 2378 (**Hasan**)","*\"The likeness of a good companion and a bad companion is like the musk seller and the blacksmith's bellows — from one you gain fragrance, from the other only harm.\"* — Sahih al-Bukhari 5534, Sahih Muslim 2628 (**Sahih**)"],"scholars":["**Ibn al-Qayyim** — *\"Do not befriend one who weakens your resolve in worship, delays you from the remembrance of Allah, or inclines your heart toward the world.\"* — *Al-Fawa'id*","**Imam Al-Ghazali** — *\"True brotherhood means sharing wealth, person, tongue, heart — grieving at your brother's grief and rejoicing at his joy.\"* — *Ihya' Ulum ad-Din*"],"lessons":["Choose friends who increase your remembrance of Allah — this is a Quranic command (18:28).","Friendships not built on righteousness will become regrets on the Day of Judgement (43:67).","Be the musk seller — bring benefit, not harm, to everyone you befriend.","A true friend speaks truth, even when it is difficult.\n---"]},"ru":{"name":"Дружба","quran":[{"reference":"43:67","text":"«В тот День близкие друзья станут врагами друг другу, кроме богобоязненных.»"},{"reference":"18:28","text":"«Удерживай себя вместе с теми, кто взывает к своему Господу по утрам и вечерам, стремясь к Его лику.»"},{"reference":"9:119","text":"«О те, кто уверовал! Бойтесь Аллаха и будьте вместе с правдивыми.»"}],"hadith":["*«Человек следует религии своего близкого друга, поэтому каждый из вас должен смотреть, с кем он дружит.»* — Сунан Абу Дауд 4833, Джами ат-Тирмизи 2378 (**Хороший**)","*«Пример хорошего друга и плохого друга подобен торговцу мускусом и кузнецу с мехами: у первого ты либо купишь аромат, либо ощутишь его запах; кузнец же либо прожжёт твою одежду, либо ты почувствуешь зловоние.»* — Сахих аль-Бухари 5534, Сахих Муслим 2628 (**Достоверный**)"],"scholars":["**Ибн аль-Каййим** — *«Не дружи с тем, кто ослабляет твою решимость в поклонении, отдаляет тебя от поминания Аллаха или склоняет твоё сердце к мирскому.»* — *аль-Фаваид*","**Имам аль-Газали** — *«Истинное братство означает: разделять имущество, присутствие, язык и сердце — скорбеть о скорби брата и радоваться его радости.»* — *Ихья Улюм ад-Дин*"],"lessons":["Выбирайте друзей, которые увеличивают ваше поминание Аллаха — это коранический приказ (18:28).","Дружба, не основанная на праведности, станет сожалением в Судный день (43:67).","Будьте торговцем мускусом — приносите пользу, а не вред всем, с кем дружите.","Настоящий друг говорит правду, даже когда это трудно.\n---"]},"kk":{"name":"Достық","quran":[{"reference":"43:67","text":"«Сол күні жақын достар бір-біріне жау болады, тақуалардан басқа.»"},{"reference":"18:28","text":"«Таңертең және кешке Раббыларының жүзін іздеп, Оған жалынушылармен бірге сабырлы бол.»"},{"reference":"9:119","text":"«Ей, иман келтіргендер! Алладан қорқыңдар және шыншылдармен бірге болыңдар.»"}],"hadith":["*«Адам өзінің жақын досының дінімен болады, сондықтан кім мен дос болатынына ойланып қарасын.»* — Сунан Әбу Дауд 4833, Жами ат-Тирмизи 2378 (**Хасан**)","*«Жақсы дос пен жаман досқа ұқсату — мускус сатушы мен темір ұстасының мехіне ұқсату: біреуінен хош иіс аласың немесе сезесің; екіншісі киіміңді өртейді немесе жаман иіс аласың.»* — Сахих әл-Бухари 5534, Сахих Муслим 2628 (**Сахих**)"],"scholars":["**Ибн әл-Қаййим** — *«Сенің ғибадаттағы бекімділігіңді әлсірететін, Алланы еске алудан алшақтататын немесе жүрегіңді дүниеге бейімдейтін адаммен дос болма.»* — *Әл-Фауаид*","**Имам әл-Ғазали** — *«Шын бауырластық дегеніміз — мүлікті, адамды, тілді және жүректі бөлісу: ағаңның қайғысына қайғырып, қуанышына қуану.»* — *Ихья Улюм ад-Дин*"],"lessons":["Алланы еске алуыңызды арттыратын достарды таңдаңыз — бұл Құрандағы бұйрық (18:28).","Тақуалыққа негізделмеген достық Қияметте өкінішке айналады (43:67).","Мускус сатушы болыңыз — дос болған адамдарыңызға пайда әкеліңіз, зиян емес.","Шын дос — ауыр болса да шындықты айтады.\n---"]}}},{"id":"neighbors","categoryId":"relationships","order":9,"translations":{"en":{"name":"Neighbors","quran":[{"reference":"4:36","text":"\"Worship Allah... and do good to... the near neighbour, the neighbour farther away, the companion at your side, the traveller.\""},{"reference":"2:177","text":"\"Righteousness is... to give wealth, in spite of love for it, to... the needy, the traveller, those who ask [for help].\""}],"hadith":["*\"Jibril kept advising me to treat the neighbour well until I thought he would make him an heir.\"* — Sahih al-Bukhari 6014, Sahih Muslim 2625 (**Sahih**)","*\"He is not a believer whose stomach is full while his neighbour goes hungry.\"* — Al-Adab al-Mufrad 112 (**Sahih** per Al-Albani)"],"scholars":["**Ibn Hajar al-Asqalani** — *\"The repeated emphasis of Jibril on the neighbour's right shows it is among the weightiest of social obligations in Islam.\"* — *Fath al-Bari*","**Hasan al-Basri** — *\"Good neighbourliness is not merely refraining from harm — it is bearing the harm of your neighbour with patience.\"* — Widely attributed."],"lessons":["The Prophet ﷺ said the right of the neighbour was emphasised so often he thought inheritance would be established — take it seriously.","It is a sin to sleep full while your neighbour is hungry.","Good neighbourliness means actively helping, not just avoiding harm.","Your nearest neighbours have the greatest right on you.\n---"]},"ru":{"name":"Соседи","quran":[{"reference":"4:36","text":"«Поклоняйтесь Аллаху... и делайте добро... ближнему соседу и дальнему соседу, другу рядом с вами, путнику.»"},{"reference":"2:177","text":"«Праведность состоит в том, чтобы... из любви к Нему расходовать имущество на родственников, сирот, нуждающихся, путников и просящих.»"}],"hadith":["*«Джибриль продолжал заповедовать мне хорошее отношение к соседу, пока я не подумал, что он сделает его наследником.»* — Сахих аль-Бухари 6014, Сахих Муслим 2625 (**Достоверный**)","*«Не верует тот, чей желудок полон, тогда как его сосед голоден.»* — аль-Адаб аль-Муфрад 112 (**Достоверный** по аль-Альбани)"],"scholars":["**Ибн Хаджар аль-Аскаляни** — *«Многократное подчёркивание Джибрилем права соседа указывает на то, что оно является одним из важнейших социальных обязательств в Исламе.»* — *Фатх аль-Бари*","**Хасан аль-Басри** — *«Хорошее соседство — это не только воздержание от вреда, но и терпеливое перенесение вреда от соседа.»* — Широко приписывается."],"lessons":["Право соседа настолько подчёркивалось Пророком ﷺ, что он подумал, будет ли установлено наследование — относитесь к этому серьёзно.","Спать сытым, когда сосед голоден — грех.","Хорошее соседство означает активную помощь, а не просто отсутствие вреда.","Ближайшие соседи имеют наибольшее право на вас.\n---"]},"kk":{"name":"Көршілер","quran":[{"reference":"4:36","text":"«Аллаға ғибадат етіңдер... жақын көршіге де, алыс көршіге де жақсылық жасаңдар.»"},{"reference":"2:177","text":"«Ізгілік — Оған деген махаббатпен мүліктерін туыстарға, жетімдерге, кедейлерге, жолаушыларға беру.»"}],"hadith":["*«Жәбірейіл маған көршіні жақсы қарауды соншалықты ұсынды, тіпті оны мұрагер етер деп ойладым.»* — Сахих әл-Бухари 6014, Сахих Муслим 2625 (**Сахих**)","*«Қарны тоқ жатып, көршісі аш болса, сол адам мүмін емес.»* — Әл-Адаб әл-Муфрад 112 (**Сахих**, әл-Албани бойынша)"],"scholars":["**Ибн Хажар әл-Асқалани** — *«Жәбірейілдің көрші құқығын қайта-қайта атап өтуі оның Исламдағы ең маңызды әлеуметтік міндеттемелердің бірі екенін көрсетеді.»* — *Фатх әл-Бари*","**Хасан әл-Басри** — *«Жақсы көршілік — зиян тигізбеу ғана емес, сонымен бірге көршіден зиян көрсе де сабырмен төзу.»* — Кеңінен айтылады."],"lessons":["Пайғамбар ﷺ оны мұрагер ете ме деп ойлайтын дәрежеде көрші құқығы ерекшеленді — мұны маңызды деп қараңыз.","Көршісі аш болып, өзі тоқ ұйықтау — күнә.","Жақсы көршілік — белсенді көмек, тек зиян тигізбеу ғана емес.","Ең жақын көршілердің сізге ең үлкен құқығы бар.\n---"]}}},{"id":"respect","categoryId":"relationships","order":10,"translations":{"en":{"name":"Respect","quran":[{"reference":"49:11","text":"\"O you who have believed, let not a people ridicule [another] people; perhaps they may be better than them. Nor let women ridicule [other] women; perhaps they may be better than them. And do not insult one another.\""},{"reference":"17:70","text":"\"And We have certainly honoured the children of Adam.\""},{"reference":"49:13","text":"\"Indeed, the most noble of you in the sight of Allah is the most righteous of you.\""}],"hadith":["*\"Whoever believes in Allah and the Last Day, let him speak good or remain silent.\"* — Sahih al-Bukhari 6018, Sahih Muslim 47 (**Sahih**)","*\"The Muslim is the one from whose tongue and hand the people are safe.\"* — Sahih al-Bukhari 10, Sahih Muslim 41 (**Sahih**)"],"scholars":["**Ali ibn Abi Talib** — *\"Respect others and you will be respected. Do not belittle anyone, for you do not know his standing before Allah.\"* — Widely attributed.","**Imam An-Nawawi** — *\"Among the rights of every Muslim upon another is that he be protected from harm of the tongue, hand, and heart.\"* — *Riyadh as-Salihin*, introduction."],"lessons":["Allah has honoured every human being (17:70) — disrespecting a person contradicts a Quranic principle.","Respectful speech is an Islamic obligation; mockery and insults are explicitly forbidden (49:11).","The safest and most respected person is one whose tongue and hands never harm others.","True nobility is in taqwa — respect people for their character, not their status.\n---"]},"ru":{"name":"Уважение","quran":[{"reference":"49:11","text":"«О те, кто уверовал! Пусть одни люди не насмехаются над другими, ведь те могут быть лучше них. И пусть одни женщины не насмехаются над другими. Не оскорбляйте друг друга.»"},{"reference":"17:70","text":"«Мы почтили сынов Адама.»"},{"reference":"49:13","text":"«Воистину, наиболее почитаемый перед Аллахом среди вас — наиболее богобоязненный из вас.»"}],"hadith":["*«Кто верует в Аллаха и в Последний день, пусть говорит благое или молчит.»* — Сахих аль-Бухари 6018, Сахих Муслим 47 (**Достоверный**)","*«Мусульманин — тот, от языка и руки которого в безопасности другие мусульмане.»* — Сахих аль-Бухари 10, Сахих Муслим 41 (**Достоверный**)"],"scholars":["**Али ибн Аби Талиб** — *«Уважай других — и тебя будут уважать. Не унижай никого, ибо ты не знаешь его положения пред Аллахом.»* — Широко приписывается.","**Имам ан-Навави** — *«Среди прав каждого мусульманина перед другим — защита от вреда языком, рукой и сердцем.»* — *Рияд ас-Салихин*, введение."],"lessons":["Аллах почтил каждого человека (17:70) — неуважение к нему противоречит кораническому принципу.","Уважительная речь — исламская обязанность; насмешки и оскорбления прямо запрещены (49:11).","Самый безопасный и уважаемый человек — тот, чьи язык и руки не причиняют вреда другим.","Истинное благородство — в такуа: уважайте людей за их характер, а не за статус.\n---"]},"kk":{"name":"Құрмет","quran":[{"reference":"49:11","text":"«Ей, иман келтіргендер! Бір топ адамдар екінші топ адамдарды келеке етпесін — олар одан жақсы болуы мүмкін... бір-біріңді сөзбен ренжітпеңдер.»"},{"reference":"17:70","text":"«Біз Адам ұрпағын ілтипатқа бөледік.»"},{"reference":"49:13","text":"«Расында, Алланың алдындағы ең сыйлыларыңыз — ең тақуаларыңыз.»"}],"hadith":["*«Аллаға және Ақырет күніне иман келтірген адам жақсы сөйлесін немесе үндемесін.»* — Сахих әл-Бухари 6018, Сахих Муслим 47 (**Сахих**)","*«Мұсылман — тілі мен қолынан басқа мұсылмандар аман болатын адам.»* — Сахих әл-Бухари 10, Сахих Муслим 41 (**Сахих**)"],"scholars":["**Али ибн Әби Талиб** — *«Басқаларды сыйла — сені де сыйлайды. Ешкімді кемсітпе, өйткені оның Алла алдындағы мәртебесін білмейсің.»* — Кеңінен айтылады.","**Имам ән-Науауи** — *«Әрбір мұсылманның екіншісіне деген құқықтарының бірі — тіл, қол және жүрек зиянынан қорғалу.»* — *Рияд ас-Салихин*, кіріспе."],"lessons":["Алла әрбір адамды ілтипатқа бөлді (17:70) — оны кемсіту Құрандық ұстанымға қайшы келеді.","Сыйластықпен сөйлеу — Исламдық міндет; мазақ ету және сөзбен ренжіту тікелей тыйым салынған (49:11).","Ең қауіпсіз және ең сыйлы адам — тілі мен қолы басқаларға зиян тигізбейтін адам.","Шын мәртебе — тақуалықта: адамдарды мәртебесі үшін емес, мінез-құлқы үшін сыйлаңыз.\n---"]}}},{"id":"kindness","categoryId":"relationships","order":11,"translations":{"en":{"name":"Kindness","quran":[{"reference":"41:34","text":"\"And not equal are the good deed and the bad. Repel [evil] by that [deed] which is better; and thereupon the one whom between you and him is enmity [will become] as though he was a devoted friend.\""},{"reference":"16:90","text":"\"Indeed, Allah orders justice and good conduct (*ihsan*) and giving to relatives.\""},{"reference":"3:134","text":"\"Who spend [in the cause of Allah] during ease and hardship and who restrain anger and who pardon the people — and Allah loves the doers of good.\""}],"hadith":["*\"Allah is kind and loves kindness, and He gives for kindness what He does not give for harshness.\"* — Sahih al-Bukhari 6927, Sahih Muslim 2593 (**Sahih**)","*\"Kindness is not found in anything without adorning it, and it is not removed from anything without disfiguring it.\"* — Sahih Muslim 2594 (**Sahih**)"],"scholars":["**Imam Al-Ghazali** — *\"Kindness is the outward expression of mercy in the heart. Where mercy is real, kindness flows naturally.\"* — *Ihya' Ulum ad-Din*","**Ali ibn Abi Talib** — *\"Be kind to people as Allah has been kind to you.\"* — Widely attributed."],"lessons":["Kindness adds beauty to every action and its absence corrupts even good deeds.","Responding to hostility with kindness can transform enemies into close friends (41:34).","Allah gives through kindness what He withholds from those who use harshness.","Kindness is not weakness — the Prophet ﷺ was the kindest person who ever lived.\n---"]},"ru":{"name":"Доброта","quran":[{"reference":"41:34","text":"«Не равны доброе дело и злое. Оттолкни [зло] тем, что лучше, и тогда тот, с кем у тебя была вражда, станет словно близкий друг.»"},{"reference":"16:90","text":"«Воистину, Аллах повелевает справедливостью, добродеянием (*ихсан*) и щедростью к родственникам.»"},{"reference":"3:134","text":"«Тех, кто расходует [на пути Аллаха] в радости и в горе, сдерживает гнев и прощает людям — ведь Аллах любит творящих добро.»"}],"hadith":["*«Аллах добр и любит доброту, и дарует за доброту то, чего не даёт за грубость.»* — Сахих аль-Бухари 6927, Сахих Муслим 2593 (**Достоверный**)","*«Доброта не присутствует ни в чём, не украшая его, и не убирается ни из чего, не обезображивая его.»* — Сахих Муслим 2594 (**Достоверный**)"],"scholars":["**Имам аль-Газали** — *«Доброта — это внешнее выражение милосердия в сердце. Там, где милосердие подлинно, доброта течёт естественно.»* — *Ихья Улюм ад-Дин*","**Али ибн Аби Талиб** — *«Будь добр к людям, как Аллах был добр к тебе.»* — Широко приписывается."],"lessons":["Доброта украшает каждое действие, а её отсутствие портит даже добрые дела.","Ответ на враждебность добротой способен превратить врагов в близких друзей (41:34).","Аллах даёт через доброту то, что удерживает от тех, кто использует грубость.","Доброта — не слабость: Пророк ﷺ был добрейшим из людей, когда-либо живших.\n---"]},"kk":{"name":"Мейірімділік","quran":[{"reference":"41:34","text":"«Жақсылық пен жамандық тең емес. Жамандықты жақсылықпен дер кет; сонда арандарыңда дұшпандық болған адам жақын досқа айналады.»"},{"reference":"16:90","text":"«Расында, Алла әділдікті, жақсылық жасауды (*ихсан*) және туыстарға беруді бұйырады.»"},{"reference":"3:134","text":"«Тіршілікте де, аурушаңдықта да жұмсайтындар, ашуын тежейтіндер және адамдарды кешіретіндер — Алла ізгілік жасаушыларды сүйеді.»"}],"hadith":["*«Алла мейірімді және мейірімділікті сүйеді, мейірімділік үшін қаталдық үшін бермейтінін береді.»* — Сахих әл-Бухари 6927, Сахих Муслим 2593 (**Сахих**)","*«Мейірімділік ешнәрседе болмайды, тек оны сәндейді; ешнәрседен алынбайды, тек оны бұзады.»* — Сахих Муслим 2594 (**Сахих**)"],"scholars":["**Имам әл-Ғазали** — *«Мейірімділік — жүректегі рақымның сыртқы көрінісі. Рақым шынайы болған жерде мейірімділік өздігінен ағады.»* — *Ихья Улюм ад-Дин*","**Али ибн Әби Талиб** — *«Алла саған мейірімді болғандай, адамдарға мейірімді бол.»* — Кеңінен айтылады."],"lessons":["Мейірімділік кез келген іс-әрекетті сәндейді, ал оның болмауы жақсы іс-әрекеттерді де бұзады.","Дұшпандыққа мейірімділікпен жауап беру жауларды жақын досқа айналдыра алады (41:34).","Алла мейірімділік арқылы қаталдықпен бермейтінін береді.","Мейірімділік — әлсіздік емес: Пайғамбар ﷺ өмір сүрген адамдардың ең мейірімдісі болды.\n---"]}}},{"id":"forgiveness","categoryId":"relationships","order":12,"translations":{"en":{"name":"Forgiveness","quran":[{"reference":"3:134","text":"\"Those who... pardon the people — and Allah loves the doers of good.\""},{"reference":"42:40","text":"\"And the retribution for an evil act is one like it, but whoever pardons and makes reconciliation — his reward is [due] from Allah.\""},{"reference":"24:22","text":"\"Let them pardon and overlook. Would you not like that Allah should forgive you? And Allah is Forgiving and Merciful.\""}],"hadith":["*\"Allah does not increase a servant in pardoning others except in honour.\"* — Sahih Muslim 2588 (**Sahih**)","*\"The strong man is not the one who can wrestle others down. The strong man is the one who controls himself in anger.\"* — Sahih al-Bukhari 6114, Sahih Muslim 2609 (**Sahih**)"],"scholars":["**Umar ibn Al-Khattab** — *\"Hold yourself accountable before you are held accountable, and pardon others before you need pardon yourself.\"* — Widely attributed.","**Ibn al-Qayyim** — *\"Forgiving one who wronged you brings a peace to the heart that revenge can never bring.\"* — *Madarij as-Salikin*"],"lessons":["Forgiving others does not diminish you — Allah promises it increases your honour (Sahih Muslim 2588).","Pardoning and reconciling earns a direct reward from Allah (42:40).","Ask yourself: *Would you not like Allah to forgive you?* (24:22) — use this as your motivation to forgive.","Forgiveness is for your own peace as much as for the other person.\n---"]},"ru":{"name":"Прощение","quran":[{"reference":"3:134","text":"«Тех, кто... сдерживает гнев и прощает людям — ведь Аллах любит творящих добро.»"},{"reference":"42:40","text":"«Воздаяние за зло — зло, подобное ему. Но тот, кто простит и установит мир, получит награду от Аллаха.»"},{"reference":"24:22","text":"«Пусть они простят и забудут. Разве вы не хотите, чтобы Аллах простил вас? Аллах — Прощающий, Милосердный.»"}],"hadith":["*«Аллах увеличивает раба только в почёте за прощение [других].»* — Сахих Муслим 2588 (**Достоверный**)","*«Сильный — не тот, кто побеждает в борьбе. Сильный — тот, кто владеет собой во время гнева.»* — Сахих аль-Бухари 6114, Сахих Муслим 2609 (**Достоверный**)"],"scholars":["**Умар ибн аль-Хаттаб** — *«Призывай себя к ответу прежде, чем тебя призовут, и прощай других прежде, чем тебе самому понадобится прощение.»* — Широко приписывается.","**Ибн аль-Каййим** — *«Прощение того, кто обидел тебя, даёт покой сердцу, которого никогда не принесёт месть.»* — *Мадаридж ас-Саликин*"],"lessons":["Прощение других не унижает тебя — Аллах обещает, что оно увеличивает твой почёт (Сахих Муслим 2588).","Прощение и примирение приносят прямую награду от Аллаха (42:40).","Спросите себя: *«Разве вы не хотите, чтобы Аллах простил вас?»* (24:22) — используйте это как мотивацию для прощения.","Прощение — для вашего же душевного покоя, а не только для другого человека.\n---"]},"kk":{"name":"Кешірімділік","quran":[{"reference":"3:134","text":"«Ашуын тежейтіндер және адамдарды кешіретіндер — Алла ізгілік жасаушыларды сүйеді.»"},{"reference":"42:40","text":"«Жамандықтың жазасы соған ұқсас жамандық. Бірақ кім кешірсе және татуластырса, оның сыйақысы Алла тарапынан.»"},{"reference":"24:22","text":"«Кешірсін және өтеп жіберсін. Алланың сендерді кешіруін қаламайсыңдар ма? Алла — Жарылқаушы, Мейірімді.»"}],"hadith":["*«Алла бандасын кешіру үшін тек құрметте арттырады.»* — Сахих Муслим 2588 (**Сахих**)","*«Күшті — күрес жеңетін адам емес. Күшті — ашу кезінде өзін меңгеретін адам.»* — Сахих әл-Бухари 6114, Сахих Муслим 2609 (**Сахих**)"],"scholars":["**Омар ибн әл-Хаттаб** — *«Өзіңді есепке тартпас бұрын есепке тарт, және басқаларға кешірім керек болмас бұрын кешір.»* — Кеңінен айтылады.","**Ибн әл-Қаййим** — *«Сізді ренжіткен адамды кешіру жүрекке кек алу ешқашан бере алмайтын тыныштық береді.»* — *Мадаридж әс-Саликин*"],"lessons":["Басқаларды кешіру сізді кемітпейді — Алла оның құрметіңізді арттыратынын уәде береді (Сахих Муслим 2588).","Кешіру және татуластыру Алладан тікелей сыйақы алып келеді (42:40).","Өзіңізден сұраңыз: *«Алланың сізді кешіруін қаламайсыз ба?»* (24:22) — мұны кешіруге деген мотивация ретінде пайдаланыңыз.","Кешіру — сіздің өз тыныштығыңыз үшін де, басқа адам үшін де.\n---"]}}},{"id":"honesty","categoryId":"relationships","order":13,"translations":{"en":{"name":"Honesty","quran":[{"reference":"9:119","text":"\"O you who have believed, fear Allah and be with the truthful.\""},{"reference":"33:70–71","text":"\"O you who have believed, fear Allah and speak words of appropriate justice. He will [then] amend for you your deeds and forgive you your sins.\""},{"reference":"3:17","text":"\"[The righteous are] the patient, the true, the obedient, those who spend [in the way of Allah], and those who seek forgiveness before dawn.\""}],"hadith":["*\"Truthfulness leads to righteousness, and righteousness leads to Paradise... Lying leads to wickedness, and wickedness leads to the Fire.\"* — Sahih al-Bukhari 6094, Sahih Muslim 2607 (**Sahih**)","*\"It is obligatory upon you to be truthful, for truthfulness leads to goodness, and goodness leads to Paradise.\"* — Sahih Muslim 2607 (**Sahih**)"],"scholars":["**Abu Bakr as-Siddiq** — *\"Adhere to truthfulness, for it accompanies all good.\"* — Widely attributed; Abu Bakr was titled *as-Siddiq* (the Truthful) for his lifelong commitment to honesty.","**Ibn al-Qayyim** — *\"Truthfulness is the foundation of all virtues. All character strengths are built on it; when it falls, they all fall.\"* — *Madarij as-Salikin*"],"lessons":["Habitual honesty builds a path to Paradise; habitual lying builds a path to the Fire — the Prophet ﷺ stated this directly.","Honest speech reforms your deeds and earns forgiveness (33:70–71).","Be truthful even when it costs you — that is when truthfulness has its greatest value.","Never deceive in business, relationships, or social life — the consequences reach the hereafter.\n---"]},"ru":{"name":"Честность","quran":[{"reference":"9:119","text":"«О те, кто уверовал! Бойтесь Аллаха и будьте вместе с правдивыми.»"},{"reference":"33:70–71","text":"«О те, кто уверовал! Бойтесь Аллаха и говорите правое слово. Тогда Он исправит ваши дела и простит вам ваши грехи.»"},{"reference":"3:17","text":"«[Праведники] — терпеливые, правдивые, покорные, расходующие и просящие прощения на заре.»"}],"hadith":["*«Правдивость ведёт к праведности, а праведность ведёт в Рай... Ложь ведёт к греховности, а греховность ведёт в Огонь.»* — Сахих аль-Бухари 6094, Сахих Муслим 2607 (**Достоверный**)","*«Вам надлежит быть правдивыми, ибо правдивость ведёт к добру, а добро ведёт в Рай.»* — Сахих Муслим 2607 (**Достоверный**)"],"scholars":["**Абу Бакр ас-Сиддик** — *«Придерживайтесь правдивости, ибо она сопровождает всё благое.»* — Широко приписывается; Абу Бакр был прозван *ас-Сиддик* (Правдивый) за свою приверженность честности.","**Ибн аль-Каййим** — *«Правдивость — основа всех добродетелей. Все достоинства характера строятся на ней; когда она рушится — рушится всё.»* — *Мадаридж ас-Саликин*"],"lessons":["Привычная честность строит путь в Рай; привычная ложь строит путь в Огонь — Пророк ﷺ сказал это прямо.","Честная речь исправляет ваши дела и приносит прощение (33:70–71).","Будьте правдивы, даже если это вам дорого стоит — именно тогда правдивость обретает наибольшую ценность.","Никогда не обманывайте в торговле, отношениях или общественной жизни — последствия достигают вечности.\n---"]},"kk":{"name":"Адалдық","quran":[{"reference":"9:119","text":"«Ей, иман келтіргендер! Алладан қорқыңдар және шыншылдармен бірге болыңдар.»"},{"reference":"33:70–71","text":"«Ей, иман келтіргендер! Алладан қорқыңдар және дұрыс сөз айтыңдар. Сонда Ол сендерге амалдарыңды түзетеді және күнәларыңды кешіреді.»"},{"reference":"3:17","text":"«[Тақуалар] — сабырлылар, шыншылдар, мойынсынушылар, жұмсаушылар және таң алдында кешірім сұраушылар.»"}],"hadith":["*«Шыншылдық ізгілікке апарады, ал ізгілік жұмаққа апарады... Өтірік күнәға апарады, ал күнә тозаққа апарады.»* — Сахих әл-Бухари 6094, Сахих Муслим 2607 (**Сахих**)","*«Шыншыл болуды ұстаныңдар, өйткені шыншылдық жақсылыққа апарады, ал жақсылық жұмаққа апарады.»* — Сахих Муслим 2607 (**Сахих**)"],"scholars":["**Әбу Бәкір ас-Сиддиқ** — *«Шыншылдықты ұстаныңдар, өйткені ол барлық жақсылықпен бірге жүреді.»* — Кеңінен айтылады; Әбу Бәкірге *ас-Сиддиқ* (Шыншыл) деген лақап ат берілді.","**Ибн әл-Қаййим** — *«Шыншылдық — барлық ізгіліктердің негізі. Барлық мінез-құлық күштері соның үстінде құрылады; ол құласа — бәрі құлайды.»* — *Мадаридж әс-Саликин*"],"lessons":["Үйреншікті адалдық жұмаққа жол салады; үйреншікті өтірік тозаққа жол салады — Пайғамбар ﷺ мұны тікелей айтты.","Адал сөз амалдарыңызды түзетіп, кешірім алып келеді (33:70–71).","Тіпті оған қымбатқа түссе де шыншыл болыңыз — дәл сол кезде шыншылдық ең үлкен мәнге ие болады.","Сауда-саттықта, қарым-қатынаста немесе қоғамдық өмірде ешқашан алдамаңыз — салдары ақыретке дейін жетеді.\n---"]}}},{"id":"trust","categoryId":"relationships","order":14,"translations":{"en":{"name":"Trust","quran":[{"reference":"8:27","text":"\"O you who have believed, do not betray Allah and the Messenger or betray your trusts while you know [what you do].\""},{"reference":"4:58","text":"\"Indeed, Allah commands you to render trusts to whom they are due and when you judge between people to judge with justice.\""},{"reference":"23:8","text":"\"And they who are to their trusts and their promises attentive.\"* (Among the characteristics of successful believers)"}],"hadith":["*\"There is no faith in one who has no trustworthiness (*amanah*), and there is no religion in one who does not keep his promises.\"* — Musnad Ahmad 12567 (**Hasan** per Al-Albani)","*\"The signs of a hypocrite are three: when he speaks, he lies; when he promises, he breaks it; when he is entrusted, he betrays.\"* — Sahih al-Bukhari 33, Sahih Muslim 59 (**Sahih**)"],"scholars":["**Imam Al-Ghazali** — *\"Amanah is the foundation of society. When it is lost, no relationship — business, personal, or political — can remain sound.\"* — *Ihya' Ulum ad-Din*","**Umar ibn Al-Khattab** — *\"Hold firm to amanah, for it is the pillar of all dealings between people.\"* — Widely attributed."],"lessons":["Amanah (trustworthiness) is a defining quality of a true believer — its absence is a sign of hypocrisy.","Return every trust: a secret shared, money held, a position given — discharge it fully.","Render trusts to their rightful owners even if they wronged you — it is Allah's command (4:58).","Build a reputation for trustworthiness — it is worth more than any worldly asset.\n-e \n---"]},"ru":{"name":"Доверие (Аманат)","quran":[{"reference":"8:27","text":"«О те, кто уверовал! Не предавайте Аллаха и Посланника и не предавайте ваших доверенных обязательств, зная об этом.»"},{"reference":"4:58","text":"«Воистину, Аллах повелевает вам возвращать вверенное на хранение его владельцам и судить по справедливости.»"},{"reference":"23:8","text":"«Которые соблюдают вверенное им на хранение и соблюдают договоры.»* (Среди качеств успешных верующих)"}],"hadith":["*«Нет веры у того, у кого нет надёжности (*аманат*), и нет религии у того, кто не соблюдает обещаний.»* — Муснад Ахмад 12567 (**Хороший** по аль-Альбани)","*«Признаки лицемера три: когда говорит — лжёт, когда обещает — нарушает, когда ему доверяют — предаёт.»* — Сахих аль-Бухари 33, Сахих Муслим 59 (**Достоверный**)"],"scholars":["**Имам аль-Газали** — *«Аманат — основа общества. Когда он утрачивается, ни одно отношение — деловое, личное или политическое — не может оставаться здоровым.»* — *Ихья Улюм ад-Дин*","**Умар ибн аль-Хаттаб** — *«Держитесь аманата, ибо он — столп всех отношений между людьми.»* — Широко приписывается."],"lessons":["Аманат (надёжность) — определяющее качество истинного верующего; его отсутствие является признаком лицемерия.","Возвращайте каждый аманат: доверенный секрет, деньги, должность — исполняйте его полностью.","Возвращайте аманат его законным владельцам, даже если они поступили с вами несправедливо — это повеление Аллаха (4:58).","Стройте репутацию надёжного человека — она ценнее любого мирского имущества."]},"kk":{"name":"Сенімділік (Аманат)","quran":[{"reference":"8:27","text":"«Ей, иман келтіргендер! Аллаға да, Елшіге де және өздеріңізге тапсырылған аманатқа да білген күйінде қиянат жасамаңдар.»"},{"reference":"4:58","text":"«Расында, Алла сендерге аманатты иелеріне қайтаруды бұйырады.»"},{"reference":"23:8","text":"«Аманаттарын және уәделерін сақтайтындар.»* (Нәтижеге жеткен мүміндердің белгілері)"}],"hadith":["*«Аманаты жоқ адамның иманы жоқ, ал уәдесін орындамайтын адамның діні жоқ.»* — Муснад Ахмад 12567 (**Хасан**, әл-Албани бойынша)","*«Мұнафықтың үш белгісі бар: сөйлесе — өтірік айтады, уәде берсе — орындамайды, аманат берілсе — қиянат ж
