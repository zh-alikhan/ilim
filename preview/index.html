ndeed, Allah will accomplish His purpose.\""},{"reference":"3:159","text":"\"And when you have decided, then rely upon Allah. Indeed, Allah loves those who rely [upon Him].\""},{"reference":"14:12","text":"\"And why should we not rely upon Allah while He has guided us to our [good] ways.\""}],"hadith":["*\"If you were to rely upon Allah with true reliance, He would provide for you as He provides for the birds — they go out in the morning empty and return in the evening full.\"* — Jami' at-Tirmidhi 2344 (**Hasan** per At-Tirmidhi)","*\"Tie your camel, then put your trust in Allah.\"* — Jami' at-Tirmidhi 2517 (**Hasan**)"],"scholars":["**Ibn al-Qayyim** — *\"Tawakkul is not abandoning effort — it is the heart's certainty that the outcome belongs to Allah alone while the limbs do their part.\"* — *Madarij as-Salikin*","**Imam Al-Ghazali** — *\"The sign of true tawakkul is the tranquillity of the heart in all circumstances — not the absence of effort, but the absence of anxiety about the result.\"* — *Ihya' Ulum ad-Din*"],"lessons":["Tawakkul requires action first — tie your camel, then trust Allah. Passivity is not tawakkul.","True reliance on Allah is rewarded with provision the way birds are provided for — going out empty and returning full.","Tawakkul eliminates anxiety about outcomes — you do your part and surrender the rest.","After making a decision, commit to tawakkul fully (3:159) — second-guessing collapses trust.\n---"]},"ru":{"name":"Таваккуль","quran":[{"reference":"65:3","text":"«А тот, кто уповает на Аллаха, для того Он достаточен. Воистину, Аллах завершает Своё дело.»"},{"reference":"3:159","text":"«Когда ты принял решение, уповай на Аллаха. Воистину, Аллах любит уповающих.»"},{"reference":"14:12","text":"«Почему бы нам не уповать на Аллаха, когда Он вывел нас на наши пути?»"}],"hadith":["*«Если бы вы уповали на Аллаха должным образом, Он даровал бы вам удел, как дарует его птицам: они вылетают утром голодными и возвращаются вечером сытыми.»* — Джами ат-Тирмизи 2344 (**Хороший** по ат-Тирмизи)","*«Привяжи своего верблюда, затем уповай на Аллаха.»* — Джами ат-Тирмизи 2517 (**Хороший**)"],"scholars":["**Ибн аль-Каййим** — *«Таваккуль — это не отказ от действия: это уверенность сердца в том, что результат принадлежит только Аллаху, тогда как конечности делают своё дело.»* — *Мадаридж ас-Саликин*","**Имам аль-Газали** — *«Признак истинного таваккуля — спокойствие сердца во всех обстоятельствах: не отсутствие усилий, а отсутствие тревоги о результате.»* — *Ихья Улюм ад-Дин*"],"lessons":["Таваккуль требует действия прежде всего: привяжи верблюда, затем уповай на Аллаха. Бездействие — не таваккуль.","Истинное упование на Аллаха вознаграждается уделом так же, как птицы получают удел: вылетают пустыми и возвращаются сытыми.","Таваккуль устраняет тревогу о результатах: вы делаете своё дело и вверяете остальное [Аллаху].","Приняв решение, полностью вверьтесь таваккулю (3:159) — сомнения разрушают доверие.\n---"]},"kk":{"name":"Тавакккул","quran":[{"reference":"65:3","text":"«Аллаға тавакккул еткен адамға Ол жетеді. Расында, Алла ісін аяқтайды.»"},{"reference":"3:159","text":"«Бекіндің соң, Аллаға тавакккул ет. Расында, Алла тавакккул жасаушыларды сүйеді.»"},{"reference":"14:12","text":"«Алла бізді жолдарымызға шығарған кезде, неге Аллаға тавакккул жасамаймыз?»"}],"hadith":["*«Аллаға шынымен тавакккул жасасаңдар, Ол сендерді құстарды азықтандыратындай азықтандырады: олар таңертең аш шығып, кешке тоқ оралады.»* — Жами ат-Тирмизи 2344 (**Хасан**, ат-Тирмизи бойынша)","*«Түйеңді байла, сонан соң Аллаға тавакккул жаса.»* — Жами ат-Тирмизи 2517 (**Хасан**)"],"scholars":["**Ибн әл-Қаййим** — *«Тавакккул — іс-әрекеттен бас тарту емес: бұл нәтиже тек Аллаға тиесілі екеніне жүректің сенімі, ал мүшелер өз ісін жасайды.»* — *Мадаридж әс-Саликин*","**Имам әл-Ғазали** — *«Шынайы тавакккулдің белгісі — кез келген жағдайда жүректің тыныштығы: күш-жігердің болмауы емес, нәтиже туралы уайымның болмауы.»* — *Ихья Улюм ад-Дин*"],"lessons":["Тавакккул алдымен іс-әрекетті талап етеді: түйеңді байла, содан кейін Аллаға тавакккул жаса. Бәсеңдік — тавакккул емес.","Шынайы тавакккул ризықпен сыйақыланады, құстар ризықпен сыйақыланатындай — аш шығып, тоқ оралады.","Тавакккул нәтижелер туралы уайымды жояды: өз ісіңізді жасап, қалғанын [Аллаға] тапсырасыз.","Шешім қабылдаған соң, тавакккулға толық тапсырыңыз (3:159) — күмән сенімді бұзады.\n---"]}}},{"id":"sincerity","categoryId":"spirituality","order":51,"translations":{"en":{"name":"Sincerity","quran":[{"reference":"98:5","text":"\"And they were not commanded except to worship Allah, [being] sincere to Him in religion, inclining to truth.\""},{"reference":"39:11","text":"\"Say: Indeed, I have been commanded to worship Allah, [being] sincere to Him in religion.\""},{"reference":"18:110","text":"\"So whoever would hope for the meeting with his Lord — let him do righteous work and not associate in the worship of his Lord anyone.\""}],"hadith":["*\"Actions are [judged] by intentions, and every person will have what he intended.\"* — Sahih al-Bukhari 1, Sahih Muslim 1907 (**Sahih**)","*\"Allah does not look at your appearance or your wealth, but He looks at your hearts and your deeds.\"* — Sahih Muslim 2564 (**Sahih**)"],"scholars":["**Imam Al-Ghazali** — *\"Sincerity is to direct every act solely toward Allah. If even a trace of desire for praise, status, or worldly gain enters, the act is corrupted.\"* — *Ihya' Ulum ad-Din*","**Ibn Rajab al-Hanbali** — *\"The entire religion rests on the hadith of intentions. If the intention is right, the deed is right. If the intention is corrupt, the deed is corrupt.\"* — *Jami' al-Ulum wal-Hikam*"],"lessons":["Every deed begins with its intention — the same action has different spiritual weights based on *niyyah* (intention).","Allah looks at hearts, not appearances — sincerity is an internal matter that no one can perform for show.","Check your intention before every significant act: *\"Am I doing this for Allah, or for something else?\"*","Renew your intention regularly; sincere beginnings can drift without conscious renewal.\n---"]},"ru":{"name":"Искренность (Ихлас)","quran":[{"reference":"98:5","text":"«А ведь им было велено лишь поклоняться Аллаху, искренне исповедуя перед Ним религию.»"},{"reference":"39:11","text":"«Скажи: \"Мне велено поклоняться Аллаху, очищая перед Ним веру\".»"},{"reference":"18:110","text":"«Тот, кто надеется на встречу со своим Господом, пусть совершает праведные деяния и не приобщает никого в сотоварищи к поклонению своему Господу\".»"}],"hadith":["*«Поистине, дела оцениваются по намерениям, и каждому человеку достанется лишь то, что он намеревался [совершить].»* — Сахих аль-Бухари 1, Сахих Муслим 1907 (**Достоверный**)","*«Аллах не смотрит на ваш облик и ваше имущество, но смотрит на ваши сердца и ваши дела.»* — Сахих Муслим 2564 (**Достоверный**)"],"scholars":["**Имам аль-Газали** — *«Ихлас — направить каждый поступок исключительно к Аллаху. Если даже след желания похвалы, статуса или мирской выгоды входит в него, деяние порочится.»* — *Ихья Улюм ад-Дин*","**Ибн Раджаб аль-Ханбали** — *«Вся религия покоится на хадисе о намерениях. Если намерение правильное — деяние правильное. Если намерение испорчено — деяние испорчено.»* — *Джами аль-Улюм валь-Хикам*"],"lessons":["Каждое деяние начинается с намерения: одно и то же действие имеет разный духовный вес в зависимости от *ниийя* (намерения).","Аллах смотрит на сердца, а не на внешность: ихлас — внутреннее дело, которое нельзя показывать напоказ.","Проверяйте своё намерение перед каждым значимым поступком: *«Я делаю это ради Аллаха или ради чего-то другого?»*","Регулярно обновляйте намерение; искренние начинания могут поколебаться без сознательного обновления.\n---"]},"kk":{"name":"Ихлас (Шынайылық)","quran":[{"reference":"98:5","text":"«Оларға тек Аллаға дінді оған арнай ғибадат етулері ғана бұйырылды.»"},{"reference":"39:11","text":"«Айт: \"Маған дінді Аллаға арнай ғибадат ету бұйырылды\".»"},{"reference":"18:110","text":"«Раббымен кездесуіне үміттенген адам жақсы амал жасасын және ешкімді Раббына ғибадатта серік қоспасын.»"}],"hadith":["*«Расында, амалдар ниетпен бағаланады, және әрбір адамға өзінің ниеті бойынша тиесілі.»* — Сахих әл-Бухари 1, Сахих Муслим 1907 (**Сахих**)","*«Алла сіздердің сырт келбетіңізге де, байлықтарыңызға да қарамайды, бірақ жүректеріңізге және амалдарыңызға қарайды.»* — Сахих Муслим 2564 (**Сахих**)"],"scholars":["**Имам әл-Ғазали** — *«Ихлас — әрбір іс-әрекетті тек Аллаға бағыттау. Егер мақтауға, мәртебеге немесе дүниелік пайдаға деген ізді жылтырату кірсе, амал бұзылады.»* — *Ихья Улюм ад-Дин*","**Ибн Ражаб әл-Ханбали** — *«Бүкіл дін ниет туралы хадиске сүйенеді. Ниет дұрыс болса — амал дұрыс. Ниет бұзық болса — амал бұзық.»* — *Жами әл-Улюм уәл-Хикам*"],"lessons":["Әрбір амал өз ниетінен басталады: бір іс-әрекет *ниийяға* байланысты әртүрлі рухани салмаққа ие болады.","Алла жүректерге қарайды, сыртқы келбетке емес — ихлас ешкімге көрсете алмайтын ішкі мәселе.","Маңызды іс-әрекеттің алдында ниетіңізді тексеріңіз: *«Мен бұны Алла үшін жасаймын ба, жоқ па?»*","Ниетті үнемі жаңартыңыз; шынайы бастамалар саналы жаңартусыз ауытқуы мүмкін.\n---"]}}},{"id":"repentance","categoryId":"spirituality","order":52,"translations":{"en":{"name":"Repentance","quran":[{"reference":"39:53","text":"\"Say: O My servants who have transgressed against themselves, do not despair of the mercy of Allah. Indeed, Allah forgives all sins.\""},{"reference":"66:8","text":"\"O you who have believed, repent to Allah with sincere repentance. Perhaps your Lord will remove from you your misdeeds.\""},{"reference":"4:110","text":"\"And whoever does a wrong or wrongs himself but then seeks forgiveness of Allah will find Allah Forgiving and Merciful.\""}],"hadith":["*\"Every son of Adam sins, and the best of those who sin are those who repent.\"* — Jami' at-Tirmidhi 2499, Sunan Ibn Majah 4251 (**Hasan** per At-Tirmidhi)","*\"Allah is more delighted by the repentance of His servant than one of you would be who finds his lost camel in the desert.\"* — Sahih al-Bukhari 6309, Sahih Muslim 2747 (**Sahih**)"],"scholars":["**Ibn al-Qayyim** — *\"True repentance (*tawbah*) requires: regret in the heart, cessation of the sin, and firm resolve not to return. If it involves the rights of people, those rights must be restored.\"* — *Madarij as-Salikin*","**Hasan al-Basri** — *\"Do not let shame prevent you from repentance — for the shame of sin is less than the shame of standing before Allah without having repented.\"* — Widely attributed."],"lessons":["No sin is too great for Allah's forgiveness — despair itself is the sin to avoid (39:53).","The best sinners are those who repent — sinlessness is not the standard; return is.","True tawbah has three conditions: stop the sin, regret it genuinely, resolve not to return.","Repent immediately after sin — do not delay, as the door of repentance is open in life.\n---"]},"ru":{"name":"Тауба (Покаяние)","quran":[{"reference":"39:53","text":"«Скажи: \"О Мои рабы, которые преступили меры против самих себя! Не отчаивайтесь в милости Аллаха. Воистину, Аллах прощает грехи полностью\".»"},{"reference":"66:8","text":"«О те, кто уверовал! Кайтесь перед Аллахом искренним покаянием. Быть может, ваш Господь простит вам ваши злодеяния.»"},{"reference":"4:110","text":"«Если кто совершит злодеяние или же причинит вред самому себе, а затем попросит у Аллаха прощения, то он найдёт Аллаха Прощающим, Милосердным.»"}],"hadith":["*«Каждый сын Адама грешит, и лучший из грешников — кающиеся.»* — Джами ат-Тирмизи 2499, Сунан Ибн Маджа 4251 (**Хороший** по ат-Тирмизи)","*«Аллах радуется покаянию Своего раба больше, чем тот из вас, кто нашёл своего потерявшегося верблюда в пустыне.»* — Сахих аль-Бухари 6309, Сахих Муслим 2747 (**Достоверный**)"],"scholars":["**Ибн аль-Каййим** — *«Истинное покаяние (*тауба*) требует: сожаления в сердце, прекращения греха и твёрдого намерения не возвращаться к нему. Если оно касается прав людей, то эти права должны быть восстановлены.»* — *Мадаридж ас-Саликин*","**Хасан аль-Басри** — *«Не позволяй стыду мешать покаянию — ибо стыд от греха меньше, чем стыд предстать пред Аллахом без покаяния.»* — Широко приписывается."],"lessons":["Ни один грех не слишком велик для прощения Аллаха — само отчаяние является грехом, которого следует избегать (39:53).","Лучшие грешники — кающиеся: безгрешность — не стандарт; возвращение — вот что важно.","Истинная тауба имеет три условия: прекратить грех, искренне сожалеть о нём, твёрдо намереться не возвращаться.","Кайтесь немедленно после греха — не откладывайте: дверь покаяния открыта при жизни.\n---"]},"kk":{"name":"Тауба","quran":[{"reference":"39:53","text":"«Айт: \"Ей, Менің өзіне қарсы шектен шыққан бандаларым! Алланың рахметінен үмітсіз болмаңдар. Расында, Алла күнәлардың барлығын кешіреді\".»"},{"reference":"66:8","text":"«Ей, иман келтіргендер! Аллаға шынайы тауба жасаңдар.»"},{"reference":"4:110","text":"«Кім жамандық жасаса немесе өзіне зұлымдық жасаса, содан кейін Алладан кешірім сұраса, Алланы Жарылқаушы, Мейірімді деп табады.»"}],"hadith":["*«Адам баласы күнә жасайды, ал күнәкәрлардың ең жақсысы — тауба жасаушылар.»* — Жами ат-Тирмизи 2499, Сунан Ибн Мажа 4251 (**Хасан**, ат-Тирмизи бойынша)","*«Алла бандасының таубасынан сендердің бірі шөлде жоғалтқан түйесін тапқаннан да қатты қуанады.»* — Сахих әл-Бухари 6309, Сахих Муслим 2747 (**Сахих**)"],"scholars":["**Ибн әл-Қаййим** — *«Шынайы тауба үш нәрсені талап етеді: жүректегі өкіну, күнәны тоқтату және оған қайтпауға берік ниет. Егер ол адамдардың құқықтарына қатысты болса, сол құқықтар қайтарылуы тиіс.»* — *Мадаридж әс-Саликин*","**Хасан әл-Басри** — *«Ұяттан таубаға кедергі болмасын — өйткені күнәнің ұяты таубасыз Алла алдында тұрудың ұятынан кіші.»* — Кеңінен айтылады."],"lessons":["Алланың кешіруіне мүмкін болатын күнә жоқ — үмітсіздіктің өзі аулақ жүруге тиісті күнәна (39:53).","Ең жақсы күнәкәрлар — тауба жасаушылар: күнәсіздік — стандарт емес; оралу — маңыздысы.","Шынайы таубаның үш шарты: күнәны тоқтату, шынайы өкіну, оған қайтпауға берік болу.","Күнәдан кейін дереу тауба жасаңыз — кешіктірмеңіз: тауба есігі өмірде ашық.\n---"]}}},{"id":"dua","categoryId":"spirituality","order":53,"translations":{"en":{"name":"Dua","quran":[{"reference":"2:186","text":"\"And when My servants ask you concerning Me — indeed I am near. I respond to the invocation of the supplicant when he calls upon Me.\""},{"reference":"40:60","text":"\"And your Lord says: 'Call upon Me; I will respond to you.'\""},{"reference":"7:55","text":"\"Call upon your Lord in humility and privately; indeed, He does not like transgressors.\""}],"hadith":["*\"Du'a is worship.\"* — Jami' at-Tirmidhi 2969, Sunan Abu Dawood 1479 (**Sahih**)","*\"The du'a of the Muslim for his brother in his absence is answered. At his head is an angel; every time he prays for his brother, the angel says: Ameen, and may you have the same.\"* — Sahih Muslim 2733 (**Sahih**)"],"scholars":["**Ibn al-Qayyim** — *\"Du'a is the most noble act of worship. It shows the servant's need and Allah's generosity. A servant who does not ask of Allah insults Allah's generosity.\"* — *Al-Wabil as-Sayyib*","**Imam Al-Ghazali** — *\"Du'a should be made with humility, certainty of Allah's response, and presence of heart. A distracted du'a is like a letter sent without an address.\"* — *Ihya' Ulum ad-Din*"],"lessons":["Du'a is worship itself (Tirmidhi 2969) — every supplication is an act of devotion, regardless of whether it is answered immediately.","Allah is near and responds (2:186) — make du'a with certainty, not doubt.","Make du'a for others in their absence — an angel says *\"Ameen, and may you have the same\"* for every du'a you make for a brother or sister.","Use the best times: last third of the night, between adhan and iqamah, in sujud, on Fridays.\n---"]},"ru":{"name":"Ду'а","quran":[{"reference":"2:186","text":"«Если Мои рабы спросят тебя обо Мне, то ведь Я близок и отвечаю на зов молящегося, когда он обращается ко Мне с мольбой.»"},{"reference":"40:60","text":"«Ваш Господь сказал: \"Взывайте ко Мне, и Я отвечу вам\".»"},{"reference":"7:55","text":"«Взывайте к вашему Господу со смирением и в тайне. Воистину, Он не любит преступающих границы.»"}],"hadith":["*«Ду'а — это поклонение.»* — Джами ат-Тирмизи 2969, Сунан Абу Дауд 1479 (**Достоверный**)","*«Ду'а мусульманина за своего брата в его отсутствие принимается. Рядом с ним ангел, и каждый раз, когда он молится за своего брата, ангел говорит: \"Амин, и тебе того же\".»* — Сахих Муслим 2733 (**Достоверный**)"],"scholars":["**Ибн аль-Каййим** — *«Ду'а — благороднейший вид поклонения. Оно показывает нужду раба и щедрость Аллаха. Раб, который не просит Аллаха, оскорбляет Его щедрость.»* — *аль-Вабиль ас-Саййиб*","**Имам аль-Газали** — *«Ду'а должно совершаться со смирением, с уверенностью в ответе Аллаха и с присутствием сердца. Рассеянное ду'а — как письмо без адреса.»* — *Ихья Улюм ад-Дин*"],"lessons":["Ду'а само по себе является поклонением (Тирмизи 2969) — каждое обращение — акт преданности, независимо от того, принято ли оно немедленно.","Аллах близко и отвечает (2:186) — обращайтесь с уверенностью, а не с сомнением.","Делайте ду'а за других в их отсутствие — ангел говорит *«Амин, и тебе того же»* за каждое ду'а, которое вы делаете за брата или сестру.","Используйте лучшее время: последняя треть ночи, между азаном и икаматом, в земном поклоне, по пятницам.\n---"]},"kk":{"name":"Дұға","quran":[{"reference":"2:186","text":"«Бандаларым Мені туралы сұраса, расында Мен жақынмын, жалынушы Маған жалынғанда Оның жалынуына жауап беремін.»"},{"reference":"40:60","text":"«Раббыларың айтты: \"Маған жалыныңдар, Мен сендерге жауап беремін\".»"},{"reference":"7:55","text":"«Жалынушылық пен жасыринілікте Раббыларыңа жалыныңдар. Расында, Ол шегінен шыққандарды сүймейді.»"}],"hadith":["*«Дұға — ғибадат.»* — Жами ат-Тирмизи 2969, Сунан Әбу Дауд 1479 (**Сахих**)","*«Мұсылманның жоқта өз бауыры үшін дұғасы қабылданады. Оның басында бір периште бар; ол бауыры үшін дұға жасаған сайын, периште: \"Амин, саған да сондай\" дейді.»* — Сахих Муслим 2733 (**Сахих**)"],"scholars":["**Ибн әл-Қаййим** — *«Дұға — ғибадаттың ең асылы. Ол банданың қажеттілігі мен Алланың мейіріміндегін көрсетеді. Алладан сұрамайтын банда Оның мейіріміне нұқсан келтіреді.»* — *Әл-Уабиль әс-Саййиб*","**Имам әл-Ғазали** — *«Дұға — кішіпейілдікпен, Алланың жауабына сенімді болып және жүрек хузурымен жасалуы тиіс. Алаңдаған дұға — адресссіз хат сияқты.»* — *Ихья Улюм ад-Дин*"],"lessons":["Дұғаның өзі ғибадат (Тирмизи 2969) — әрбір тілек — дереу қабылданбаса да, қызмет актісі.","Алла жақын және жауап береді (2:186) — сенімнің күмәнсізімен жалыныңыз.","Жоқта басқалар үшін дұға жасаңыз — ағаңыз немесе қарындасыңыз үшін жасаған әрбір дұғаға периште «Амин, саған да сондай» дейді.","Ең жақсы уақытты пайдаланыңыз: түннің соңғы үштен бірі, азан мен иқамат арасы, сәждеде, жұма күні.\n---"]}}},{"id":"dhikr","categoryId":"spirituality","order":54,"translations":{"en":{"name":"Dhikr","quran":[{"reference":"13:28","text":"\"Verily, in the remembrance of Allah do hearts find rest.\""},{"reference":"33:41","text":"\"O you who have believed, remember Allah with much remembrance.\""},{"reference":"2:152","text":"\"So remember Me; I will remember you.\""}],"hadith":["*\"The best of words after the Quran are four — and it does not matter with which you begin: Subhanallah, Alhamdulillah, La ilaha illa Allah, Allahu Akbar.\"* — Sahih Muslim 2137 (**Sahih**)","*\"Should I not tell you the best of your deeds, the most pleasing to your King, the highest in your ranks, and better for you than spending gold and silver? Better even than meeting your enemy in battle?\" They said: \"Yes.\" He said: \"The remembrance of Allah.\"* — Jami' at-Tirmidhi 3377, Sunan Ibn Majah 3790 (**Sahih** per Al-Albani)"],"scholars":["**Ibn al-Qayyim** — *\"Dhikr is the food of the heart. When the heart goes without dhikr, it weakens as the body weakens without food — until it dies.\"* — *Al-Wabil as-Sayyib*","**Imam Al-Ghazali** — *\"The consistent remembrance of Allah is the mark of the true servant. It transforms every moment — walking, eating, working — into worship.\"* — *Ihya' Ulum ad-Din*"],"lessons":["Dhikr is the Quranic remedy for a restless heart — prescribe it to yourself daily (13:28).","The four best phrases after the Quran: *Subhanallah, Alhamdulillah, La ilaha illa Allah, Allahu Akbar* — use them throughout your day.","Morning and evening *adhkar* (remembrance formulas) are prophetically established protection and worship — do not neglect them.","Make your tongue moist with dhikr at all times — it costs nothing and earns more than gold in charity.\n---"]},"ru":{"name":"Зикр","quran":[{"reference":"13:28","text":"«Воистину, поминанием Аллаха успокаиваются сердца.»"},{"reference":"33:41","text":"«О те, кто уверовал! Поминайте Аллаха многократно.»"},{"reference":"2:152","text":"«Поминайте Меня, и Я буду помнить вас.»"}],"hadith":["*«Лучшие слова после Корана — четыре, и не важно, с чего начать: СубхМнАллах, АльхМндулиллях, Ля иляха илляллах, Аллаху Акбар.»* — Сахих Муслим 2137 (**Достоверный**)","*«Не указать ли вам на наилучшее из ваших дел, наиболее угодное вашему Царю, наивысшее из ваших степеней, лучшее, чем расходование золота и серебра, и лучшее, чем встреча с врагом в сражении?\" Они сказали: \"Да\". Он сказал: \"Поминание Аллаха\".»* — Джами ат-Тирмизи 3377, Сунан Ибн Маджа 3790 (**Достоверный** по аль-Альбани)"],"scholars":["**Ибн аль-Каййим** — *«Зикр — пища сердца. Когда сердце лишается зикра, оно слабеет, как тело слабеет без пищи — пока не умирает.»* — *аль-Вабиль ас-Саййиб*","**Имам аль-Газали** — *«Постоянное поминание Аллаха — признак истинного раба. Оно превращает каждый момент — ходьбу, еду, работу — в поклонение.»* — *Ихья Улюм ад-Дин*"],"lessons":["Зикр — коранское лекарство для беспокойного сердца: прописывайте его себе ежедневно (13:28).","Четыре лучших фразы после Корана: *Субхан Аллах, Альхамдулиллях, Ля иляха илляллах, Аллаху Акбар* — используйте их на протяжении дня.","Утренние и вечерние *азкары* (формулы поминания) пророчески установлены как защита и поклонение — не пренебрегайте ими.","Держите язык влажным от зикра постоянно — это ничего не стоит и приносит больше, чем золото в садака.\n---"]},"kk":{"name":"Зікір","quran":[{"reference":"13:28","text":"«Расында, жүректер Алланы еске алғанда тыныштық табады.»"},{"reference":"33:41","text":"«Ей, иман келтіргендер! Алланы көп еске алыңдар.»"},{"reference":"2:152","text":"«Мені еске алыңдар, Мен де сендерді еске аламын.»"}],"hadith":["*«Құраннан кейінгі ең жақсы сөздер — төртеу және қайсысымен бастасаңыз да маңызы жоқ: Субханалла, Алхамдулилла, Ла иляhа илляллаh, Аллаhу Акбар.»* — Сахих Муслим 2137 (**Сахих**)","*«Амалдарыңыздың ең жақсысын, Патшаңыздың алдындағы ең сүйіктісін, дәрежелеріңіздегі ең биігін, алтын мен күміс жұмсаудан жақсысын, тіпті жауменен шайқастан да жақсысын айта ма? \"Иә\" деді. \"Алланы еске алу\" деді.»* — Жами ат-Тирмизи 3377, Сунан Ибн Мажа 3790 (**Сахих**, әл-Албани бойынша)"],"scholars":["**Ибн әл-Қаййим** — *«Зікір — жүректің тамағы. Зікірсіз жүрек тамақсыз дене сияқты әлсірейді — тіпті өлгенге дейін.»* — *Әл-Уабиль әс-Саййиб*","**Имам әл-Ғазали** — *«Алланы үнемі еске алу — шынайы бандасының белгісі. Ол әрбір сәтті — жүруді, жеуді, жұмыс жасауды — ғибадатқа айналдырады.»* — *Ихья Улюм ад-Дин*"],"lessons":["Зікір — мазасыз жүрекке Құраннан тағайындалған дәрі: оны өзіңізге күнделікті тағайындаңыз (13:28).","Құраннан кейінгі ең жақсы төрт сөз: *Субханалла, Алхамдулилла, Ла иляhа илляллаh, Аллаhу Акбар* — оларды күн бойы пайдаланыңыз.","Таңертеңгі және кешкі *азкарлар* (еске алу формулалары) Пайғамбер жолымен белгіленген қорғаныс және ғибадат — оларды елемеңіз.","Тіліңізді зікірмен ылғал ұстаңыз — бұл ештеңеге тұрмайды және садақадан да артық сыйақы береді.\n---"]}}},{"id":"faith","categoryId":"spirituality","order":55,"translations":{"en":{"name":"Faith","quran":[{"reference":"49:14","text":"\"The bedouins say: 'We have believed.' Say: 'You have not [yet] believed; but say [instead]: We have submitted, for faith has not yet entered your hearts.'\""},{"reference":"2:165","text":"\"But those who believe are stronger in love for Allah.\""},{"reference":"3:173","text":"\"And they said: 'Sufficient for us is Allah, and [He is] the best Disposer of affairs.'\""}],"hadith":["*\"Faith has seventy-odd branches — the highest is to say La ilaha illa Allah, and the lowest is to remove something harmful from the road. And modesty is a branch of faith.\"* — Sahih al-Bukhari 9, Sahih Muslim 35 (**Sahih**)","*\"Taste the sweetness of faith: to love Allah and His Messenger more than anything else; to love a person only for Allah's sake; and to dislike returning to disbelief as you would dislike being thrown into the fire.\"* — Sahih al-Bukhari 16, Sahih Muslim 43 (**Sahih**)"],"scholars":["**Ibn al-Qayyim** — *\"Faith is not a statement alone. It is a statement of the tongue, a belief of the heart, and action of the limbs. All three must be present.\"* — *Madarij as-Salikin*","**Imam Al-Ghazali** — *\"The sweetness of faith is felt by the heart that has tasted Allah's love and found nothing equal to it. From that moment, the world shrinks and the akhirah grows.\"* — *Ihya' Ulum ad-Din*"],"lessons":["Iman is not a declaration alone — it requires belief of the heart and action of the limbs.","Faith has levels — it increases with obedience and decreases with sin. Tend to it actively.","The sweetness of faith is a real feeling — seek it through love of Allah, love for His sake, and hatred of what displeases Him.","Saying *hasbunallah wa ni'mal wakil* in difficulty is faith in action — a living response to crisis.\n---"]},"ru":{"name":"Иман (Вера)","quran":[{"reference":"49:14","text":"«Бедуины сказали: \"Мы уверовали\". Скажи: \"Вы не уверовали. Говорите лучше: 'Мы покорились', ибо вера ещё не вошла в ваши сердца\".»"},{"reference":"2:165","text":"«Но те, кто уверовал, любят Аллаха сильнее.»"},{"reference":"3:173","text":"«Они сказали: \"Нам достаточно Аллаха, и как прекрасен этот Попечитель!\"»"}],"hadith":["*«Вера состоит из семидесяти с лишним ветвей: высшая из них — \"Ля иляха илляллах\", а низшая — убрать препятствие с дороги. И скромность — ветвь веры.»* — Сахих аль-Бухари 9, Сахих Муслим 35 (**Достоверный**)","*«Вкуси сладость веры: люби Аллаха и Его Посланника больше всего остального; люби человека только ради Аллаха; и ненавидь возвращение к неверию так же, как ты ненавидишь быть брошенным в огонь.»* — Сахих аль-Бухари 16, Сахих Муслим 43 (**Достоверный**)"],"scholars":["**Ибн аль-Каййим** — *«Иман — не только слова. Это слово языка, убеждение сердца и действие конечностей. Все три должны присутствовать.»* — *Мадаридж ас-Саликин*","**Имам аль-Газали** — *«Сладость веры ощущает то сердце, которое вкусило любовь Аллаха и не нашло ничего равного ей. С этого момента мир сжимается, а ахират вырастает.»* — *Ихья Улюм ад-Дин*"],"lessons":["Иман — не одна лишь декларация: он требует убеждения сердца и действия конечностей.","Иман имеет степени — он возрастает с послушанием и убывает с грехом. Заботьтесь о нём активно.","Сладость веры — реальное ощущение: ищите его через любовь к Аллаху, любовь ради Него и ненависть к тому, что Ему не угодно.","Произносить *«хасбуналлаху ва ниъмаль-вакиль»* в трудности — вера в действии: живой ответ на кризис.\n---"]},"kk":{"name":"Иман","quran":[{"reference":"49:14","text":"«Бедуиндер: \"Иман келтірдік\" деді. \"Иман келтірдік\" деме, \"Бойұсындық\" де, өйткені иман сенің жүрегіңе кірген жоқ.»"},{"reference":"2:165","text":"«Бірақ иман келтіргендер Аллаға деген сүйіспеншілікте күштірек.»"},{"reference":"3:173","text":"«Олар: \"Аллаh бізге жетеді, Ол — қандай жақсы Уәкіл!\" деді.»"}],"hadith":["*«Иманның жетпіс артық тармағы бар: ең жоғарысы \"Ла иляhа илляллаh\", ең төменгісі — жолдан зиянды нәрсені алып тастау. Ал ұят — иманның тармағы.»* — Сахих әл-Бухари 9, Сахих Муслим 35 (**Сахих**)","*«Иманның тәттілігін тат: Аллаh пен Оның Елшісін барлық нәрседен артық сүй; адамды тек Алла үшін сүй; куфрге оралуды отқа тасталудан жек кергендей жек көр.»* — Сахих әл-Бухари 16, Сахих Муслим 43 (**Сахих**)"],"scholars":["**Ибн әл-Қаййим** — *«Иман — сөз ғана емес. Бұл тілдің сөзі, жүректің сенімі және мүшелердің амалы. Үшеуі де болуы тиіс.»* — *Мадаридж әс-Саликин*","**Имам әл-Ғазали** — *«Иманның тәттілігін Алланың сүйіспеншілігін татып, оған тең еш нәрсе таппаған жүрек сезеді. Сол сәттен бастап дүние кіші, ал ахирет кеңейеді.»* — *Ихья Улюм ад-Дин*"],"lessons":["Иман — жарияланым ғана емес: жүректің сенімі мен мүшелердің амалы керек.","Иманның деңгейлері бар — бағынышпен артады, күнәмен азаяды. Оны белсенді күтіп ұстаңыз.","Иманның тәттілігі — нақты сезім: оны Аллаға деген сүйіспеншілік, Ол үшін сүйіспеншілік және Оған жаман нәрседен жек көру арқылы іздеңіз.","Қиыншылықта *«хасбуналлаhу уа ниъмаль-уәкиль»* дейтін сәт — іс жүзіндегі иман: дағдарысқа тірі жауап.\n---"]}}},{"id":"taqwa","categoryId":"spirituality","order":56,"translations":{"en":{"name":"Taqwa","quran":[{"reference":"49:13","text":"\"Indeed, the most noble of you in the sight of Allah is the most righteous (*muttaqi*) of you.\""},{"reference":"2:197","text":"\"And take provisions, but indeed, the best provision is taqwa.\""},{"reference":"65:2–3","text":"\"And whoever fears Allah — He will make for him a way out. And will provide for him from where he does not expect.\""}],"hadith":["*\"Fear Allah wherever you are. Follow a bad deed with a good one to erase it. And treat people with good character.\"* — Jami' at-Tirmidhi 1987 (**Hasan Sahih** per At-Tirmidhi)","*\"Taqwa is here\" — and he pointed to his chest three times.\"* — Sahih Muslim 2564 (**Sahih**)"],"scholars":["**Ali ibn Abi Talib** — *\"Taqwa is fear of the Majestic, acting upon the Revelation, being content with little, and preparing for the Day of Departure.\"* — Widely attributed; cited in classical Islamic literature.","**Ibn al-Qayyim** — *\"Taqwa is to place between yourself and Allah's anger a shield — made of obedience to His commands and avoidance of His prohibitions.\"* — *Madarij as-Salikin*"],"lessons":["Taqwa is the best provision for the journey to the akhirah (2:197) — prioritise it above everything else.","Taqwa lives in the heart (Sahih Muslim 2564) — it is not a performance for others.","Allah guarantees a way out and unexpected provision for those who have taqwa (65:2–3) — this is a divine contract.","Fear Allah wherever you are — taqwa is not for the masjid alone; it is for the home, office, and marketplace.\n---"]},"ru":{"name":"Такуа","quran":[{"reference":"49:13","text":"«Воистину, наиболее почитаемый перед Аллахом среди вас — наиболее богобоязненный из вас.»"},{"reference":"2:197","text":"«Берите с собой припасы, но лучший припас — богобоязненность.»"},{"reference":"65:2–3","text":"«Того, кто боится Аллаха, Он выведет из затруднительного положения. И одарит его уделом оттуда, откуда он и не ожидал.»"}],"hadith":["*«Бойся Аллаха, где бы ты ни был. За плохим делом следуй хорошим, которое сотрёт его. И обращайся с людьми хорошо.»* — Джами ат-Тирмизи 1987 (**Достоверный Хороший** по ат-Тирмизи)","*«Такуа — вот здесь\" — и он трижды указал на свою грудь.»* — Сахих Муслим 2564 (**Достоверный**)"],"scholars":["**Али ибн Аби Талиб** — *«Такуа — это страх перед Величественным, следование Откровению, довольствование малым и подготовка к Дню исхода.»* — Широко приписывается в классической исламской литературе.","**Ибн аль-Каййим** — *«Такуа — это поместить между собой и гневом Аллаха щит, состоящий из повиновения Его повелениям и избегания Его запретов.»* — *Мадаридж ас-Саликин*"],"lessons":["Такуа — лучший припас для пути к ахирату (2:197) — ставьте его выше всего остального.","Такуа живёт в сердце (Сахих Муслим 2564) — это не показное действие для других.","Аллах гарантирует выход и неожиданный удел тем, кто обладает такуа (65:2–3) — это Божественный договор.","Бойтесь Аллаха везде, где бы вы ни были: такуа не только для мечети, но и для дома, офиса и рынка.\n---"]},"kk":{"name":"Тақуалық","quran":[{"reference":"49:13","text":"«Расында, Алланың алдындағы ең сыйлыларыңыз — ең тақуаларыңыз.»"},{"reference":"2:197","text":"«Азық алыңдар, ал ең жақсы азық — тақуалық.»"},{"reference":"65:2–3","text":"«Аллаhтан қорқатын адамды Ол шығуы бар жерден шығарады. Оны өзі ойламаған жерден ризықтандырады.»"}],"hadith":["*«Қай жерде болсаң да Алладан қорық. Жаман амалдан кейін оны өшіретін жақсы амал жаса. Және адамдармен жақсы мінез-құлықпен бол.»* — Жами ат-Тирмизи 1987 (**Сахих-Хасан**, ат-Тирмизи бойынша)","*«Тақуалық — міне, осы жерде\" — деп ол кеудесін үш рет нұсқады.»* — Сахих Муслим 2564 (**Сахих**)"],"scholars":["**Али ибн Әби Талиб** — *«Тақуалық — Ұлылықтан қорқу, Уахиді орындау, азға қанағат ету және Кету Күніне дайындалу.»* — Классикалық Ислам әдебиетінде кеңінен айтылады.","**Ибн әл-Қаййим** — *«Тақуалық — өзіңмен Алланың ашуы арасына Оның бұйрықтарына бағынудан және тыйымдарынан аулақтанудан жасалған қалқан қою.»* — *Мадаридж әс-Саликин*"],"lessons":["Тақуалық — ахиратқа сапардағы ең жақсы азық (2:197) — оны барлық нәрседен жоғары қойыңыз.","Тақуалық жүректе тұрады (Сахих Муслим 2564) — бұл басқалар үшін жасалатын шоу емес.","Алла тақуалары бар адамдарға шығуды және үмітпеген жерден ризықтануды кепілдейді (65:2–3) — бұл Құдайлық шарт.","Қай жерде болсаңыз да Алладан қорқыңыз: тақуалық тек мешітке арналмаған, ол үйге, кеңсеге және базарға арналған."]}}}]};

function rich(t){return t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');}
function unwrap(s){return s.trim().replace(/^\*{1,2}/,'').replace(/\*{1,2}$/,'').trim();}
function parseHadith(raw){const text=raw.trim();let di=text.indexOf(' — '),dl=3;
  if(di===-1){const t=text.indexOf('—');if(t===-1)return{quote:unwrap(text)};di=t;dl=1;}
  const q=text.slice(0,di).trim();let rest=text.slice(di+dl).trim();let grade=null,note=null;
  const pm=rest.match(/\(([^)]*)\)\s*$/);
  if(pm){const inner=pm[1].trim();rest=rest.slice(0,pm.index).trim();const bm=inner.match(/\*\*(.+?)\*\*/);
    if(bm){grade=bm[1].trim();const r=inner.replace(/\*\*.+?\*\*/,'').trim();note=r||null;}else note=inner;}
  return{quote:unwrap(q),source:rest||null,grade,note};}
function parseScholar(raw){const text=raw.trim();let name=null,rest=text;
  const nm=text.match(/^\*\*(.+?)\*\*\s*—\s*/);if(nm){name=nm[1].trim();rest=text.slice(nm[0].length).trim();}
  const ld=rest.lastIndexOf(' — ');if(ld!==-1)return{name,quote:unwrap(rest.slice(0,ld)),source:unwrap(rest.slice(ld+3))};
  return{name,quote:unwrap(rest),source:null};}

function fib(n,radius){const p=[],phi=Math.PI*(3-Math.sqrt(5));for(let i=0;i<n;i++){const y=1-(i/(n-1))*2,r=Math.sqrt(1-y*y),th=phi*i;p.push({x:Math.cos(th)*r*radius,y:y*radius,z:Math.sin(th)*r*radius});}return p;}

  var hues=['70,110,255','120,90,220','201,162,39','40,80,200'];glows=[];for(var j=0;j<5;j++){glows.push({x:Math.random(),y:Math.random(),r:.22+Math.random()*.24,vx:(Math.random()-.5)*.00005,vy:(Math.random()-.5)*.00005,hue:hues[j%hues.length]});}}

 function draw(t){ctx.clearRect(0,0,w,h);

  const lp=[];for(let i=0;i<nodeN;i++){const a=nodePts[i];const ds=[];for(let j=0;j<nodeN;j++){if(i===j)continue;const b=nodePts[j];ds.push([(a.x-b.x)**2+(a.y-b.y)**2+(a.z-b.z)**2,j]);}ds.sort((x,y)=>x[0]-y[0]);for(let k=0;k<2;k++){const b=nodePts[ds[k][1]];lp.push(a.x,a.y,a.z,b.x,b.y,b.z);}}

    const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;yaw+=dx*.006;pitch+=dy*.006;vyaw=dx*.006;vpitch=dy*.006;};

    setTimeout(function(){ if(cb)cb(); },350);
  } else {
    if(cb)cb();
  }
}


// ---- Topic navigation drawer ----
function renderDrawer(){
  var cl=contentLocaleFor(locale);
  var nav=document.getElementById('drawerNav');
  var cats=DATA.categories.slice().sort(function(a,b){return a.order-b.order;});
  var html='';
  cats.forEach(function(cat){
    var topics=DATA.topics.filter(function(t){return t.categoryId===cat.id;}).sort(function(a,b){return a.order-b.order;});
    if(!topics.length)return;
    html+='<div class="drawer-cat"><h2><span>'+(CAT_ICON[cat.id]||'•')+'</span> '+cat.name[cl]+'</h2><ul>';
    topics.forEach(function(t){
      var active=(t.id===selectedId)?' active':'';
      html+='<li><button class="drawer-item'+active+'" onclick="openTopic(\''+t.id+'\');closeDrawer();">'+t.translations[cl].name+'</button></li>';
    });
    html+='</ul></div>';
  });
  nav.innerHTML=html;
}
function openDrawer(){renderDrawer();document.getElementById('drawer').classList.add('open');document.getElementById('drawerBackdrop').classList.add('open');document.body.style.overflow='hidden';}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('drawerBackdrop').classList.remove('open');document.body.style.overflow='';}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDrawer();});

renderLang();refreshHome();initPageStars();

if(window.THREE){initThree();}else{let tries=0;const iv=setInterval(()=>{tries++;if(window.THREE){clearInterval(iv);initThree();}else if(tries>60){clearInterval(iv);document.getElementById('mount').innerHTML='<div style="color:#fff;text-align:center;padding-top:45%;">3D globe needs internet to load Three.js.<br>The full Next.js app bundles it locally.</div>';}},100);}
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(sizeStage,150);});
</script>
