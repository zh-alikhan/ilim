p grief.","Use the prophetic du'a for sorrow (Abu Dawood 1555) — it is a specific prescription, not general advice.","Know that every pain expiates sins — nothing a believer suffers is meaningless before Allah.\n---"]},"ru":{"name":"Печаль","quran":[{"reference":"2:155–157","text":"«Мы непременно испытаем вас... порадуй же терпеливых — тех, которые, когда их постигает беда, говорят: \"Воистину, мы принадлежим Аллаху и к Нему возвращаемся\". Это те, на кого нисходят благословения их Господа и милость.»"},{"reference":"12:86","text":"«[Йакуб] сказал: \"Я жалуюсь Аллаху на свою скорбь и печаль\".»"},{"reference":"94:5","text":"«Воистину, после трудности — облегчение.»"}],"hadith":["*«Никакая усталость, болезнь, печаль, горе, вред или беда не постигнет мусульманина... не искупив этим часть его грехов.»* — Сахих аль-Бухари 5641 (**Достоверный**)","*«Читай ду'а: Аллаhumma инни абдука... [О Аллах, я — Твой раб...] — тот, кто говорит это с убеждённостью в сердце, Аллах рассеет его печаль и заменит горе радостью.»* — Сунан Абу Дауд 1555 (**Достоверный** по аль-Альбани)"],"scholars":["**Ибн аль-Каййим** — *«Печаль, принятая с терпением и направленная к Аллаху, очищает сердце, как огонь очищает золото.»* — *Мадаридж ас-Саликин*","**Хасан аль-Басри** — *«Верующий просыпается в печали и ложится спать в печали — и это уместно, ибо он находится между двумя великими вещами: тем, что прошло из его грехов, и тем, что осталось от его жизни.»* — Широко приписывается."],"lessons":["Несите своё горе прямо к Аллаху, как сделал Пророк Йакуб — не в социальные сети и не просто для выпускания пара.","Печаль — не признак слабой веры: пророки переживали глубокое горе.","Используйте пророческое ду'а от печали (Абу Дауд 1555) — это конкретное предписание, а не общий совет.","Знайте, что каждая боль искупает грехи — ничто из того, что переносит верующий, не бессмысленно пред Аллахом.\n---"]},"kk":{"name":"Қайғы","quran":[{"reference":"2:155–157","text":"«Біз сендерді сынаймыз... сабырлыларды сүйіншіле — апат болғанда \"Расында біз Аллаға тиеспіз және Оған қайтамыз\" дейтіндерді. Мінеки, Раббыларынан ізгілік пен рахмет соларға.»"},{"reference":"12:86","text":"«[Йақуп] айтты: \"Мен өз уайым-қасіретімді тек Аллаға шағамын\".»"},{"reference":"94:5","text":"«Расында, қиыншылықпен бірге жеңілдік бар.»"}],"hadith":["*«Мұсылманға тиетін ешбір шаршаушылық, ауру, қайғы, мұң, зиян немесе азап жоқ — тіпті тікенектің тіліп кетуі де — күнәлерінің бір бөлігі өтелмей.»* — Сахих әл-Бухари 5641 (**Сахих**)","*«\"Аллаhumma иннии абдука...\" деп айт — [О, Алла, мен Сенің бандаңмын...] — жүрегі нық болып осылай айтқанға Алла мұңын сейілтіп, қайғысын қуанышқа алмастырады.»* — Сунан Әбу Дауд 1555 (**Сахих**, әл-Албани бойынша)"],"scholars":["**Ибн әл-Қаййим** — *«Сабырмен қабылданып, Аллаға бағытталған қайғы жүректі алтынды оттай тазартады.»* — *Мадаридж әс-Саликин*","**Хасан әл-Басри** — *«Мүмін мұңайып оянып, мұңайып жатады — бұл орынды, өйткені ол екі ұлы нәрсенің арасындағы: өткен күнәлары мен қалған өмірі.»* — Кеңінен айтылады."],"lessons":["Қайғыңызды Пайғамбар Йақуп сияқты тікелей Аллаға алып барыңыз — тек іштен шығару үшін емес.","Қайғы — әлсіз иманның белгісі емес: пайғамбарлар терең қайғы кешті.","Қайғыдан Пайғамбар дұғасын пайдаланыңыз (Әбу Дауд 1555) — бұл жалпы кеңес емес, нақты тағайындалған нәрсе.","Алла алдында әрбір ауырсыну күнәны өтейтінін біліңіз — мүміннің кешіргені ешнәрсе бекер емес.\n---"]}}},{"id":"anger","categoryId":"mental-wellbeing","order":33,"translations":{"en":{"name":"Anger","quran":[{"reference":"3:134","text":"\"Those who... restrain anger and who pardon the people — and Allah loves the doers of good.\""},{"reference":"41:34","text":"\"Repel [evil] by that [deed] which is better... thereupon the one whom between you and him is enmity will become as though he was a devoted friend.\""},{"reference":"42:37","text":"\"And those who avoid the major sins and immoralities, and when they are angry, they forgive.\""}],"hadith":["*\"Do not become angry.\" [The Prophet ﷺ was asked for advice; he repeated this three times.]* — Sahih al-Bukhari 6116 (**Sahih**)","*\"When one of you becomes angry while standing, let him sit down. If the anger leaves him, well and good; otherwise let him lie down.\"* — Sunan Abu Dawood 4782 (**Sahih** per Al-Albani)"],"scholars":["**Ali ibn Abi Talib** — *\"The first to apologise is the bravest. The first to forgive is the strongest.\"* — Widely attributed.","**Ibn al-Qayyim** — *\"Anger is an ember in the heart. When it is stoked, it burns the one who holds it before it burns anyone else.\"* — *Madarij as-Salikin*"],"lessons":["The Prophet ﷺ's most repeated practical advice was a single command: *\"Do not become angry.\"*","Physical remedies work: sit when standing, lie down when sitting, perform wudu.","Restraining anger in the moment is one of the explicit qualities of those whom Allah loves (3:134).","Forgiving when angry is the mark of those who avoid major sins (42:37).\n---"]},"ru":{"name":"Гнев","quran":[{"reference":"3:134","text":"«Тех, кто... сдерживает гнев и прощает людям — ведь Аллах любит творящих добро.»"},{"reference":"41:34","text":"«Оттолкни [зло] тем, что лучше... и тогда тот, с кем у тебя была вражда, станет словно близкий друг.»"},{"reference":"42:37","text":"«Тех, которые избегают больших грехов и мерзостей и прощают, когда гневаются.»"}],"hadith":["*«Не гневайся.\" [Пророка ﷺ попросили дать совет; он повторил это три раза.]»* — Сахих аль-Бухари 6116 (**Достоверный**)","*«Когда кто-либо из вас разгневается, стоя, пусть сядет. Если гнев уйдёт — хорошо; иначе пусть ляжет.»* — Сунан Абу Дауд 4782 (**Достоверный** по аль-Альбани)"],"scholars":["**Али ибн Аби Талиб** — *«Первый, кто извиняется, — самый смелый. Первый, кто прощает, — самый сильный.»* — Широко приписывается.","**Ибн аль-Каййим** — *«Гнев — это уголёк в сердце. Когда его раздувают, он сжигает того, кто его держит, прежде чем сжечь кого-либо другого.»* — *Мадаридж ас-Саликин*"],"lessons":["Наиболее повторяемый практический совет Пророка ﷺ — единственная заповедь: *«Не гневайся».*","Работают физические средства: сядьте, когда стоите; лягте, когда сидите; совершите омовение.","Сдерживание гнева в момент — одно из явных качеств тех, кого любит Аллах (3:134).","Прощение в гневе — признак тех, кто избегает больших грехов (42:37).\n---"]},"kk":{"name":"Ашу","quran":[{"reference":"3:134","text":"«Ашуын тежейтіндер және адамдарды кешіретіндер — Алла ізгілік жасаушыларды сүйеді.»"},{"reference":"41:34","text":"«Жамандықты жақсылықпен дер кет... сонда арандарыңда дұшпандық болған адам жақын досқа айналады.»"},{"reference":"42:37","text":"«Ашуланғанда кешіретіндер.»"}],"hadith":["*«Ашуланба.\" [Пайғамбар ﷺ-дан кеңес сұрады; ол үш рет қайталады.]»* — Сахих әл-Бухари 6116 (**Сахих**)","*«Сендердің бірі тұрған кезде ашуланса, отырсын. Егер ашу кетсе — жақсы; болмаса жатсын.»* — Сунан Әбу Дауд 4782 (**Сахих**, әл-Албани бойынша)"],"scholars":["**Али ибн Әби Талиб** — *«Кешірім сұраған алғашқы адам — ең батыл. Ең алғаш кешіретін — ең күшті.»* — Кеңінен айтылады.","**Ибн әл-Қаййим** — *«Ашу — жүректегі шоқ. Оны ызғытқанда, ол ең алдымен ұстаған адамды өртейді.»* — *Мадаридж әс-Саликин*"],"lessons":["Пайғамбар ﷺ-ның ең жиі қайталанған практикалық өсиеті — бір ғана бұйрық: *«Ашуланба».*","Физикалық амалдар жұмыс жасайды: тұрған кезде отырыңыз; отырған кезде жатыңыз; дәрет алыңыз.","Ашуды тежеу — Алла сүйетін адамдардың нақты белгілерінің бірі (3:134).","Ашу кезінде кешіру — үлкен күнәлардан аулақ жүретіндердің белгісі (42:37).\n---"]}}},{"id":"fear","categoryId":"mental-wellbeing","order":34,"translations":{"en":{"name":"Fear","quran":[{"reference":"2:38","text":"\"Whoever follows My guidance — no fear will there be concerning them, nor will they grieve.\""},{"reference":"3:175","text":"\"It is only Satan who frightens [you] of his supporters. So fear them not, but fear Me, if you are [truly] believers.\""},{"reference":"9:40","text":"\"Do not grieve; indeed Allah is with us.\"* (The Prophet ﷺ to Abu Bakr in the cave)"}],"hadith":["*\"Seek help against fear by saying: La ilaha illa Allah.\"* — Not a single verified hadith; rather scholars derive this from general principles of dhikr in texts such as Sahih al-Bukhari's *Kitab al-Du'a*.","*\"Whoever says upon leaving his house: 'Bismillah, tawakkaltu 'ala Allah, wa la hawla wa la quwwata illa billah' — it is said to him: You are guided, protected, and guarded, and Shaytan moves away from him.\"* — Sunan Abu Dawood 5095, Jami' at-Tirmidhi 3426 (**Sahih**)"],"scholars":["**Ibn al-Qayyim** — *\"Fear of other than Allah arises from distance from Allah. Draw near to Allah and the fear of creation disappears.\"* — *Al-Fawa'id*","**Imam Al-Ghazali** — *\"Khashyah (awe-fear of Allah) is the most beneficial fear; khawf (fear of harm) is beneficial only when it drives you toward preparation and reliance on Allah.\"* — *Ihya' Ulum ad-Din*"],"lessons":["Fear of creation dissolves in proportion to your closeness to Allah — draw near to Him to find courage.","Satan's method is to magnify human threats. The Quran's answer is direct: *\"Fear Me, not them\"* (3:175).","Recite the morning du'a before leaving home (Abu Dawood 5095) — it is a prophetic shield.","The only fear worth cultivating is khashyah of Allah — it produces wisdom and protects from every other fear.\n---"]},"ru":{"name":"Страх","quran":[{"reference":"2:38","text":"«Тот, кто последует за Моим руководством, — над ними не властен страх, и не познают они печали.»"},{"reference":"3:175","text":"«Воистину, это — шайтан пугает вас своими друзьями. Не бойтесь их, а бойтесь Меня, если вы являетесь верующими.»"},{"reference":"9:40","text":"«Не печалься, ведь Аллах — с нами.»* (Слова Пророка ﷺ Абу Бакру в пещере)"}],"hadith":["*«Тот, кто при выходе из своего дома скажет: \"Бисмилляh, тавакkaltu аляллах, ва ля хавля ва ля куввата илля билляh\" — ему будет сказано: \"Тебе указан путь, ты защищён и охранён\", и шайтан отдалится от него.»* — Сунан Абу Дауд 5095, Джами ат-Тирмизи 3426 (**Достоверный**)","*«Просите Аллаха об избавлении, ибо ничего лучшего никому не было даровано.»* — Джами ат-Тирмизи 3512 (**Достоверный**)"],"scholars":["**Ибн аль-Каййим** — *«Страх перед чем-либо, кроме Аллаха, возникает из отдалённости от Аллаха. Приближайтесь к Аллаху — и страх перед творениями исчезнет.»* — *аль-Фаваид*","**Имам аль-Газали** — *«Хашья (благоговейный страх перед Аллахом) — наиболее полезный страх; страх вреда полезен лишь тогда, когда побуждает к подготовке и упованию на Аллаха.»* — *Ихья Улюм ад-Дин*"],"lessons":["Страх перед творениями рассеивается по мере приближения к Аллаху — приближайтесь к Нему, чтобы обрести смелость.","Метод шайтана — преувеличивать человеческие угрозы. Ответ Корана прямой: *«Бойтесь Меня, а не их»* (3:175).","Читайте утреннее ду'а перед выходом из дома (Абу Дауд 5095) — это пророческий щит.","Единственный страх, заслуживающий воспитания, — хашья к Аллаху: он порождает мудрость и защищает от всех прочих страхов.\n---"]},"kk":{"name":"Қорқыныш","quran":[{"reference":"2:38","text":"«Менің жол көрсетуіме ерген адамдарға не қорқыныш бар, не олар қайғырады.»"},{"reference":"3:175","text":"«Расында, бұл шайтан өзінің достарымен қорқытады. Оларынан қорықпаңдар, Менен қорқыңдар, егер мүмін болсаңдар.»"},{"reference":"9:40","text":"«Қайғырма, расында Алла бізбен бірге.»* (Пайғамбар ﷺ Әбу Бәкірге үңгірде айтқан сөз)"}],"hadith":["*«Үйінен шыққанда \"Бисмилляh, тавакkaltu аляллаh, уа ля хауля уа ля куввата илля билляh\" деген адамға: \"Сенде жол бар, сен қорғалдың\" делінеді, және шайтан одан алшақтайды.»* — Сунан Әбу Дауд 5095, Жами ат-Тирмизи 3426 (**Сахих**)","*«Аллаh-тан қорғаныш іздеңдер, өйткені қорғаныштан жақсы нәрсе ешкімге берілген емес.»* — Жами ат-Тирмизи 3512 (**Сахих**)"],"scholars":["**Ибн әл-Қаййим** — *«Алладан басқа нәрседен қорқыныш — Алладан алыстаудан туындайды. Аллаға жақындаңыз — және жаратылыстардан қорқыныш жоғалады.»* — *Әл-Фауаид*","**Имам әл-Ғазали** — *«Хашйа (Алладан деген аса ілтипатпен қорқу) — ең пайдалы қорқыныш; зияннан қорқу тек Аллаға сүйенуге және дайындалуға итермелегенде пайдалы.»* — *Ихья Улюм ад-Дин*"],"lessons":["Жаратылыстардан қорқыныш Аллаға жақындаған сайын кетеді — жігер алу үшін Оған жақындаңыз.","Шайтанның амалы — адами қауіптерді асырып көрсету. Құранның жауабы тікелей: *«Менен қорқыңдар, олардан емес»* (3:175).","Үйден шығарда таңертеңгі дұғаны оқыңыз (Әбу Дауд 5095) — бұл Пайғамбердің қалқаны.","Тәрбиелеуге лайықты жалғыз қорқыныш — Аллахтан хашйа: ол даналықты туғызып, барлық басқа қорқыныштан қорғайды.\n---"]}}},{"id":"depression","categoryId":"mental-wellbeing","order":35,"translations":{"en":{"name":"Depression","quran":[{"reference":"93:3–5","text":"\"Your Lord has not taken leave of you, [O Muhammad], nor has He detested [you]. And the Hereafter is better for you than the first [life]. And your Lord is going to give you, and you will be satisfied.\""},{"reference":"94:5–6","text":"\"For indeed, with hardship will be ease. Indeed, with hardship will be ease.\""},{"reference":"39:53","text":"\"Do not despair of the mercy of Allah.\""}],"hadith":["*\"No fatigue, nor disease, nor sorrow... befalls a Muslim... but that Allah expiates some of his sins.\"* — Sahih al-Bukhari 5641 (**Sahih**)","The Prophet ﷺ himself experienced periods of intense distress — the *fatra* (pause in revelation) caused him great anguish, after which Surah 93 was revealed as direct divine comfort."],"scholars":["**Ibn al-Qayyim** — *\"Sadness of the heart, when not accompanied by sin, is itself a form of worship — for it shows the heart is alive and knows it is far from its Lord.\"* — *Madarij as-Salikin*","**Imam Al-Ghazali** — *\"The greatest cause of spiritual depression is isolation from Allah. The cure is return — even if the return is imperfect, even if the steps are small.\"* — *Ihya' Ulum ad-Din* (paraphrase)"],"lessons":["Allah addressed the Prophet ﷺ directly in his darkest period (Surah 93) — no believer is ever abandoned by Allah.","Do not despair of Allah's mercy even at the lowest points — this itself is the Quranic command (39:53).","Seek professional help without shame — seeking a doctor for mental health is equivalent to seeking one for a physical illness. Islam recognises the reality of illness in all its forms.","Small steps matter: wudu, a short prayer, one ayah of Quran — begin where you are.\n---"]},"ru":{"name":"Депрессия","quran":[{"reference":"93:3–5","text":"«Твой Господь не покинул тебя и не возненавидел. И последующее будет лучше для тебя, чем предыдущее. Твой Господь одарит тебя, и ты будешь доволен.»"},{"reference":"94:5–6","text":"«Воистину, после трудности — облегчение. Воистину, после трудности — облегчение.»"},{"reference":"39:53","text":"«Не отчаивайтесь в милости Аллаха.»"}],"hadith":["*«Никакая усталость, болезнь, печаль... не постигнет мусульманина... не искупив этим часть его грехов.»* — Сахих аль-Бухари 5641 (**Достоверный**)","Пророк ﷺ сам переживал периоды глубокого страдания: пауза в откровении (*фатра*) причинила ему огромные страдания, после которых была ниспослана сура 93 как прямое Божественное утешение."],"scholars":["**Ибн аль-Каййим** — *«Печаль сердца, не сопровождаемая грехом, сама по себе является формой поклонения — ибо она показывает, что сердце живо и знает, что оно далеко от своего Господа.»* — *Мадаридж ас-Саликин*","**Имам аль-Газали** — *«Главной причиной духовной депрессии является изоляция от Аллаха. Лекарство — возвращение, даже если оно несовершенно, даже если шаги малы.»* — *Ихья Улюм ад-Дин* (перефразировано)"],"lessons":["Аллах обратился к Пророку ﷺ прямо в его самый тёмный период (сура 93) — Аллах никогда не оставляет верующего.","Не отчаивайтесь в милости Аллаха даже в самые низкие моменты — это само по себе коранический приказ (39:53).","Обращайтесь за профессиональной помощью без стыда — обращение к врачу по поводу психического здоровья равносильно обращению по поводу физической болезни. Ислам признаёт реальность болезни во всех её формах.","Маленькие шаги имеют значение: омовение, короткая молитва, один аят Корана — начните там, где вы находитесь.\n---"]},"kk":{"name":"Депрессия","quran":[{"reference":"93:3–5","text":"«Раббың сені тастап кетпеді және сені жек көрмеді. Және ақырет сенің алдыңда, дүниеден жақсы. Раббың саған беретін шығар, сонда разы боларсың.»"},{"reference":"94:5–6","text":"«Расында, қиыншылықпен бірге жеңілдік бар. Расында, қиыншылықпен бірге жеңілдік бар.»"},{"reference":"39:53","text":"«Алланың рахметінен үмітсіз болмаңдар.»"}],"hadith":["*«Мұсылманға тиетін ешбір шаршаушылық, ауру, қайғы... тіпті тікенектің тіліп кетуі де — күнәлерінің бір бөлігі өтелмей.»* — Сахих әл-Бухари 5641 (**Сахих**)","Пайғамбар ﷺ өзі терең күйзелістің кезеңдерін бастан өткізді — уахидің үзілуі (*фатра*) оған орасан зор азап берді, содан кейін тікелей Құдайлық жұбаныш ретінде 93-сүре ниспосланды."],"scholars":["**Ибн әл-Қаййим** — *«Жүрек қайғысы, күнәмен қосылмаса, өзі де ғибадат формасы болып табылады — өйткені жүректің тірі екенін және Раббынан алыс екенін білетінін көрсетеді.»* — *Мадаридж әс-Саликин*","**Имам әл-Ғазали** — *«Рухани депрессияның ең үлкен себебі — Алладан оқшаулану. Емі — қайту, тіпті жетілмесе де, тіпті қадамдар кішкентай болса да.»* — *Ихья Улюм ад-Дин* (жинақталған)"],"lessons":["Алла Пайғамбарымызға ﷺ ең қараңғы кезеңінде тікелей жолданды (93-сүре) — Алла ешбір мүмінді тастамайды.","Ең төменгі нүктелерде де Алланың рахметінен үмітсіз болмаңыз — бұл өзі Құрандық бұйрық (39:53).","Ұялмай кәсіби көмек іздеңіз — психикалық денсаулық үшін дәрігерге бару физикалық ауру үшін баруға тең. Ислам ауруды барлық түрінде мойындайды.","Ұсақ қадамдар маңызды: дәрет, қысқа намаз, бір аят Құран — қай жерде болсаңыз, содан бастаңыз.\n---"]}}},{"id":"motivation","categoryId":"mental-wellbeing","order":36,"translations":{"en":{"name":"Motivation","quran":[{"reference":"3:139","text":"\"Do not weaken and do not grieve, and you will be superior if you are [true] believers.\""},{"reference":"13:11","text":"\"Indeed, Allah will not change the condition of a people until they change what is in themselves.\""},{"reference":"94:7","text":"\"So when you have finished [your duties], then stand up [for worship].\""}],"hadith":["*\"Make use of five before five: your youth before your old age, your health before your illness, your wealth before your poverty, your free time before your preoccupation, and your life before your death.\"* — Al-Bayhaqi (**Sahih** per Al-Albani, *Silsilat al-Ahadith as-Sahihah* 1077)","*\"Be eager for what benefits you, seek help from Allah, and do not lose heart.\"* — Sahih Muslim 2664 (**Sahih**)"],"scholars":["**Ibn al-Qayyim** — *\"Aspiration is the engine of the heart. Whoever has great aspirations for the akhirah will find energy for this world; whoever loses his akhirah aspiration loses energy for everything.\"* — *Al-Fawa'id*","**Ali ibn Abi Talib** — *\"Whoever knows himself, knows his Lord. And whoever knows his Lord, works for Him.\"* — Widely attributed; foundational in Sufi and classical Islamic thought."],"lessons":["Change begins from within (13:11) — Allah does not change your situation until you change your interior state.","Your life is a finite window (the hadith of five before five) — use this as your daily motivating reality.","Be eager, not passive — *\"be eager for what benefits you\"* is a direct prophetic command.","Connect your motivation to the akhirah: short-term goals exhaust; eternal goals sustain.\n-e \n---"]},"ru":{"name":"Мотивация","quran":[{"reference":"3:139","text":"«Не падайте духом и не печальтесь, ведь вы будете выше, если вы являетесь верующими.»"},{"reference":"13:11","text":"«Воистину, Аллах не меняет положения людей, пока они не изменят того, что есть в них самих.»"},{"reference":"94:7","text":"«Когда же ты освободишься, то потрудись усердно.»"}],"hadith":["*«Воспользуйся пятью вещами до пяти: молодостью до старости, здоровьем до болезни, богатством до бедности, свободным временем до занятости и жизнью до смерти.»* — аль-Байхаки (**Достоверный** по аль-Альбани, *Силсилат аль-Ахадис ас-Сахиха* 1077)","*«Стремись к тому, что принесёт тебе пользу, проси помощи у Аллаха и не опускай рук.»* — Сахих Муслим 2664 (**Достоверный**)"],"scholars":["**Ибн аль-Каййим** — *«Устремлённость — двигатель сердца. У кого велики стремления к ахирату, у того есть энергия для этого мира; у кого ослабевает устремлённость к ахирату, тот теряет энергию для всего.»* — *аль-Фаваид*","**Али ибн Аби Талиб** — *«Кто познал себя, тот познал своего Господа. А кто познал своего Господа, тот трудится ради Него.»* — Широко приписывается."],"lessons":["Изменение начинается изнутри (13:11) — Аллах не меняет вашего положения, пока вы не измените своё внутреннее состояние.","Ваша жизнь — конечное окно (хадис о пяти до пяти) — используйте это как ежедневную мотивирующую реальность.","Будьте деятельны, а не пассивны — *«стремись к тому, что принесёт тебе пользу»* — это прямая пророческая заповедь.","Привяжите свою мотивацию к ахирату: краткосрочные цели истощают; вечные цели поддерживают.\n---"]},"kk":{"name":"Мотивация","quran":[{"reference":"3:139","text":"«Жасымаңдар және қайғырмаңдар, егер мүмін болсаңдар сендер жоғарысыздар.»"},{"reference":"13:11","text":"«Расында, Алла өздеріндегіні өзгертпегенше, халықтың жағдайын өзгертпейді.»"},{"reference":"94:7","text":"«Ал бос болғанда — тырыс.»"}],"hadith":["*«Бесеуін бесеуінен бұрын пайдалан: жастықты кәрілікке дейін, денсаулықты ауруға дейін, байлықты кедейлікке дейін, бос уақытты бәзбіреу болғанға дейін және өмірді өлімге дейін.»* — Байхаки (**Сахих**, әл-Албани бойынша)","*«Пайдаңа болатын нәрсеге ұмтыл, Алладан көмек сұра және жасымай қой.»* — Сахих Муслим 2664 (**Сахих**)"],"scholars":["**Ибн әл-Қаййим** — *«Ынта — жүректің қозғаушысы. Ахиратқа деген ынтасы мол адамның дүние үшін де күші бар; ахиратқа деген ынтасы жоғалған адам бәрі үшін де күшін жоғалтады.»* — *Әл-Фауаид*","**Али ибн Әби Талиб** — *«Өзін таныған адам Раббысын таниды. Ал Раббысын таныған адам Ол үшін еңбек етеді.»* — Кеңінен айтылады."],"lessons":["Өзгеріс ішкі жақтан басталады (13:11) — Алла ішкі күйіңіз өзгермей жағдайыңызды өзгертпейді.","Өмір — ақырғы терезе (бесеу туралы хадис) — мұны күнделікті мотивация ретінде пайдаланыңыз.","Белсенді болыңыз, пассивті емес — *«пайдаңа болатын нәрсеге ұмтыл»* — тікелей Пайғамбер бұйрығы.","Мотивациянызды ахиратқа байлаңыз: қысқа мерзімді мақсаттар тауысады; мәңгілік мақсаттар ұстайды.\n---"]}}},{"id":"helping-others","categoryId":"society","order":37,"translations":{"en":{"name":"Helping Others","quran":[{"reference":"2:177","text":"\"Righteousness is... to give wealth, in spite of love for it, to relatives, orphans, the needy, the traveller, those who ask [for help].\""},{"reference":"107:1–3","text":"\"Have you seen the one who denies the [Day of] Recompense? For that is the one who drives away the orphan and does not encourage the feeding of the poor.\""},{"reference":"5:2","text":"\"And cooperate in righteousness and piety, but do not cooperate in sin and aggression.\""}],"hadith":["*\"Whoever relieves a Muslim of a worldly hardship, Allah will relieve him of a hardship on the Day of Resurrection. Whoever makes things easy for a person in difficulty, Allah will make things easy for him in this world and the next.\"* — Sahih Muslim 2699 (**Sahih**)","*\"The best of people are those who are most beneficial to people.\"* — Al-Mu'jam al-Awsat, Al-Tabarani (**Hasan** per Al-Albani)"],"scholars":["**Imam Al-Ghazali** — *\"Service to the creation is service to the Creator. The one who helps the weak and the needy is in Allah's service.\"* — *Ihya' Ulum ad-Din*","**Hasan al-Basri** — *\"If you want to know your worth before Allah, look at where Allah has placed you in the service of His creation.\"* — Widely attributed."],"lessons":["Relieving someone's hardship is directly rewarded with relief on the Day of Judgement.","The best human being is the one most beneficial to people — service to others is the measure of greatness.","Denying help to orphans and the poor is linked in the Quran to denying the Day of Judgement itself (107).","Cooperate in good actively — waiting to be asked is not enough.\n---"]},"ru":{"name":"Помощь другим","quran":[{"reference":"2:177","text":"«Праведность состоит в том, чтобы... из любви к Нему расходовать имущество на родственников, сирот, нуждающихся, путников и просящих.»"},{"reference":"107:1–3","text":"«Видел ли ты того, кто отвергает Судный день? Это тот, кто отгоняет сироту и не поощряет кормление бедного.»"},{"reference":"5:2","text":"«Помогайте друг другу в благочестии и богобоязненности, но не помогайте друг другу в грехе и вражде.»"}],"hadith":["*«Тому, кто избавит мусульманина от одной из мирских бед, Аллах избавит от одной из бед Судного дня. Тому, кто облегчит положение попавшего в затруднение, Аллах облегчит [положение] в этом мире и в ином.»* — Сахих Муслим 2699 (**Достоверный**)","*«Лучший из людей — тот, кто приносит наибольшую пользу людям.»* — аль-Муджам аль-Аусат, аль-Табарани (**Хороший** по аль-Альбани)"],"scholars":["**Имам аль-Газали** — *«Служение творению есть служение Творцу. Тот, кто помогает слабым и нуждающимся, находится на служении Аллаху.»* — *Ихья Улюм ад-Дин*","**Хасан аль-Басри** — *«Если хочешь знать свою ценность пред Аллахом, посмотри, куда Аллах поставил тебя в служении Его созданиям.»* — Широко приписывается."],"lessons":["Избавление кого-либо от трудности напрямую вознаграждается избавлением в Судный день.","Лучший человек — тот, кто наиболее полезен для людей: служение другим — мерило величия.","Отказ в помощи сиротам и бедным в Коране связан с отрицанием Судного дня (107).","Активно сотрудничайте в добре — ждать просьбы недостаточно.\n---"]},"kk":{"name":"Басқаларға көмек","quran":[{"reference":"2:177","text":"«Ізгілік — Оған деген махаббатпен мүліктерін туыстарға, жетімдерге, кедейлерге, жолаушыларға және тілеушілерге беру.»"},{"reference":"107:1–3","text":"«Дінді жоққа санайтынды көрдің бе? Бұл жетімді итеретін және кедейді тамақтандыруды ынталандырмайтын адам.»"},{"reference":"5:2","text":"«Ізгілік пен тақуалықта бір-бірлеріңізге көмектесіңдер, күнә мен зұлымдықта көмектеспеңдер.»"}],"hadith":["*«Кім мұсылманның дүниелік қиыншылықтарының бірін жеңілдетсе, Алла соның Қияметтегі қиыншылықтарының бірін жеңілдетеді.»* — Сахих Муслим 2699 (**Сахих**)","*«Адамдардың ең жақсысы — адамдарға ең пайдалысы.»* — Әл-Мужам әл-Аусат, ат-Табарани (**Хасан**, әл-Албани бойынша)"],"scholars":["**Имам әл-Ғазали** — *«Жаратылысқа қызмет ету — Жаратушыға қызмет ету. Кім әлсіздер мен мұқтаждарға көмектессе, ол Аллаға қызмет етеді.»* — *Ихья Улюм ад-Дин*","**Хасан әл-Басри** — *«Алла алдындағы қадіріңізді білгіңіз келсе, Алла сізді Оның жаратылыстарына қызметте қай жерге қойғанына қараңыз.»* — Кеңінен айтылады."],"lessons":["Біреудің қиыншылығын жеңілдету тікелей Қияметте жеңілдетумен сыйақыланады.","Ең жақсы адам — адамдарға ең пайдалысы: басқаларға қызмет ету — ұлылықтың өлшемі.","Жетімдер мен кедейлерге көмекті бас тарту Құранда Қияметті жоққа санаумен байланысты (107).","Жақсылықта белсенді ынтымақтасыңыз — сұралуды күтудің жеткіліксіздігі.\n---"]}}},{"id":"charity","categoryId":"society","order":38,"translations":{"en":{"name":"Charity","quran":[{"reference":"2:261","text":"\"The example of those who spend their wealth in the way of Allah is like a seed [of grain] which grows seven spikes; in each spike is a hundred grains.\""},{"reference":"63:10","text":"\"And spend from what We have provided you before death approaches one of you.\""},{"reference":"3:92","text":"\"Never will you attain the good [reward] until you spend [in the way of Allah] from that which you love.\""}],"hadith":["*\"Charity does not decrease wealth. Allah does not increase a servant in pardoning others except in honour, and no one humbles himself for Allah except that Allah raises him.\"* — Sahih Muslim 2588 (**Sahih**)","*\"Protect yourself from the Fire, even with half a date.\"* — Sahih al-Bukhari 1413, Sahih Muslim 1016 (**Sahih**)"],"scholars":["**Ibn al-Qayyim** — *\"Charity extinguishes sins as water extinguishes fire. It heals the body, purifies the wealth, and opens doors that no other key can open.\"* — *Al-Wabil as-Sayyib*","**Ali ibn Abi Talib** — *\"Give in charity before your wealth is taken from you.\"* — Widely attributed."],"lessons":["Charity multiplies — a single act of giving is counted as seven hundred or more before Allah (2:261).","No amount is too small — even half a date can protect from the Fire.","Give from what you love, not merely from what you can spare (3:92) — that is the level of true sadaqah.","Establish consistent charity (sadaqah jariyah) that continues after your death: a well, a school, a shared Quran.\n---"]},"ru":{"name":"Садака (Благотворительность)","quran":[{"reference":"2:261","text":"«Притча о тех, кто расходует своё имущество на пути Аллаха, подобна зерну, из которого выросло семь колосьев, и в каждом колосе — сто зёрен.»"},{"reference":"63:10","text":"«Расходуйте из того, чем Мы наделили вас, до того, как к кому-либо из вас явится смерть.»"},{"reference":"3:92","text":"«Вы не обретёте добродетели, пока не будете расходовать из того, что любите.»"}],"hadith":["*«Садака не уменьшает богатства. Аллах увеличивает раба только в почёте за прощение. И никто не смиряется ради Аллаха, кроме как Аллах возвышает его.»* — Сахих Муслим 2588 (**Достоверный**)","*«Укройтесь от Огня, хотя бы половиной финика.»* — Сахих аль-Бухари 1413, Сахих Муслим 1016 (**Достоверный**)"],"scholars":["**Ибн аль-Каййим** — *«Садака гасит грехи, как вода гасит огонь. Она исцеляет тело, очищает имущество и открывает двери, которые не откроет ни один другой ключ.»* — *аль-Вабиль ас-Саййиб*","**Али ибн Аби Талиб** — *«Отдавай садака прежде, чем твоё имущество будет взято у тебя.»* — Широко приписывается."],"lessons":["Садака умножается — один акт даяния засчитывается как семьсот или более пред Аллахом (2:261).","Никакая сумма не мала — даже половина финика может защитить от Огня.","Отдавайте из того, что вы любите, а не только из того, что можете пожертвовать (3:92) — таков уровень истинной садака.","Установите постоянную садака (садака джария), которая продолжается после вашей смерти: колодец, школа, Коран.\n---"]},"kk":{"name":"Садақа","quran":[{"reference":"2:261","text":"«Мүліктерін Алла жолына жұмсайтындардың мысалы — жеті масақ шығарған бір дән сияқты, әр масақта бір жүз дән.»"},{"reference":"63:10","text":"«Сендерге берген нәрсемізден біреуіңізге өлім келмей тұрып жұмсаңдар.»"},{"reference":"3:92","text":"«Сүйетін нәрселеріңізден жұмсамайынша ізгілікке жете алмайсыздар.»"}],"hadith":["*«Садақа байлықты кемітпейді. Алла кешіру үшін бандасының тек құрметін арттырады, ал Алла үшін кішіпейіл болған адамды тек Алла жоғарылатады.»* — Сахих Муслим 2588 (**Сахих**)","*«Жарты хұрмамен болса да Оттан қорғаныңдар.»* — Сахих әл-Бухари 1413, Сахих Муслим 1016 (**Сахих**)"],"scholars":["**Ибн әл-Қаййим** — *«Садақа күнәны суды оттай өшіргендей өшіреді. Денені жазады, мүлікті тазартады және ешбір кілт ашпайтын есіктерді ашады.»* — *Әл-Уабиль әс-Саййиб*","**Али ибн Әби Талиб** — *«Мүлкіңіз алынып кетпей тұрып садақа бер.»* — Кеңінен айтылады."],"lessons":["Садақа көбейеді — бір беру актісі Алла алдында жеті жүз немесе одан да артық деп есептеледі (2:261).","Ешбір сомасы аз емес — жарты хұрма да Оттан қорғай алады.","Жай пайдаланып болған нәрседен емес, сүйетіннен беріңіз (3:92) — бұл шынайы садақаның деңгейі.","Өлімнен кейін де жалғасатын тұрақты садақа (садақа жария) орнатыңыз: құдық, мектеп, Құран.\n---"]}}},{"id":"community","categoryId":"society","order":39,"translations":{"en":{"name":"Community","quran":[{"reference":"49:10","text":"\"The believers are but brothers, so make settlement between your brothers. And fear Allah that you may receive mercy.\""},{"reference":"3:103","text":"\"And hold firmly to the rope of Allah all together and do not become divided.\""},{"reference":"9:71","text":"\"The believing men and believing women are allies of one another. They enjoin what is right and forbid what is wrong.\""}],"hadith":["*\"The believers in their mutual love, mercy, and compassion are like one body — when one part suffers, the rest of the body responds with sleeplessness and fever.\"* — Sahih al-Bukhari 6011, Sahih Muslim 2586 (**Sahih**)","*\"Jama'ah (the community) is a mercy and division is a punishment.\"* — Musnad Ahmad (**Hasan** per scholars of hadith)"],"scholars":["**Ibn Taymiyyah** — *\"The Muslim community is a single entity. Its strength is the strength of all; its weakness is the weakness of all.\"* — *Majmu' al-Fatawa*","**Imam Al-Ghazali** — *\"A Muslim is obligated to contribute to his community — through his time, his wealth, his knowledge, or at minimum his prayer.\"* — *Ihya' Ulum ad-Din*"],"lessons":["Muslims are one body — what affects your neighbour or community affects you.","Division is a punishment; unity is a mercy — work actively to resolve disputes and maintain community bonds.","Enjoining good and forbidding wrong is a shared communal duty, not only for scholars or leaders.","Contribute something to your community — time, wealth, knowledge, or prayer for it.\n---"]},"ru":{"name":"Община","quran":[{"reference":"49:10","text":"«Воистину, верующие — братья. Примиряйте же своих братьев и бойтесь Аллаха, — быть может, вы будете помилованы.»"},{"reference":"3:103","text":"«Держитесь за вервь Аллаха все вместе и не распадайтесь.»"},{"reference":"9:71","text":"«Верующие мужчины и верующие женщины являются друзьями и помощниками друг другу. Они велят совершать одобряемое и запрещают предосудительное.»"}],"hadith":["*«Верующие в своей любви, милосердии и сострадании подобны одному телу: если одна из частей страдает, всё тело страдает от бессонницы и горячки.»* — Сахих аль-Бухари 6011, Сахих Муслим 2586 (**Достоверный**)","*«Джамаат (общество) — это милость, а разделение — наказание.»* — Муснад Ахмад (**Хороший** по учёным хадиса)"],"scholars":["**Ибн Таймийя** — *«Мусульманская умма — единая сущность. Её сила — сила всех; её слабость — слабость всех.»* — *Маджму аль-Фатава*","**Имам аль-Газали** — *«Мусульманин обязан вносить вклад в свою общину: своим временем, имуществом, знаниями или хотя бы своей молитвой за неё.»* — *Ихья Улюм ад-Дин*"],"lessons":["Мусульмане — одно тело: то, что затрагивает вашего соседа или общину, затрагивает и вас.","Разделение — наказание; единство — милость: активно работайте над разрешением споров и сохранением общественных связей.","Повеление одобряемого и запрещение порицаемого — общая обязанность, а не только для учёных или руководителей.","Вносите вклад в свою общину: время, имущество, знания или молитва за неё.\n---"]},"kk":{"name":"Қауым","quran":[{"reference":"49:10","text":"«Расында, мүміндер бауырлар. Сондықтан бауырларыңыздың арасын бітістіріңіздер.»"},{"reference":"3:103","text":"«Барлығыңыз бірге Алланың арқанынан ұстаңыздар және айрылмаңыздар.»"},{"reference":"9:71","text":"«Мүмін еркектер мен мүмін әйелдер бір-бірінің достары. Олар жақсылықты бұйырып, жамандықтан тыяды.»"}],"hadith":["*«Мүміндер өзара сүйіспеншілік, мейірімділік және рақымдарында бір дене сияқты: бір мүше ауырса, бүкіл дене ұйқысыздық пен безге ұшырайды.»* — Сахих әл-Бухари 6011, Сахих Муслим 2586 (**Сахих**)","*«Жамағат — рахмет, ал бөлінушілік — азап.»* — Муснад Ахмад (**Хасан**, хадис ғалымдары бойынша)"],"scholars":["**Ибн Таймийя** — *«Мұсылман үмметі — бір тұтастық. Оның күші — бәрінің күші; оның әлсіздігі — бәрінің әлсіздігі.»* — *Мажму әл-Фатауа*","**Имам әл-Ғазали** — *«Мұсылман өз қауымына — уақытымен, мүлкімен, білімімен немесе кем дегенде одан дұғасымен — үлес қосуға міндетті.»* — *Ихья Улюм ад-Дин*"],"lessons":["Мұсылмандар — бір дене: көршіңізге немесе қауымыңызға тиетін нәрсе сізге де тиеді.","Бөлінушілік — азап; бірлік — рахмет: даулас шешіп, қауымдық байланыстарды белсенді сақтаңыз.","Жақсылықты бұйырып, жамандықты тыю — жалпы міндет, тек ғалымдар мен жетекшілер үшін ғана емес.","Қауымыңызға бірдеңе үлес қосыңыз — уақыт, мүлік, білім немесе одан дұға.\n---"]}}},{"id":"respect-for-people","categoryId":"society","order":40,"translations":{"en":{"name":"Respect for People","quran":[{"reference":"17:70","text":"\"And We have certainly honoured the children of Adam.\""},{"reference":"49:11","text":"\"Do not let a people ridicule another people... do not insult one another and do not call each other by [offensive] nicknames.\""},{"reference":"49:12","text":"\"Avoid much [negative] assumption... do not spy, and do not backbite one another.\""}],"hadith":["*\"Your blood, your wealth, and your honour are sacred among you, as sacred as this day of yours, in this month of yours, in this city of yours.\"* — Sahih al-Bukhari 1741, Sahih Muslim 1679 (**Sahih**, Farewell Sermon)","*\"The Muslim is the one from whose tongue and hand the people are safe.\"* — Sahih al-Bukhari 10 (**Sahih**)"],"scholars":["**Umar ibn Al-Khattab** — *\"Hold people in good esteem until you know otherwise.\"* — Widely attributed.","**Imam An-Nawawi** — *\"Among the most important rights of a Muslim upon another is the protection of his honour — in his presence and his absence.\"* — *Riyadh as-Salihin*"],"lessons":["Every human being has been honoured by Allah (17:70) — disrespect contradicts the Quran's foundational view of humanity.","The Prophet ﷺ made honour as sacred as blood and wealth in his final public address.","Protect people's honour in their absence — backbiting and slander are major sins.","Assume the best of people until you know otherwise; suspicion is itself forbidden (49:12).\n---"]},"ru":{"name":"Уважение к людям","quran":[{"reference":"17:70","text":"«Мы почтили сынов Адама.»"},{"reference":"49:11","text":"«Не насмехайтесь друг над другом... не оскорбляйте друг друга и не называйте друг друга обидными прозвищами.»"},{"reference":"49:12","text":"«Избегайте многих предположений... Не следите друг за другом и не злословьте друг о друге.»"}],"hadith":["*«Ваша кровь, ваше имущество и ваша честь священны между вами, как священен этот ваш день в этот месяц в этом вашем городе.»* — Сахих аль-Бухари 1741, Сахих Муслим 1679 (**Достоверный**, Прощальная проповедь)","*«Мусульманин — тот, от языка и руки которого в безопасности другие мусульмане.»* — Сахих аль-Бухари 10 (**Достоверный**)"],"scholars":["**Умар ибн аль-Хаттаб** — *«Думайте о людях хорошо, пока не узнаете обратного.»* — Широко приписывается.","**Имам ан-Навави** — *«Среди важнейших прав мусульманина перед другим — защита его чести в его присутствии и в его отсутствие.»* — *Рияд ас-Салихин*"],"lessons":["Каждый человек почтён Аллахом (17:70) — неуважение к нему противоречит основополагающему взгляду Корана на человечество.","Пророк ﷺ сделал честь такой же священной, как кровь и имущество, в своей последней публичной речи.","Берегите честь людей в их отсутствие — сплетни и клевета являются тяжкими грехами.","Предполагайте о людях лучшее, пока не убедитесь в обратном; подозрение само по себе запрещено (49:12).\n---"]},"kk":{"name":"Адамдарға деген құрмет","quran":[{"reference":"17:70","text":"«Расында, Біз Адам ұрпағын ілтипатқа бөлдік.»"},{"reference":"49:11","text":"«Бір-бірлеріңізді мазақ қылмаңдар... бір-бірлеріңізді жаман атпен атамаңдар.»"},{"reference":"49:12","text":"«Көп гумандарды болдырмаңдар... бір-бірлеріңізді тыңшылықпен тіз алмаңдар, бір-бірлеріңізді дерексіз жырламаңдар.»"}],"hadith":["*«Қандарыңыз, мүліктеріңіз және намыстарыңыз арандарыңда осы күндеріңіз, осы айларыңыз, осы қалаларыңыздай қасиетті.»* — Сахих әл-Бухари 1741, Сахих Муслим 1679 (**Сахих**, Қоштасу сөзінен)","*«Мұсылман — тілі мен қолынан басқа мұсылмандар аман болатын адам.»* — Сахих әл-Бухари 10 (**Сахих**)"],"scholars":["**Омар ибн әл-Хаттаб** — *«Кереғарын білмейінше адамдар туралы жақсы ойлаңыз.»* — Кеңінен айтылады.","**Имам ән-Науауи** — *«Мұсылманның мұсылман алдындағы ең маңызды құқықтарының бірі — оның намысын жоқта да, жасқа да сақтау.»* — *Рияд ас-Салихин*"],"lessons":["Алла Адам ұрпағының барлығын ілтипатқа бөлді (17:70) — кемсіту Құрандық адамзат туралы негізгі көзқарасқа қайшы.","Пайғамбар ﷺ намысты соңғы жария сөзінде қан мен мүлікпен теңдей қасиетті деп жариялады.","Адамдардың намысын жоқта сақтаңыз — өсек пен жала — үлкен күнәлар.","Білгенше адамдар туралы жақсы ойлаңыз; күмандану өзі тыйым салынған (49:12).\n---"]}}},{"id":"keeping-promises","categoryId":"society","order":41,"translations":{"en":{"name":"Keeping Promises","quran":[{"reference":"5:1","text":"\"O you who have believed, fulfil [all] contracts.\""},{"reference":"17:34","text":"\"And fulfil [every] commitment. Indeed, the commitment is ever [that about which one will be] questioned.\""},{"reference":"9:4","text":"\"So fulfil for them their treaty to the end of its term.\""}],"hadith":["*\"The signs of a hypocrite are three: when he speaks, he lies; when he promises, he breaks it; when he is entrusted, he betrays.\"* — Sahih al-Bukhari 33, Sahih Muslim 59 (**Sahih**)","*\"There is no faith in one who has no trustworthiness, and there is no religion in one who does not keep his promises.\"* — Musnad Ahmad 12567 (**Hasan** per Al-Albani)"],"scholars":["**Ali ibn Abi Talib** — *\"Do not promise what you cannot fulfil, for the tongue is the messenger of the heart — and a lying tongue exposes a betraying heart.\"* — Widely attributed.","**Imam Al-Ghazali** — *\"Breaking a promise is a form of lying — and it corrupts trust in the relationship that no amount of good deeds can easily repair.\"* — *Ihya' Ulum ad-Din*"],"lessons":["Breaking promises is a defining sign of hypocrisy — the bar is extremely high in Islam.","Every commitment will be questioned on the Day of Judgement (17:34).","Do not make a promise unless you intend to keep it — better to say *\"insha'Allah I will try\"* than to commit carelessly.","If you cannot fulfil a commitment, communicate early and honestly.\n---"]},"ru":{"name":"Выполнение обещаний","quran":[{"reference":"5:1","text":"«О те, кто уверовал! Выполняйте обязательства.»"},{"reference":"17:34","text":"«Выполняйте обязательства, ибо об обязательствах будут спрошены.»"},{"reference":"9:4","text":"«Выполняйте по отношению к ним договор до истечения его срока.»"}],"hadith":["*«Признаки лицемера три: когда говорит — лжёт, когда обещает — нарушает, когда ему доверяют — предаёт.»* — Сахих аль-Бухари 33, Сахих Муслим 59 (**Достоверный**)","*«Нет веры у того, у кого нет надёжности, и нет религии у того, кто не соблюдает обещаний.»* — Муснад Ахмад 12567 (**Хороший** по аль-Альбани)"],"scholars":["**Али ибн Аби Талиб** — *«Не обещай того, что не можешь выполнить, ибо язык — посланник сердца, и лжецы язык обнажает предающее сердце.»* — Широко приписывается.","**Имам аль-Газали** — *«Нарушение обещания — форма лжи, и оно разрушает доверие в отношениях так, что никакое количество добрых дел не может легко восстановить его.»* — *Ихья Улюм ад-Дин*"],"lessons":["Нарушение обещаний — определяющий признак лицемерия: в Исламе требования очень высоки.","Каждое обязательство будет спрошено в Судный день (17:34).","Не давайте обещания, если не намерены его исполнить — лучше сказать *«иншааллах, я постараюсь»*, чем брать на себя обязательство безрассудно.","Если вы не можете выполнить обязательство, сообщите об этом заблаговременно и честно.\n---"]},"kk":{"name":"Уәдені орындау","quran":[{"reference":"5:1","text":"«Ей, иман келтіргендер! Уағыттарыңызды орындаңдар.»"},{"reference":"17:34","text":"«Уағытты орындаңдар, расында уағыт туралы сұралады.»"},{"reference":"9:4","text":"«Оларға шарттарын мерзімі өткенше орындаңдар.»"}],"hadith":["*«Мұнафықтың үш белгісі: сөйлесе өтірік, уәде берсе бұзады, аманат берілсе қиянат жасайды.»* — Сахих әл-Бухари 33, Сахих Муслим 59 (**Сахих**)","*«Аманаты жоқтың иманы жоқ, уәдесін орындамайтынның діні жоқ.»* — Муснад Ахмад 12567 (**Хасан**, әл-Албани бойынша)"],"scholars":["**Али ибн Әби Талиб** — *«Орындай алмайтыныңды уәде берме, өйткені тіл — жүректің елшісі, ал өтірікші тіл — сататын жүректі ашады.»* — Кеңінен айтылады.","**Имам әл-Ғазали** — *«Уәдені бұзу — өтірік формасы, ол қарым-қатынастағы сенімді ешбір жақсы іс-әрекет оңай орнына келтіре алмайтындай жояды.»* — *Ихья Улюм ад-Дин*"],"lessons":["Уәдені бұзу — мұнафықтықтың анықтаушы белгісі: Исламда талаптар өте жоғары.","Әрбір міндеттеме Қияметте сұралады (17:34).","Орындамақ болмаған уәдені бермеңіз — немқұрайды міндеттеме алудан «иншааллах, тырысамын» деу дұрыс.","Егер міндеттемені орындай алмасаңыз, ерте және шыншыл хабарлаңыз.\n---"]}}},{"id":"good-manners","categoryId":"society","order":42,"translations":{"en":{"name":"Good Manners","quran":[{"reference":"25:63","text":"\"The servants of the Most Merciful are those who walk upon the earth in humility, and when the ignorant address them, they say [words of] peace.\""},{"reference":"31:19","text":"\"And be moderate in your pace and lower your voice; indeed, the most disagreeable of sounds is the voice of donkeys.\""},{"reference":"3:159","text":"\"So by mercy from Allah, [O Muhammad], you were lenient with them. And if you had been rude in speech and harsh in heart, they would have disbanded from about you.\""}],"hadith":["*\"The heaviest thing placed on the scales on the Day of Resurrection will be good character.\"* — Jami' at-Tirmidhi 2002 (**Sahih** per Al-Albani)","*\"I was sent only to perfect good character.\"* — Al-Muwatta, Musnad Ahmad (**Sahih** per Al-Albani)"],"scholars":["**Imam Al-Ghazali** — *\"Good manners are the fruit of good character. A person with a well-trained soul naturally speaks well, walks with dignity, and treats people with care.\"* — *Ihya' Ulum ad-Din*","**Ibn al-Qayyim** — *\"The Prophet ﷺ was sent to perfect character — meaning that character is the core of the religion, and all ritual worship exists to polish it.\"* — *Zad al-Ma'ad*"],"lessons":["The Prophet ﷺ described his entire mission as perfecting good character — it is not secondary to worship.","Good character is the heaviest thing on the scales of judgement — prioritise it above status and appearance.","Gentleness and lenience in speech draws people toward Islam; harshness drives them away (3:159).","Good manners begin with self: moderate your voice, your walk, your look, your words.\n-e \n---"]},"ru":{"name":"Хорошие манеры","quran":[{"reference":"25:63","text":"«Рабы Милостивого — те, которые ступают по земле смиренно, а когда невежды обращаются к ним с речью, они говорят: \"Мир!\"»"},{"reference":"31:19","text":"«Будь умерен в своей походке и понижай свой голос. Воистину, самый неприятный из голосов — это рёв ослов.»"},{"reference":"3:159","text":"«По милости Аллаха ты [О Мухаммад] был мягок с ними. Если бы ты был грубым и жестокосердным, то они непременно покинули бы тебя.»"}],"hadith":["*«Самое тяжёлое на весах [деяний] в Судный день — хороший характер.»* — Джами ат-Тирмизи 2002 (**Достоверный** по аль-Альбани)","*«Я был послан лишь для того, чтобы довести до совершенства благородные качества характера.»* — аль-Муватта, Муснад Ахмад (**Достоверный** по аль-Альбани)"],"scholars":["**Имам аль-Газали** — *«Хорошие манеры — плод хорошего характера. Человек с воспитанной душой естественным образом говорит хорошо, ходит с достоинством и обращается с людьми с заботой.»* — *Ихья Улюм ад-Дин*","**Ибн аль-Каййим** — *«Пророк ﷺ был послан для совершенствования характера — значит, характер является ядром религии, а всё ритуальное поклонение существует для его шлифовки.»* — *Зад аль-Маад*"],"lessons":["Пророк ﷺ описал всю свою миссию как совершенствование характера — это не второстепенное к поклонению.","Хороший характер является самым весомым на весах суждения — ставьте его выше статуса и внешности.","Мягкость и снисходительность в речи привлекает людей к Исламу; жёсткость отталкивает (3:159).","Хорошие манеры начинаются с себя: умерьте голос, походку, взгляд, слова.\n---"]},"kk":{"name":"Жақсы мінез-құлық","quran":[{"reference":"25:63","text":"«Рахманның бандалары — жер бетінде кішіпейілмен жүретіндер; надандар оларға сөз айтса, \"Сәлем\" деп жауап береді.»"},{"reference":"31:19","text":"«Жүрісіңді орташа ет және даусыңды бастыр. Расында, дауыстардың ең жаманы — есектің айғайы.»"},{"reference":"3:159","text":"«Алланың рахметімен сен оларға жұмсақ болдың. Егер қатты жүректі болсаң, олар сенің айналаңнан шашырайтын еді.»"}],"hadith":["*«Қияметте таразыда ең ауыры — жақсы мінез-құлық.»* — Жами ат-Тирмизи 2002 (**Сахих**, әл-Албани бойынша)","*«Мен тек ізгі мінез-құлықты жетілдіру үшін жіберілдім.»* — Әл-Мауатта, Муснад Ахмад (**Сахих**, әл-Албани бойынша)"],"scholars":["**Имам әл-Ғазали** — *«Жақсы мінез-құлық — жақсы мінездің жемісі. Тәрбиеленген жаны бар адам табиғи түрде жақсы сөйлейді, абыроймен жүреді және адамдармен мұқияттықпен қарайды.»* — *Ихья Улюм ад-Дин*","**Ибн әл-Қаййим** — *«Пайғамбар ﷺ мінез-құлықты жетілдіру үшін жіберілді — яғни мінез-құлық діннің өзегі, ал барлық ритуалдық ғибадат оны ұстай үшін өмір сүреді.»* — *Зад әл-Маад*"],"lessons":["Пайғамбар ﷺ бүкіл миссиясын мінез-құлықты жетілдіру ретінде сипаттады — бұл ғибадатқа қосымша емес.","Жақсы мінез-құлық — үкім таразысында ең ауыр нәрсе: оны мәртебе мен сыртқы келбеттен жоғары қойыңыз.","Сөйлеудегі жұмсақтық пен кеңшілік адамдарды Исламға тартады; қаталдық итереді (3:159).","Жақсы мінез-құлық өзіңнен басталады: дауысты, жүрісті, көзқарасты, сөздерді орташалаңыз.\n---"]}}},{"id":"sports","categoryId":"health","order":43,"translations":{"en":{"name":"Sports","quran":[{"reference":"8:60","text":"\"And prepare against them whatever you are able of power and of steeds of war by which you may terrify the enemy of Allah and your enemy.\""},{"reference":"2:195","text":"\"And do not throw [yourselves] with your [own] hands into destruction.\""}],"hadith":["*\"The strong believer is better and more beloved to Allah than the weak believer, though both are good.\"* — Sahih Muslim 2664 (**Sahih**)","*\"Teach your children swimming, archery, and horse-riding.\"* — Al-Bayhaqi, Shu'ab al-Iman (**Hasan** per scholars; widely cited by Imam An-Nawawi)"],"scholars":["**Imam An-Nawawi** — *\"Physical training and activities that strengthen the body for worship and service are encouraged in Islam.\"* — *Sharh Sahih Muslim*","**Ibn al-Qayyim** — *\"The body is a trust — neglecting its strength is a form of ingratitude for the gift of health.\"* — *Zad al-Ma'ad*"],"lessons":["Physical strength is beloved to Allah — a strong believer is better than a weak one in both worship and service.","Exercise and physical training are acts of preserving a trust — your body belongs to Allah.","Sport that builds discipline, health, and community cohesion is encouraged in the Sunnah.","Choose activities that strengthen the body without harming it through excess or forbidden means.\n---"]},"ru":{"name":"Спорт","quran":[{"reference":"8:60","text":"«Приготовьте против них столько сил и боевых коней, сколько сможете.»"},{"reference":"2:195","text":"«Не бросайте себя своими же руками на погибель.»"}],"hadith":["*«Сильный верующий лучше и более любим Аллахом, чем слабый верующий, хотя в каждом из них есть благо.»* — Сахих Муслим 2664 (**Достоверный**)","*«Обучайте своих детей плаванию, стрельбе из лука и верховой езде.»* — аль-Байхаки, Шуаб аль-Иман (**Хороший** по учёным; широко цитируется имамом ан-Навави)"],"scholars":["**Имам ан-Навави** — *«Физические упражнения и виды деятельности, укрепляющие тело для поклонения и служения, поощряются в Исламе.»* — *Шарх Сахих Муслим*","**Ибн аль-Каййим** — *«Тело — это аманат: пренебрегать его силой является формой неблагодарности за дар здоровья.»* — *Зад аль-Маад*"],"lessons":["Физическая сила любима Аллахом — сильный верующий лучше в поклонении и служении.","Физические упражнения и тренировки — акты сохранения аманата: ваше тело принадлежит Аллаху.","Спорт, укрепляющий дисциплину, здоровье и сплочённость общины, поощряется в Сунне.","Выбирайте занятия, укрепляющие тело без вреда через излишество или запрещённые средства.\n---"]},"kk":{"name":"Спорт","quran":[{"reference":"8:60","text":"«Оларға қарсы мүмкіндігіңіз жеткенше күш дайындаңдар.»"},{"reference":"2:195","text":"«Өздеріңізді өз қолдарыңызбен қирауға тастамаңдар.»"}],"hadith":["*«Күшті мүмін Алланың алдында әлсіз мүміннен жақсырақ және сүйіктірек, екеуінде де қайырым бар.»* — Сахих Муслим 2664 (**Сахих**)","*«Балаларыңызды жүзуге, садақ атуға және атқа мінуге үйретіңіздер.»* — Байхаки, Шуаб әл-Иман (**Хасан**, ғалымдар бойынша; имам ән-Науауи жиі келтіреді)"],"scholars":["**Имам ән-Науауи** — *«Денені ғибадат пен қызметке нығайтатын физикалық жаттығулар мен іс-шаралар Исламда ынталандырылады.»* — *Шарх Сахих Муслим*","**Ибн әл-Қаййим** — *«Дене — аманат: оның күшін елемеу — денсаулық сыйлығына ризашылықсыздық формасы.»* — *Зад әл-Маад*"],"lessons":["Физикалық күш Алланың алдында сүйікті — күшті мүмін ғибадат пен қызметте жақсырақ.","Жаттығу және физикалық дайындық — аманатты сақтау актілері: денеңіз Аллаға тиесілі.","Тәртіп, денсаулық және қауымдық ынтымақтастықты нығайтатын спорт Сүннетте ынталандырылады.","Асыра-пайдалану немесе тыйым салынған амалдар арқылы денеге зиян тигізбейтін іс-шараларды таңдаңыз.\n---"]}}},{"id":"physical-strength","categoryId":"health","order":44,"translations":{"en":{"name":"Physical Strength","quran":[{"reference":"8:60","text":"\"And prepare against them whatever you are able of power.\""},{"reference":"28:26","text":"\"One of them said: 'O my father, hire him. Indeed, the best one you can hire is the strong and the trustworthy.'\""},{"reference":"2:247","text":"\"Allah has chosen him [the king] over you and has increased him in knowledge and stature.\"* (Physical stature listed as a divine gift of leadership)"}],"hadith":["*\"The strong believer is better and more beloved to Allah than the weak believer, though both are good.\"* — Sahih Muslim 2664 (**Sahih**)","*\"Your body has a right over you.\"* — Sahih al-Bukhari 1975 (**Sahih**)"],"scholars":["**Ibn al-Qayyim** — *\"Physical health is the foundation of all other forms of health — spiritual, mental, and social. Its preservation is one of the five objectives of Islamic law (*maqasid*).\"* — *Zad al-Ma'ad*","**Umar ibn Al-Khattab** — *\"Teach your children swimming, archery, and riding. A man who cannot defend himself and his family has fallen short.\"* — Widely attributed; related to the narration in Al-Bayhaqi."],"lessons":["Strength is an Islamic value — physical capability enables worship, family protection, and community service.","Your body has rights over you (Sahih al-Bukhari 1975) — rest, exercise, and care are religious obligations.","Preserving physical health is one of the five objectives (*maqasid*) of Islamic law.","Build strength with the intention of better worship and service — this transforms exercise into an act of worship.\n---"]},"ru":{"name":"Физическая сила","quran":[{"reference":"8:60","text":"«Приготовьте против них столько сил, сколько сможете.»"},{"reference":"28:26","text":"«Одна из них сказала: \"О отец мой! Найми его. Воистину, лучший из тех, кого ты можешь нанять, — сильный и надёжный\".»"},{"reference":"2:247","text":"«Аллах избрал его над вами и увеличил ему знания и тело.»* (Физическое сложение упомянуто как дар руководства)"}],"hadith":["*«Сильный верующий лучше и более любим Аллахом, чем слабый верующий.»* — Сахих Муслим 2664 (**Достоверный**)","*«У твоего тела есть право на тебя.»* — Сахих аль-Бухари 1975 (**Достоверный**)"],"scholars":["**Ибн аль-Каййим** — *«Физическое здоровье — основа всех прочих видов здоровья: духовного, психического и социального. Его сохранение — одна из пяти целей исламского права (*макасид*).»* — *Зад аль-Маад*","**Умар ибн аль-Хаттаб** — *«Учите своих детей плаванию, стрельбе из лука и верховой езде. Мужчина, который не может защитить себя и свою семью, не выполнил своего долга.»* — Широко приписывается."],"lessons":["Сила — исламская ценность: физические возможности позволяют поклоняться, защищать семью и служить общине.","Ваше тело имеет права на вас (Сахих аль-Бухари 1975) — отдых, физические упражнения и забота являются религиозными обязанностями.","Сохранение физического здоровья — одна из пяти целей (*макасид*) исламского права.","Укрепляйте здоровье с намерением лучше поклоняться и служить — это превращает физические упражнения в поклонение.\n---"]},"kk":{"name":"Физикалық күш","quran":[{"reference":"8:60","text":"«Мүмкіндігіңіз жеткенше күш дайындаңдар.»"},{"reference":"28:26","text":"«Олардың бірі: \"Атам, оны жалдай гөр. Расында жалдаулы адамдардың ең жақсысы — күшті де сенімді адам\" деді.»"},{"reference":"2:247","text":"«Алла оны сендерден таңдап алды және оны білім мен дене жағынан арттырды.»* (Физикалық дене — жетекшілік сыйы ретінде аталған)"}],"hadith":["*«Күшті мүмін Алланың алдында әлсіз мүміннен жақсырақ және сүйіктірек.»* — Сахих Муслим 2664 (**Сахих**)","*«Денеңнің сенің алдыңда құқығы бар.»* — Сахих әл-Бухари 1975 (**Сахих**)"],"scholars":["**Ибн әл-Қаййим** — *«Физикалық денсаулық — барлық денсаулық түрлерінің негізі: рухани, психикалық және әлеуметтік. Оны сақтау — Ислам заңының бес мақсатының (*мақасид*) бірі.»* — *Зад әл-Маад*","**Омар ибн әл-Хаттаб** — *«Балаларыңызды жүзуге, садақ атуға және атқа мінуге үйретіңіздер. Өзін де, отбасын да қорғай алмайтын еркек міндетін орындамаған.»* — Кеңінен айтылады."],"lessons":["Күш — Исламдық құндылық: физикалық мүмкіндіктер ғибадат жасауға, отбасын қорғауға және қауымға қызмет етуге мүмкіндік береді.","Денеңіздің сіздің алдыңызда құқығы бар (Сахих әл-Бухари 1975) — демалу, жаттығу және күтім — діни міндеттер.","Физикалық денсаулықты сақтау — Ислам заңының бес мақсатының (*мақасид*) бірі.","Жақсырақ ғибадат жасап, қызмет ету ниетімен күш алыңыз — бұл жаттығуды ғибадатқа айналдырады.\n---"]}}},{"id":"cleanliness","categoryId":"health","order":45,"translations":{"en":{"name":"Cleanliness","quran":[{"reference":"2:222","text":"\"Indeed, Allah loves those who are constantly repentant and loves those who purify themselves.\""},{"reference":"74:4–5","text":"\"And your clothing purify. And uncleanliness avoid.\""},{"reference":"9:108","text":"\"Within it are men who love to purify themselves; and Allah loves those who purify themselves.\""}],"hadith":["*\"Purity is half of faith.\"* — Sahih Muslim 223 (**Sahih**)","*\"The fitra consists of five things: circumcision, shaving the pubic hair, trimming the moustache, cutting the nails, and plucking the underarm hair.\"* — Sahih al-Bukhari 5889, Sahih Muslim 257 (**Sahih**)"],"scholars":["**Imam An-Nawawi** — *\"Purity (*taharah*) is the key to prayer and the foundation of a Muslim's daily life. Without it, the most essential act of worship is invalid.\"* — *Al-Majmu'*","**Imam Al-Ghazali** — *\"External cleanliness reflects internal cleanliness. The one who maintains his body and environment pure is better prepared for the purity of the heart.\"* — *Ihya' Ulum ad-Din*"],"lessons":["Purity is half of faith — it is not a minor detail but a foundational pillar of Islamic life.","Wudu (ablution) is required five times a day — it keeps a Muslim in a near-constant state of physical and spiritual cleanliness.","The fitra practices (personal hygiene standards) are Sunnah — maintain them regularly.","Clean environment, clean clothing, and clean body all contribute to the quality of worship and mental clarity.\n---"]},"ru":{"name":"Чистота","quran":[{"reference":"2:222","text":"«Воистину, Аллах любит кающихся и любит очищающихся.»"},{"reference":"74:4–5","text":"«И очисти одежды свои. И скверны избегай.»"},{"reference":"9:108","text":"«В нём есть люди, которые любят очищаться. Аллах любит очищающихся.»"}],"hadith":["*«Чистота — половина веры.»* — Сахих Муслим 223 (**Достоверный**)","*«Фитра состоит из пяти вещей: обрезания, сбривания лобковых волос, подстригания усов, стрижки ногтей и удаления волос из подмышек.»* — Сахих аль-Бухари 5889, Сахих Муслим 257 (**Достоверный**)"],"scholars":["**Имам ан-Навави** — *«Чистота (*тахара*) — ключ к молитве и основа ежедневной жизни мусульманина. Без неё важнейший акт поклонения недействителен.»* — *аль-Маджму*","**Имам аль-Газали** — *«Внешняя чистота отражает внутреннюю чистоту. Тот, кто поддерживает чистоту тела и окружения, лучше подготовлен к чистоте сердца.»* — *Ихья Улюм ад-Дин*"],"lessons":["Чистота — половина веры: это не мелкая деталь, а основополагающий столп исламской жизни.","Омовение (вуду) требуется пять раз в день — оно поддерживает мусульманина в состоянии физической и духовной чистоты.","Практики фитра (стандарты личной гигиены) являются Сунной — поддерживайте их регулярно.","Чистота окружения, одежды и тела способствуют качеству поклонения и душевной ясности.\n---"]},"kk":{"name":"Тазалық","quran":[{"reference":"2:222","text":"«Расында, Алла тауба жасаушыларды және тазаланушыларды сүйеді.»"},{"reference":"74:4–5","text":"«Киімдеріңді тазарт. Лас нәрседен аулақ бол.»"},{"reference":"9:108","text":"«Онда тазалануды сүйетін адамдар бар. Алла тазаланушыларды сүйеді.»"}],"hadith":["*«Тазалық — иманның жартысы.»* — Сахих Муслим 223 (**Сахих**)","*«Фитра бес нәрседен тұрады: сүндет, қасаға жерді алу, мұрт қию, тырнақ қию және қолтық астын алу.»* — Сахих әл-Бухари 5889, Сахих Муслим 257 (**Сахих**)"],"scholars":["**Имам ән-Науауи** — *«Тазалық (*тахара*) — намаздың кілті және мұсылманның күнделікті өмірінің негізі. Онсыз ең маңызды ғибадат акті жарамсыз.»* — *Әл-Мажму*","**Имам әл-Ғазали** — *«Сыртқы тазалық ішкі тазалықты бейнелейді. Дене мен ортасын таза ұстаған адам жүрек тазалығына жақсырақ дайын.»* — *Ихья Улюм ад-Дин*"],"lessons":["Тазалық — иманның жартысы: бұл ұсақ бөлшек емес, Исламдық өмірдің негізгі тірегі.","Дәрет (уду) күнде бес рет керек — бұл мұсылманды физикалық және рухани тазалық күйінде ұстайды.","Фитра тәжірибелері (жеке гигиена стандарттары) — Сүннет: оларды үнемі орындаңыз.","Орта, киім және дене тазалығы ғибадат сапасы мен рухани анықтыққа ықпал етеді.\n---"]}}},{"id":"healthy-lifestyle","categoryId":"health","order":46,"translations":{"en":{"name":"Healthy Lifestyle","quran":[{"reference":"7:31","text":"\"O children of Adam, take your adornment at every masjid, and eat and drink, but be not excessive. Indeed, He likes not those who commit excess.\""},{"reference":"2:195","text":"\"And do not throw [yourselves] with your [own] hands into destruction.\""},{"reference":"5:4","text":"\"They ask you what has been made lawful for them. Say: Lawful for you are [all] good things.\""}],"hadith":["*\"The son of Adam does not fill any vessel worse than his stomach. A few morsels are enough to keep his back straight. But if he must, then a third for food, a third for drink, and a third for his breath.\"* — Jami' at-Tirmidhi 2380, Sunan Ibn Majah 3349 (**Hasan** per At-Tirmidhi)","*\"Your body has a right over you.\"* — Sahih al-Bukhari 1975 (**Sahih**)"],"scholars":["**Ibn al-Qayyim** — *\"More than half of medicine is in moderation of food and drink. Most illness enters the body through the stomach.\"* — *Zad al-Ma'ad*","**Imam Al-Ghazali** — *\"The healthy body is the vehicle of the soul. Neglecting it weakens worship; abusing it destroys it.\"* — *Ihya' Ulum ad-Din*"],"lessons":["Moderation is the Islamic standard for everything — excess in food is explicitly condemned (7:31).","Eat to a third, drink to a third, leave a third for air — this prophetic guide is medically validated.","Avoid what harms the body (2:195) — smoking, intoxicants, and harmful substances are covered under this verse.","A healthy body enables better prayer, more energy for family, and longer life in service of Allah.\n---"]},"ru":{"name":"Здоровый образ жизни","quran":[{"reference":"7:31","text":"«О сыны Адама! Берите свои украшения на каждом месте поклонения. Ешьте и пейте, но не расточительствуйте, ибо Аллах не любит расточителей.»"},{"reference":"2:195","text":"«Не бросайте себя своими же руками на погибель.»"},{"reference":"5:4","text":"«Они спрашивают тебя, что им дозволено. Скажи: \"Вам дозволены блага\".»"}],"hadith":["*«Сын Адама не наполняет сосуда хуже, чем желудок. Сыну Адама достаточно нескольких кусков, чтобы поддержать своё тело в вертикальном положении. Если же он вынужден [есть больше], то треть — для еды, треть — для питья и треть — для дыхания.»* — Джами ат-Тирмизи 2380, Сунан Ибн Маджа 3349 (**Хороший** по ат-Тирмизи)","*«У твоего тела есть право на тебя.»* — Сахих аль-Бухари 1975 (**Достоверный**)"],"scholars":["**Ибн аль-Каййим** — *«Более половины медицины заключается в умеренности в еде и питье. Большинство болезней входит в тело через желудок.»* — *Зад аль-Маад*","**Имам аль-Газали** — *«Здоровое тело — средство передвижения для души. Пренебрежение им ослабляет поклонение; злоупотребление разрушает его.»* — *Ихья Улюм ад-Дин*"],"lessons":["Умеренность — исламский стандарт для всего: излишество в еде прямо осуждается (7:31).","Треть еде, треть питью, треть воздуху — это пророческое руководство подтверждено медициной.","Избегайте того, что вредит телу (2:195) — курение, опьяняющие вещества и вредные субстанции подпадают под этот аят.","Здоровое тело обеспечивает лучшую молитву, больше энергии для семьи и более долгую жизнь на службе Аллаху.\n---"]},"kk":{"name":"Сау өмір салты","quran":[{"reference":"7:31","text":"«Ей, Адам ұрпағы! Масжидтің жанында өздеріңізді сәндеңіз, жеңіздер де, ішіңіздер де, бірақ асып-таспаңдар, расында Алла асып-тасушыларды сүймейді.»"},{"reference":"2:195","text":"«Өздеріңізді өз қолдарыңызбен қирауға тастамаңдар.»"},{"reference":"5:4","text":"«Олар сізден нені халал деп сұрайды? \"Сізге жақсы нәрселер халал\" деп айтыңыз.»"}],"hadith":["*«Адам баласы қарнынан гөрі жаман ыдысты толтырмайды. Адам баласына денесін тік ұстайтын бірнеше тістем жеткілікті. Ал міндетті болса, үштен бірі тамаққа, үштен бірі сусынға, үштен бірі демге.»* — Жами ат-Тирмизи 2380, Сунан Ибн Мажа 3349 (**Хасан**, ат-Тирмизи бойынша)","*«Денеңнің сенің алдыңда құқығы бар.»* — Сахих әл-Бухари 1975 (**Сахих**)"],"scholars":["**Ибн әл-Қаййим** — *«Медицинаның жарты-сынан артығы — тамақ пен сусынды орташалауда. Аурулардың көпшілігі қарын арқылы денеге кіреді.»* — *Зад әл-Маад*","**Имам әл-Ғазали** — *«Сау дене — жанның ат-арбасы. Оны елемеу ғибадатты әлсіретеді; оны пайдаланбастыру оны жояды.»* — *Ихья Улюм ад-Дин*"],"lessons":["Орташалық — барлық нәрсеге арналған Исламдық стандарт: тамақтағы асыра-пайдалану тікелей айыпталады (7:31).","Үштен бірі тамаққа, үштен бірі сусынға, үштен бірі демге — бұл Пайғамбер нұсқаулығы медицинамен расталған.","Денеге зиянды нәрседен аулақ болыңыз (2:195) — темекі, есірткі және зиянды заттар осы аятқа кіреді.","Сау дене — Аллаға қызметте жақсырақ намаз, отбасы үшін қуат және ұзағырақ өмір береді.\n---"]}}},{"id":"sleep","categoryId":"health","order":47,"translations":{"en":{"name":"Sleep","quran":[{"reference":"30:23","text":"\"And of His signs is your sleep by night and day and your seeking of His bounty. Indeed in that are signs for a people who listen.\""},{"reference":"25:47","text":"\"And it is He who has made the night for you as clothing and sleep [a means of] rest and has made the day a resurrection.\""},{"reference":"78:9","text":"\"And made your sleep [a means for] rest.\""}],"hadith":["*\"When any of you goes to bed, let him dust off his bed with the inside of his lower garment, for he does not know what is on it.\"* — Sahih al-Bukhari 6320 (**Sahih**)","*\"The Prophet ﷺ disliked sleeping before 'Isha prayer and talking after it.\"* — Sahih al-Bukhari 568 (**Sahih**)"],"scholars":["**Ibn al-Qayyim** — *\"The Sunnah of sleep — on the right side, with dhikr, after Witr — makes sleep itself a form of worship.\"* — *Zad al-Ma'ad*","**Imam Al-Ghazali** — *\"Sleep is not the enemy of worship — improper sleep is. The one who sleeps in the Sunnah manner and rises for Fajr has made his night wholly productive.\"* — *Ihya' Ulum ad-Din*"],"lessons":["Sleep is a sign of Allah (30:23) — treat it as a divine gift to be used wisely.","Sleep before midnight and rise for Fajr — the Sunnah timetable aligns with natural biological rhythms.","Follow the bedtime Sunnah: sleep on your right side, read *Ayat al-Kursi*, recite the three Quls — it turns sleep into an act of worship.","Avoid excessive sleep; the Prophet ﷺ disliked sleeping before 'Isha except for necessity.\n---"]},"ru":{"name":"Сон","quran":[{"reference":"30:23","text":"«Среди Его знамений — ваш сон ночью и днём и ваши поиски Его милости. Воистину, в этом — знамения для людей слышащих.»"},{"reference":"25:47","text":"«Он — тот, кто сделал для вас ночь покровом, а сон — отдыхом и сделал день пробуждением.»"},{"reference":"78:9","text":"«И сделали ваш сон отдыхом.»"}],"hadith":["*«Когда кто-либо из вас ложится спать, пусть стряхнёт постель изнутри нижней одежды, ибо он не знает, что на ней.»* — Сахих аль-Бухари 6320 (**Достоверный**)","*«Пророк ﷺ не любил спать до молитвы иша и разговаривать после неё.»* — Сахих аль-Бухари 568 (**Достоверный**)"],"scholars":["**Ибн аль-Каййим** — *«Сунна сна — на правом боку, с поминанием Аллаха, после витра — делает сам сон формой поклонения.»* — *Зад аль-Маад*","**Имам аль-Газали** — *«Сон — не враг поклонения: им является неправильный сон. Тот, кто спит по-суннитски и встаёт на фаджр, сделал всю свою ночь продуктивной.»* — *Ихья Улюм ад-Дин*"],"lessons":["Сон — знамение Аллаха (30:23): относитесь к нему как к Божественному дару, который нужно использовать мудро.","Ложитесь спать до полуночи и вставайте на фаджр — распорядок Сунны совпадает с естественными биологическими ритмами.","Следуйте Сунне перед сном: ложитесь на правый бок, читайте Аятуль-Курси, три «Куль» — это превращает сон в поклонение.","Избегайте чрезмерного сна; Пророк ﷺ не любил спать до иша кроме как по необходимости.\n---"]},"kk":{"name":"Ұйқы","quran":[{"reference":"30:23","text":"«Оның аяттарының бірі — түнде де, күндіз де ұйықтауларыңыз және Оның рахметін іздеуіңіз. Расында, бұнда тыңдайтын халыққа аяттар бар.»"},{"reference":"25:47","text":"«Ол — түнді сізге жауып-жасырушы, ұйқыны тынығу және күнді тіршілік ету жасаған.»"},{"reference":"78:9","text":"«Ұйқыларыңды тынығу жасадық.»"}],"hadith":["*«Сендердің бірі ұйқыға жатқанда, төсегін сыртқы киімінің іш бетімен сілкісін, өйткені ол оның үстінде не барын білмейді.»* — Сахих әл-Бухари 6320 (**Сахих**)","*«Пайғамбар ﷺ иша намазына дейін ұйықтауды және одан кейін сөйлесуді жаратпайтын.»* — Сахих әл-Бухари 568 (**Сахих**)"],"scholars":["**Ибн әл-Қаййим** — *«Ұйқының Сүннеті — оң жақта, Алланы зікірлей, уітірден кейін — ұйқының өзін ғибадатқа айналдырады.»* — *Зад әл-Маад*","**Имам әл-Ғазали** — *«Ұйқы — ғибадаттың жауы емес: бұрыс ұйқы. Сүннетпен ұйықтап, Фаджырға тұратын адам бүкіл түнін өнімді өткізеді.»* — *Ихья Улюм ад-Дин*"],"lessons":["Ұйқы — Алланың аяты (30:23): оны Аллахтың сыйлығы ретінде дана пайдаланыңыз.","Түн жарысынан бұрын ұйықтап, Фаджырға тұрыңыз — Сүннеттің кестесі табиғи биологиялық ырғақтарға сай.","Ұйқыға дейінгі Сүннетті орындаңыз: оң жақта жатыңыз, Аят әл-Курсиді оқыңыз, үш \"Қул\" — бұл ұйқыны ғибадатқа айналдырады.","Шамадан тыс ұйықтаудан аулақ болыңыз; Пайғамбар ﷺ қажеттіліктен басқа иша намазынан бұрын ұйықтауды жаратпайтын.\n---"]}}},{"id":"eating","categoryId":"health","order":48,"translations":{"en":{"name":"Eating","quran":[{"reference":"2:168","text":"\"O mankind, eat from whatever is on earth [that is] lawful and good.\""},{"reference":"7:31","text":"\"Eat and drink, but be not excessive. Indeed, He likes not those who commit excess.\""},{"reference":"80:24","text":"\"Then let mankind look at his food.\""}],"hadith":["*\"A third for food, a third for drink, and a third for his breath.\"* — Jami' at-Tirmidhi 2380 (**Hasan**)","*\"Begin your meal with bismillah, eat with your right hand, and eat from what is nearest to you.\"* — Sahih al-Bukhari 5376, Sahih Muslim 2022 (**Sahih**)"],"scholars":["**Ibn al-Qayyim** — *\"Eating halal food in moderation is a condition for the acceptance of du'a and the soundness of worship.\"* — *Zad al-Ma'ad*","**Imam Al-Ghazali** — *\"Hunger sharpens the intellect, softens the heart, and weakens desires. Overeating does the opposite to all three.\"* — *Ihya' Ulum ad-Din*"],"lessons":["Say *bismillah* before eating and eat with the right hand — this is a simple Sunnah with great reward.","Eat from what is nearest to you and do not overreach — even table manners reflect Islamic ethics.","Leave one third of your stomach empty — this is the prophetic standard and is medically sound.","Eating halal and tayyib (good) food is a condition for spiritual clarity; haram food clouds the heart.\n-e \n---"]},"ru":{"name":"Питание","quran":[{"reference":"2:168","text":"«О люди! Вкушайте то, что есть на земле, дозволенное и благое.»"},{"reference":"7:31","text":"«Ешьте и пейте, но не расточительствуйте.»"},{"reference":"80:24","text":"«Пусть же человек посмотрит на свою пищу.»"}],"hadith":["*«Треть — для еды, треть — для питья и треть — для дыхания.»* — Джами ат-Тирмизи 2380 (**Хороший**)","*«Начинай трапезу с бисмилляh, ешь правой рукой и ешь то, что ближе к тебе.»* — Сахих аль-Бухари 5376, Сахих Муслим 2022 (**Достоверный**)"],"scholars":["**Ибн аль-Каййим** — *«Употребление халяльной пищи в умеренных количествах является условием принятия ду'а и правильности поклонения.»* — *Зад аль-Маад*","**Имам аль-Газали** — *«Голод обостряет разум, смягчает сердце и ослабляет страсти. Переедание противоположным образом воздействует на все три.»* — *Ихья Улюм ад-Дин*"],"lessons":["Говорите *бисмилляh* перед едой и ешьте правой рукой — это простая Сунна с великой наградой.","Ешьте то, что ближе к вам, и не тянитесь через стол — даже столовые манеры отражают исламскую этику.","Оставляйте треть желудка пустой — это пророческий стандарт, который подтверждён медицинской наукой.","Употребление халяльной и таййибской (благой) пищи является условием духовной ясности; харамная пища омрачает сердце.\n---"]},"kk":{"name":"Тамақтану","quran":[{"reference":"2:168","text":"«Ей, адамдар! Жердегі халал және дәмді нәрседен жеңдер.»"},{"reference":"7:31","text":"«Жеңдер де, ішіңдер де, бірақ асып-таспаңдар.»"},{"reference":"80:24","text":"«Адам тамағына қарасын.»"}],"hadith":["*«Үштен бірі тамаққа, үштен бірі сусынға, үштен бірі демге.»* — Жами ат-Тирмизи 2380 (**Хасан**)","*«Бисмилляhпен баста, оң қолмен же және саған жақын тұрғаннан же.»* — Сахих әл-Бухари 5376, Сахих Муслим 2022 (**Сахих**)"],"scholars":["**Ибн әл-Қаййим** — *«Халал тамақты орташа жеу — дұғаның қабылдануының және ғибадаттың дұрыстығының шарты.»* — *Зад әл-Маад*","**Имам әл-Ғазали** — *«Аштық ақылды шыңдайды, жүректі жұмсартады және нәпсіні әлсіретеді. Асыра жеу үшеуіне де кері әсер етеді.»* — *Ихья Улюм ад-Дин*"],"lessons":["Жемес бұрын *бисмилляh* айтып, оң қолмен жеңіз — бұл ұлы сыйақысы бар қарапайым Сүннет.","Өзіңізге жақын тұрғаннан жеңіз, асып-таспаңыз — тіпті үстел этикеті Исламдық этиканы бейнелейді.","Асқазанның үштен бірін бос қалдырыңыз — бұл Пайғамбердің стандарты медицинамен расталған.","Халал және таййиб (жақсы) тамақ жеу — рухани анықтықтың шарты; харам тамақ жүректі бұлдырлатады.\n---"]}}},{"id":"prayer","categoryId":"spirituality","order":49,"translations":{"en":{"name":"Prayer","quran":[{"reference":"2:45","text":"\"And seek help through patience and prayer; indeed, it is difficult except for the humbly submissive.\""},{"reference":"29:45","text":"\"Recite what has been revealed to you of the Book and establish prayer. Indeed, prayer prohibits immorality and wrongdoing.\""},{"reference":"20:14","text":"\"Indeed, I am Allah. There is no deity except Me, so worship Me and establish prayer for My remembrance.\""}],"hadith":["*\"The first matter that the servant will be brought to account for on the Day of Judgement is prayer. If it is sound, all his deeds will be sound. If it is corrupt, all his deeds will be corrupt.\"* — Al-Mu'jam al-Awsat, At-Tabarani (**Hasan** per Al-Albani)","*\"Between a man and disbelief and polytheism is the abandonment of prayer.\"* — Sahih Muslim 82 (**Sahih**)"],"scholars":["**Ibn al-Qayyim** — *\"Prayer is the pillar of the religion. It is the nourishment of the soul, the light of the heart, and the link between the servant and his Lord.\"* — *Kitab as-Salah*","**Imam Al-Ghazali** — *\"The outward form of prayer is movement and words. Its reality is the presence of the heart before Allah. Without the heart, the prayer is a shell.\"* — *Ihya' Ulum ad-Din*"],"lessons":["Prayer is the first deed judged on the Day of Judgement — if it is sound, everything else follows.","Prayer actively prevents immorality (29:45) — it is not only a duty but a shield.","Pray on time without delay — the Prophet ﷺ named it the most beloved deed to Allah (Sahih al-Bukhari 527).","Focus on presence of heart (*khushu'*) — the prayer of a distracted heart is valid but loses its transformative power.\n---"]},"ru":{"name":"Намаз (Молитва)","quran":[{"reference":"2:45","text":"«Прибегайте за помощью к терпению и молитве. Воистину, это тяжело, кроме как для смиренных.»"},{"reference":"29:45","text":"«Читай то, что внушено тебе из Писания, и совершай намаз. Воистину, намаз удерживает от мерзости и предосудительного.»"},{"reference":"20:14","text":"«Воистину, Я — Аллах. Нет никакого божества, кроме Меня. Поклоняйся же Мне и совершай молитву, чтобы помнить Меня.»"}],"hadith":["*«Первое, о чём будет спрошен раб в Судный день, — это намаз. Если он будет в порядке, то все остальные деяния будут в порядке. Если он будет испорчен, то все остальные деяния будут испорчены.»* — аль-Муджам аль-Аусат, ат-Табарани (**Хороший** по аль-Альбани)","*«[Граница] между человеком и неверием с многобожием — оставление намаза.»* — Сахих Муслим 82 (**Достоверный**)"],"scholars":["**Ибн аль-Каййим** — *«Намаз — столп религии. Это питание души, свет сердца и связь между рабом и его Господом.»* — *Китаб ас-Салят*","**Имам аль-Газали** — *«Внешняя форма намаза — движения и слова. Его суть — присутствие сердца пред Аллахом. Без сердца намаз — пустая оболочка.»* — *Ихья Улюм ад-Дин*"],"lessons":["Намаз — первое деяние, о котором судят в Судный день: если он в порядке — всё остальное следует за ним.","Намаз активно предотвращает непристойность (29:45) — это не только обязанность, но и щит.","Совершайте намаз вовремя без промедления — Пророк ﷺ назвал это наиболее любимым деянием Аллаха.","Сосредоточьтесь на присутствии сердца (*хушуу*) — молитва рассеянного сердца действительна, но теряет своё преобразующее действие.\n---"]},"kk":{"name":"Намаз","quran":[{"reference":"2:45","text":"«Сабырмен және намазбен көмек сұраңдар. Расында, бұл тек бойұсынушыларға ғана оңай.»"},{"reference":"29:45","text":"«Кітаптан саған уахи берілгенді оқы және намаз оқы. Расында, намаз ұятсыздықтан және жаман нәрседен сақтайды.»"},{"reference":"20:14","text":"«Расында, Мен Алламын. Менен басқа Ілаh жоқ. Маған ғибадат ет және Мені еске алу үшін намаз оқы.»"}],"hadith":["*«Бандадан Қияметте бірінші есеп алынатын нәрсе — намаз. Егер ол жақсы болса, оның барлық амалдары жақсы болады. Егер ол бұзық болса, барлық амалдары бұзық болады.»* — Әл-Мужам әл-Аусат, ат-Табарани (**Хасан**, әл-Албани бойынша)","*«Еркек пен куфр мен ширк арасындағы [шекара] — намазды тастау.»* — Сахих Муслим 82 (**Сахих**)"],"scholars":["**Ибн әл-Қаййим** — *«Намаз — діннің тірегі. Бұл жанның нәрі, жүректің жарығы және банда мен оның Раббысы арасындағы байланыс.»* — *Китаб ас-Салат*","**Имам әл-Ғазали** — *«Намаздың сыртқы формасы — қозғалыстар мен сөздер. Оның шындығы — жүректің Алла алдында болуы. Жүрексіз намаз — бос қабық.»* — *Ихья Улюм ад-Дин*"],"lessons":["Намаз — Қияметте бірінші есеп алынатын амал: егер ол жақсы болса, бәрі соның соңынан жүреді.","Намаз белсенді түрде ұятсыздықтың алдын алады (29:45) — бұл міндет қана емес, қалқан.","Намазды уақытында оқыңыз — Пайғамбар ﷺ мұны Алланың ең сүйікті амалы деп атады.","Жүректің хұзурына назар аударыңыз (*хушуу*) — алаңдаған жүректің намазы жарамды, бірақ өзгертуші күшін жоғалтады.\n---"]}}},{"id":"tawakkul","categoryId":"spirituality","order":50,"translations":{"en":{"name":"Tawakkul","quran":[{"reference":"65:3","text":"\"And whoever relies upon Allah — then He is sufficient for him. I
